# experiment/phase1/eval/config/eval_amendment_d_response_confidence_selfaware_schema_sft_dpo_seed1_smoke_local_4b.yaml
#
# Fast Amendment D smoke for the completed schema-SFT -> DPO seed-1 adapter.
# The base is the merged schema-SFT model; the DPO LoRA is evaluated on top.

model_tag: qwen3-4b-schema-sft-merged-seed1
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_seed1_full/20260622_141511/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_d_response_confidence_selfaware_schema_sft_dpo_seed1_smoke_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: schema_sft_dpo_seed1
    method: schema_sft_dpo
    model: qwen3-4b-schema-sft-merged-seed1
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_sft_dpo_seed1_full/20260622_batch2_accum4_seed1/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
    offset: 2240
    limit: 192
