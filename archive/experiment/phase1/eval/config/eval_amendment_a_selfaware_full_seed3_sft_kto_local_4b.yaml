# experiment/phase1/eval/config/eval_amendment_a_selfaware_full_seed3_sft_kto_local_4b.yaml
#
# Local full SelfAware eval for the clean Amendment A sequential SFT->KTO seed 3
# run. Uses the seed3 merged SFT base (no lowmem remerge was needed for seed3;
# unlike seed2 the original seed3 merge was never confounded), mirroring the
# seed3 SFT->DPO analogue's model paths.

model_tag: qwen3-4b-sft-merged-seed3
model_name: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed3/20260615_104507/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_a_selfaware_full_seed3_sft_kto_local_4b

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 64
  n_samples: 1

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.75
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: sft_kto_seed3
    method: kto
    model: qwen3-4b-sft-merged-seed3
    # staged on HF: professorsynapse/eh-qwen3-4b-seq-sft-kto-seed3-lora @ cb6c246e0e566908f7a4e4844a892d811667cf2d
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_kto__4b__amendment_a__seed3/20260617_070334/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
