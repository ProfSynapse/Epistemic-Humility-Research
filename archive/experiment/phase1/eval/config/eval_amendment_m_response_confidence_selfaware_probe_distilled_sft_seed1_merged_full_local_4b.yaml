# experiment/phase1/eval/config/eval_amendment_m_response_confidence_selfaware_probe_distilled_sft_seed1_merged_full_local_4b.yaml
#
# RETIRED by Amendment M Revision 3 (2026-06-29): the probe-distilled cell is retired
# (near-degenerate target, commit d8414971). Use the probe_factual eval config
# instead. Kept for provenance only.
#
# Amendment M (revision 2): full SelfAware eval for the merged probe-distilled
# schema-SFT seed-1 model. Mirrors the Amendment K / clean-SFT merged-base eval
# EXACTLY (same prompt, gold, generation/vLLM settings, base-only arm with
# adapter:null) so the scored_rows are apples-to-apples vs the clean-SFT base
# (the §4.2 behavior baseline), vs K (the calibrated-but-behavior-broken base),
# and vs GRPO v3. The ONLY difference is model_name -> the probe-distilled
# merged-16bit base.
#
# NOTE: model_name below is a PLACEHOLDER. Fill in the real merged-16bit path
# (the <timestamp>/Qwen3-4B-bnb-4bit/merged-16bit dir produced under the
# sft_schema_probe_distilled_seed1_full output_dir) after the M full run lands,
# exactly as the K config was filled post-training.

model_tag: qwen3-4b-probe-distilled-schema-sft-merged-seed1
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_probe_distilled_seed1_full/FILL_TIMESTAMP/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_m_response_confidence_selfaware_probe_distilled_sft_seed1_merged_full_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: probe_distilled_schema_sft_merged_seed1
    method: probe_distilled_schema_sft_merged
    model: qwen3-4b-probe-distilled-schema-sft-merged-seed1
    adapter: null

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
