# experiment/phase1/eval/config/eval_amendment_e_response_confidence_selfaware_clean_sft_dpo_seed1_smoke_local_4b.yaml
#
# Fast Amendment E smoke for the clean response-confidence SFT -> DPO seed-1
# adapter. SelfAware is ordered known-first, so this uses the mixed slice
# starting at offset 2240, which crosses into the unknown block.

model_tag: qwen3-4b-instruct
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_e_response_confidence_selfaware_clean_sft_dpo_seed1_smoke_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_schema_sft_dpo_seed1
    method: clean_schema_sft_dpo
    model: qwen3-4b-instruct
    # staged on HF: professorsynapse/eh-qwen3-4b-clean-sft-dpo-seed1-lora @ 5808fcf931794027cb2c14c35796d771904dbf9c
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_dpo_seed1_full/20260623_132930/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
    offset: 2240
    limit: 192
