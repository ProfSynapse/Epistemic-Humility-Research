name: kto-4b-headline-seed1-postfix
target: local
method: kto
provider: local_docker
job:
  image: unsloth/unsloth:latest
  pull_policy: missing
  transfer: auto
  keep_container: false
setup:
  pip:
  - trl==0.22.2
  - git+https://github.com/unslothai/unsloth_zoo.git
  - git+https://github.com/unslothai/unsloth.git
  copy:
  - Trainers/kto
  - Trainers/shared
  - shared
  - tuner
  - scratch/eh_staging/kto__4b__headline__seed1_postfix/kto_congruence_train.jsonl
model:
  name: unsloth/Qwen3-4B-bnb-4bit
  max_seq_length: 2048
  load_in_4bit: true
dataset:
  local_file: scratch/eh_staging/kto__4b__headline__seed1_postfix/kto_congruence_train.jsonl
training:
  batch_size: 2
  gradient_accumulation: 4
  learning_rate: 1.0e-06
  num_epochs: 1
  seed: 1
  beta: 0.1
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
artifacts:
  output_root: toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed1_postfix
  run_timestamp: '{timestamp}'
run:
  method: kto
  trainer: Trainers/kto/train_kto.py
