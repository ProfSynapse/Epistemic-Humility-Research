# Amendment AI — PAR GRPO, TRUE arm, seed 1. Byte-clone of
# grpo_schema_clean_sft_merged_seed1_v2_full.yaml with ONLY the reward + data +
# output_dir swapped, and paths localized (/workspace/repo -> local checkout).
# The PAR reward is wired in-code by amendment_ai_launch_arm.py (reads the live
# policy's own pre-gen p from the frozen v2 sensor); the rewards block below is
# left disabled so the launcher owns the reward.
model:
  model_name: "/home/profsynapse/code/Epistemic-Humility-Research/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 1
  use_rslora: false
  use_dora: false

training:
  output_dir: "/home/profsynapse/code/Epistemic-Humility-Research/scratch/schema_response_confidence/runs/amendment_ai_grpo_true_seed1"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.1
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 200
  save_total_limit: 10
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/home/profsynapse/code/Epistemic-Humility-Research/experiment/phase1/probe/analysis/amendment_ai/train/par_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: false
    module: null
    file: null
    functions: []

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 1
