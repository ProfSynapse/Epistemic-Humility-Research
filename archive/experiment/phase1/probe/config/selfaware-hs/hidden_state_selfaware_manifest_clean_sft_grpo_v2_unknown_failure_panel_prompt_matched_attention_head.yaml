# Phase 3 per-head (attention_head granularity) SelfAware hidden-state extraction
# for GRPO v2 unknown failures.
#
# Mirrors the residual_stream prompt-matched config
# (hidden_state_selfaware_manifest_clean_sft_grpo_v2_unknown_failure_panel_prompt_matched.yaml)
# but hooks each decoder block's self_attn.o_proj INPUT, capturing the
# concatenated per-head context vectors (width num_attention_heads * head_dim).
# This is the localization surface ITI (paper:2306.03341) intervenes on: a sparse
# set of attention heads, not the residual stream. Step A.3 ranks heads by
# four-cell separability; Step A.4 steers the top-k during generation.
#
# Same model, prompt, arms, and selection manifest as the residual run so the
# per-head and residual evidence are prompt-matched and directly comparable.

model:
  model_tag: qwen3-4b-clean-sft-grpo-v2-seed1-selfaware
  # staged on HF: professorsynapse/eh-qwen3-4b-clean-sft-seed1-merged-16bit @ ac361232c001af0ed5b0386b06dafc35d5cd31ea
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
  revision: null
  enable_thinking: false

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

extraction:
  granularity: attention_head
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: clean_sft_merged_seed1_base
    adapter_state: disabled
    adapter: null
  - name: clean_sft_grpo_v2_seed1
    adapter_state: active
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: manifests/phase3_current_clean_grpo_v2_unknown_failure_selfaware_manifest.json

output:
  hidden_states_subdir: hidden_states_selfaware_clean_sft_grpo_v2_unknown_failure_panel_prompt_matched_attention_head
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: schema_clean_sft_grpo_v2_seed1_full
  source_split: phase3-current-clean-grpo-v2-unknown-failure-selfaware/v1
