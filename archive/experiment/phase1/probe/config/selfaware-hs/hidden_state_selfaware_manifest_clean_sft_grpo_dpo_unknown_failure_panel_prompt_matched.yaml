# mechinterp focused SelfAware hidden-state extraction for GRPO-DPO unknown failures.
#
# Prompt-matched to the Amendment F GRPO-DPO SelfAware eval that supplied the
# behavior labels. The DPO adapter is applied over the GRPO-v2 merged base, so
# h_base is the two-stage GRPO model and delta isolates the final DPO surface.

model:
  model_tag: qwen3-4b-clean-sft-grpo-dpo-seed1-selfaware
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/Qwen3-4B-clean-sft-grpo-v2/merged-16bit
  revision: null
  enable_thinking: false

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

extraction:
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: clean_sft_grpo_v2_seed1_base
    adapter_state: disabled
    adapter: null
  - name: clean_sft_grpo_dpo_seed1
    adapter_state: active
    # staged on HF: professorsynapse/eh-qwen3-4b-clean-sft-grpo-dpo-seed1-lora @ 865aa404abf7159704c5be531c6dd3c5f9944205
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/clean_sft_grpo_dpo_seed1_full/20260625_031724/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: manifests/phase3_current_clean_grpo_dpo_unknown_failure_selfaware_manifest.json

output:
  hidden_states_subdir: hidden_states_selfaware_clean_sft_grpo_dpo_unknown_failure_panel_prompt_matched
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: clean_sft_grpo_dpo_seed1_full
  source_split: phase3-current-clean-grpo-dpo-unknown-failure-selfaware/v1
