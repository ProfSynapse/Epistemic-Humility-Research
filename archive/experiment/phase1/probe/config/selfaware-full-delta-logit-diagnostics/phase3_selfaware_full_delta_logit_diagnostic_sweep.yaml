# Phase 3 full SelfAware delta logit-diagnostic sweep.
#
# Uses the checked-in sweep wrapper to materialize one runner config per
# candidate and run them serially under distinct output roots.

sweep:
  name: phase3_selfaware_full_delta_logit_diagnostic
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/selfaware-full-delta-logit-diagnostics/phase3_selfaware_full_delta_logit_diagnostic.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/selfaware-full-delta-logit-diagnostics/phase3_selfaware_full_delta_logit_diagnostic.yaml
  output_root: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/causal_pilots/phase3_selfaware_full_delta_logit_diagnostic
  candidates: all
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  modes:
    - name: logit_diagnostic
      max_rows: 16
      coefficients: [1.0, 5.0, 50.0]
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
        - wrong_layer
        - wrong_layer_subtraction
        - random_matched_norm
