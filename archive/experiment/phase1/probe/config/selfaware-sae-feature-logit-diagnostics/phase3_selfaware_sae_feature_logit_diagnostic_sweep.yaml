# Phase 3 SelfAware SAE-feature logit-diagnostic sweep.
#
# Serial Docker execution over exported SAE feature directions. This is a
# coefficient smoke for feature-sized vectors, not a broad causal claim.

sweep:
  name: phase3_selfaware_sae_feature_logit_diagnostic
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/selfaware-sae-feature-logit-diagnostics/phase3_selfaware_sae_feature_logit_diagnostic.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/selfaware-sae-feature-logit-diagnostics/phase3_selfaware_sae_feature_logit_diagnostic.yaml
  output_root: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/causal_pilots/phase3_selfaware_sae_feature_logit_diagnostic
  candidates: all
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  modes:
    - name: logit_diagnostic
      max_rows: 4
      coefficients: [10.0, 50.0]
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
        - wrong_layer
        - wrong_layer_subtraction
        - random_matched_norm
