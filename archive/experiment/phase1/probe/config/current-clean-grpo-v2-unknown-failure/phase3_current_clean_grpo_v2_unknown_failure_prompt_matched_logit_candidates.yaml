# GRPO v2 unknown-failure prompt-matched logit diagnostic inventory.
#
# Directions point from unknown_refused toward unknown_answered_wrong. The
# intended repair/control arm is activation_subtraction, which should increase
# refusal pressure on unknown_answered_wrong rows if the axis is behaviorally
# useful. This config keeps prompt parity with the Amendment E eval prompt that
# produced the behavior labels.

spec:
  name: phase3_current_clean_grpo_v2_unknown_failure_prompt_matched_logit_candidates
  status: logit_diagnostic
  evidence_tier_current: tier1_correlational
  evidence_tier_if_intervention_runs: tier2_exploratory_local
  no_phase1_headline_promotion: true
  no_reward_loop_use: true

model:
  model_tag: qwen3-4b-current-clean-grpo-v2-unknown-failure-selfaware-prompt-matched
  model_name: null
  enable_thinking: false
  token_position_rule: final_prompt_token

runtime_model:
  model_name: null
  revision: null
  adapter_path: null
  torch_dtype: bfloat16
  device_map: cuda
  use_extraction_adapter: true

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with exactly
    two keys: "answer" and "response_confidence". The "answer" value is your
    answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

first_smoke:
  initial_scope:
    generation_allowed_by_this_spec: false

selection:
  max_rows_default: 256
  probe_results: experiment/phase1/probe/qwen3-4b-clean-sft-grpo-v2-seed1-selfaware/hidden_states_selfaware_clean_sft_grpo_v2_unknown_failure_panel_prompt_matched/extraction__88649d66a6fb/rows.jsonl
  row_keys_file: archive/experiment/phase1/probe/config/current-clean-grpo-v2-unknown-failure/phase3_current_clean_grpo_v2_unknown_failure_selfaware_row_keys.txt

coefficient_grid:
  values: [5.0, 10.0, 25.0]

logit_diagnostic:
  top_k: 10

control_settings:
  wrong_layer:
    layer_offsets: [-2, -1, 1, 2]
  random_matched_norm:
    seed: 20260626

