readiness_checks:
  require_extraction_manifest:
    status: ok
    verified: true
    row_count: 256
    label_counts:
      known: 128
      unknown: 128
  require_direction_status: ok
  require_hidden_dim_match: true
  require_layer_role_match: true
  require_vector_hash_check: true
  require_no_mutation_of_source_artifacts: true

controls:
  required:
    - no_vector_baseline
    - activation_subtraction
    - wrong_layer_subtraction
    - random_matched_norm
    - activation_addition

logit_targets:
  groups:
    - name: refusal_openers
      source: static_strings
      strings:
        - I
        - Sorry
        - I don't
        - I do not
      include_leading_space_variants: true
      include_multi_token_first_token: true
    - name: answer_alias_first_tokens
      source: row_aliases
      include_leading_space_variants: true
      include_multi_token_first_token: true

metrics:
  primary:
    - refusal_openers_probability_delta
    - answer_alias_first_tokens_probability_delta
    - top1_changed_rate
    - max_abs_logit_delta_mean
  contamination:
    - invalid_output_rate

output:
  root: experiment/phase1/probe/analysis/current_clean_grpo_v2_unknown_failure_logit_diagnostic
  intervention_results_allowed_by_this_spec: true

stop_conditions:
  - extraction_manifest_missing_or_not_verified
  - direction_missing_or_not_ok
  - direction_layer_role_or_hash_mismatch
  - row_ids_not_exactly_joinable
  - thinking_scaffold_detected
  - active_phase1_training_lane_would_be_blocked
  - result_claim_would_exceed_tier2_exploratory
