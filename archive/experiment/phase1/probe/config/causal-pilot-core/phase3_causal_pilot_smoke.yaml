# Phase 3 causal-pilot smoke readiness spec.
#
# Location: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_smoke.yaml
# Intended consumer: future causal-pilot dry-run/runner implementation.
#
# This file is a machine-readable readiness spec, not an executable promise.
# It must not trigger generation, GPU work, training, reward updates, protocol
# changes, run-record edits, or hidden-state artifact mutation by itself.

spec:
  name: phase3_sft_causal_pilot_smoke
  status: readiness_spec_only
  created: "2026-06-15"
  evidence_tier_current: tier1_correlational
  evidence_tier_if_intervention_runs: tier2_exploratory_local
  no_phase1_headline_promotion: true
  no_reward_loop_use: true
  gate5_source_map: docs/plans/phase3-mechanism-source-map.md
  readiness_note: docs/plans/phase3-causal-pilot-readiness.md

model:
  model_tag: qwen3-4b-instruct
  family: qwen3
  size: 4b
  enable_thinking: false
  token_position_rule: final_prompt_token

prompt_contract:
  fixed_prompt_bytes_required: true
  renderer_must_match_extraction: true
  thinking_leak_checks:
    enabled: true
    forbidden_substrings:
      - "<think>"
      - "</think>"
      - "reasoning_content"

dataset_contract:
  source_split: triviaqa-rc-nocontext/frozen-known-unknown
  n_known: 128
  n_unknown: 128
  row_join_key_required: true
  require_same_rows_across:
    - extraction
    - no_vector_baseline
    - intervention
    - scoring

first_smoke:
  rationale: >
    Prioritize SFT because it has the strongest known/unknown separability and
    matches the working assumption that SFT created the behavior/internal shift.
    Sequential DPO/KTO arms are confirmatory after the smoke.
  intervention_family:
    - activation_addition
    - activation_subtraction
  initial_scope:
    arms:
      - sft
    token_positions:
      - final_prompt_token
    generation_allowed_by_this_spec: false

candidate_directions:
  - label: sft_h_lora_l36_known_unknown
    priority: 1
    arm: sft
    extraction_dir: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8
    extraction_manifest: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/manifest.json
    direction_manifest: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/hidden_state_candidate_directions.manifest.json
    direction_csv: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/hidden_state_candidate_directions.csv
    direction_id: direction__9c8c74f718038292
    direction_file: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/directions/direction__9c8c74f718038292.safetensors
    tensor_key: direction
    role: h_lora
    layer: 36
    method: known_unknown_diff
    contrast: unknown_minus_known
    positive_label: unknown
    negative_label: known
    required_status: ok
    linear_probe_balanced_accuracy: 0.863281
  - label: sft_delta_l35_known_unknown
    priority: 2
    arm: sft
    extraction_dir: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8
    extraction_manifest: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/manifest.json
    direction_manifest: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/hidden_state_candidate_directions.manifest.json
    direction_csv: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/hidden_state_candidate_directions.csv
    direction_id: direction__8bb10838ed21eebe
    direction_file: experiment/phase1/probe/qwen3-4b-instruct/hidden_states/extraction__12fb10b1c8c8/directions/direction__8bb10838ed21eebe.safetensors
    tensor_key: direction
    role: delta
    layer: 35
    method: known_unknown_diff
    contrast: unknown_minus_known
    positive_label: unknown
    negative_label: known
    required_status: ok
    linear_probe_balanced_accuracy: 0.855469

readiness_checks:
  require_extraction_manifest:
    status: ok
    verified: true
    row_count: 256
    label_counts:
      known: 128
      unknown: 128
  require_direction_status: ok
  require_hidden_dim_match: true
  require_layer_role_match: true
  require_vector_hash_check: true
  require_no_mutation_of_source_artifacts: true

coefficient_grid:
  # Zero is the no-vector baseline. Negative values are sign-flip controls.
  values: [-2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0]
  units: normalized_direction_multiplier
  include_zero_baseline: true
  include_sign_flip: true

controls:
  required:
    - no_vector_baseline
    - sign_flip
    - random_direction
    - shuffled_label_direction
    - wrong_layer_neighbor
    - base_only_no_vector
    - prompt_format_check
    - thinking_leak_check
  wrong_layer_neighbor:
    offsets: [-1, 1]
  random_direction:
    match_layer: true
    match_hidden_dim: true
    seed: 20260615
  shuffled_label_direction:
    same_extraction_contract: true
    seed: 20260615

metrics:
  primary:
    - unknown_abstention_rate
    - unknown_refusal_rate
    - known_answer_retention
    - known_answer_correctness
    - over_refusal_on_known
    - answer_on_unknown_rate
    - per_row_delta_vs_no_vector
  contamination:
    - invalid_output_rate
    - refusal_template_contamination
    - think_tag_contamination
    - reasoning_content_contamination
  classification_notes:
    keep_safety_refusal_distinct_from_epistemic_abstention: true

mechanism_links:
  - mechanism: mechanism:activation-addition-steers-generation
    source_map: docs/plans/phase3-mechanism-source-map.md
  - mechanism: mechanism:refusal-direction-mediates-refusal
    source_map: docs/plans/phase3-mechanism-source-map.md
  - mechanism: mechanism:truth-direction-causally-mediates-model-truth-output
    source_map: docs/plans/phase3-mechanism-source-map.md
  - mechanism: mechanism:representation-engineering-enables-reading-and-control
    source_map: docs/plans/phase3-mechanism-source-map.md

output:
  root: experiment/phase1/probe/qwen3-4b-instruct/causal_pilots/phase3_sft_smoke
  dry_run_manifest: dry_run_manifest.json
  planned_arms_file: planned_arms.json
  metrics_plan_file: metrics_plan.json
  intervention_results_allowed_by_this_spec: false

stop_conditions:
  - extraction_manifest_missing_or_not_verified
  - direction_missing_or_not_ok
  - direction_layer_role_or_hash_mismatch
  - row_ids_not_exactly_joinable
  - prompt_bytes_drift
  - thinking_scaffold_detected
  - active_phase1_training_lane_would_be_blocked
  - protocol_or_kg_or_run_record_edit_required
  - result_claim_would_exceed_tier2_exploratory
