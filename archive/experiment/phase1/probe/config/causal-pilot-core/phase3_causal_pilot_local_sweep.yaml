# Phase 3 local causal-pilot sweep plan.
#
# This config is consumed by phase3_causal_pilot_sweep.py. The wrapper is
# non-GPU by default: it plans commands unless --execute is passed explicitly.

sweep:
  name: phase3_local_mech_interp_sweep
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_gpu_smoke.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_full_candidates.yaml
  output_root: experiment/phase1/probe/qwen3-4b-instruct/causal_pilots/phase3_local_mech_interp_sweep
  candidates: all
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  modes:
    - name: logit_diagnostic
      max_rows: 16
      coefficients: [1.0, 5.0, 50.0]
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
    - name: generation
      max_rows: 16
      max_new_tokens: 64
      coefficients: [1.0, 5.0, 50.0]
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
