# KTO calibrated-expression composite logit diagnostic on fixed SelfAware cells.
#
# Purpose: test whether a simple L24 KTO composite direction can reduce
# known-item over-refusal while preserving or increasing unknown-item refusal.

sweep:
  name: phase3_selfaware_calibrated_expression_kto_composite_logit_sweep
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_gpu_smoke.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/selfaware-calibrated-expression-kto-panels/phase3_selfaware_calibrated_expression_kto_composite_logit_candidates.yaml
  output_root: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/causal_pilots/phase3_selfaware_calibrated_expression_kto_composite_logit_sweep
  candidates:
    - kto_h_lora_l24_composite_subtract_known_and_unknown_damage
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      probe_results: null
      row_keys_file: archive/experiment/phase1/probe/config/selfaware-calibrated-expression-kto-panels/phase3_selfaware_calibrated_expression_kto_64_row_keys.txt
    readiness_checks:
      require_extraction_manifest:
        status: ok
        verified: true
        row_count: 1233
        label_counts:
          known: 556
          unknown: 677
    control_settings:
      wrong_layer:
        layer_offsets: [-2, -1, 1, 2]
      random_matched_norm:
        seeds:
          - 20260620
          - 20260621
          - 20260622
    logit_targets:
      groups:
        - name: refusal_openers
          source: static_strings
          strings:
            - I
            - Sorry
            - I don't
          include_leading_space_variants: true
          include_multi_token_first_token: true
  modes:
    - name: logit_diagnostic
      max_rows: 64
      coefficients:
        - 25.0
        - 50.0
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
        - wrong_layer
        - wrong_layer_subtraction
        - random_matched_norm
