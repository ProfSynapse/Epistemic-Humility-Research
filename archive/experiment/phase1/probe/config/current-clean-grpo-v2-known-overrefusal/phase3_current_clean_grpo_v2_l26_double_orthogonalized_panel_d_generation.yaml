# Larger held-out Panel-D generated-answer replay for the double-constrained
# GRPO v2 L26 known-overrefusal repair vector. Uses 64 rows each from
# known_refused, known_correct_answered, and unknown_refused after excluding
# panels A, B, and C.

sweep:
  name: phase3_current_clean_grpo_v2_l26_double_orthogonalized_panel_d_generation
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_l26_double_orthogonalized_candidates.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_grpo_v2_l26_double_orthogonalized_panel_d_generation
  candidates:
    - clean_sft_grpo_v2_l26_known_repair_orthogonal_to_unknown_refusal_and_known_wrong
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      max_rows_default: 192
      probe_results: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl
      row_keys_by_candidate: null
      row_keys_file: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_known_overrefusal_replay_192_panel_d_row_keys.txt
  modes:
    - name: generation
      max_rows: 192
      max_new_tokens: 96
      coefficients: [10.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
