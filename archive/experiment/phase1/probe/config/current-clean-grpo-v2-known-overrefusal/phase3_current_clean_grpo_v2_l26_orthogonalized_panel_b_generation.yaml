# Held-out generated-answer replay for the L26 known-overrefusal repair vector
# after removing its same-layer broad unknown-refusal component.

sweep:
  name: phase3_current_clean_grpo_v2_l26_orthogonalized_panel_b_generation
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_l26_orthogonalized_candidates.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_grpo_v2_l26_orthogonalized_panel_b_generation
  candidates:
    - clean_sft_grpo_v2_l26_known_repair_orthogonal_to_unknown_refusal
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      max_rows_default: 96
      probe_results: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl
      row_keys_by_candidate: null
      row_keys_file: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_known_overrefusal_replay_96_panel_b_row_keys.txt
  modes:
    - name: generation
      max_rows: 96
      max_new_tokens: 96
      coefficients: [5.0, 10.0, 15.0, 20.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
