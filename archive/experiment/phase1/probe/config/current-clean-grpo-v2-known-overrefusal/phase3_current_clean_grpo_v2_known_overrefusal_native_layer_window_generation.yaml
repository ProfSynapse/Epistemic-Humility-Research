# Generated-answer replay for native same-layer GRPO v2 known-overrefusal
# directions across L23-L27. This is paired with the shifted-L25-vector control
# sweep on the same 96-row panel.

sweep:
  name: phase3_current_clean_grpo_v2_known_overrefusal_native_layer_window_generation
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  candidate_source_config: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_known_overrefusal_native_layer_window_candidates.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_grpo_v2_known_overrefusal_native_layer_window_generation
  candidates:
    - clean_sft_grpo_v2_l23_native_known_overrefusal_normed
    - clean_sft_grpo_v2_l24_native_known_overrefusal_normed
    - clean_sft_grpo_v2_l25_native_known_overrefusal_normed
    - clean_sft_grpo_v2_l26_native_known_overrefusal_normed
    - clean_sft_grpo_v2_l27_native_known_overrefusal_normed
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      max_rows_default: 96
      probe_results: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl
      row_keys_by_candidate: null
      row_keys_file: archive/experiment/phase1/probe/config/current-clean-grpo-v2-known-overrefusal/phase3_current_clean_grpo_v2_known_overrefusal_replay_96_row_keys.txt
  modes:
    - name: generation
      max_rows: 96
      max_new_tokens: 96
      coefficients: [15.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
