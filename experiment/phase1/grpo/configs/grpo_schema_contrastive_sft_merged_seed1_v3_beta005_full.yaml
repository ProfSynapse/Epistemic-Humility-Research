# Amendment N: GRPO v3 reward on the Amendment K (contrastive-SFT) base -- seed-1 FULL.
# Launch after the smoke confirms reward variance + that emitted confidence std
# holds off K's ~0.31 (does not collapse) + a live behavior reward.
#
# THE ONLY VARIABLE CHANGED vs grpo_schema_clean_sft_merged_seed1_v3_full.yaml is
# the base model (model_name) -> the Amendment K merged-16bit base, plus the
# output_dir. Reward (humility_reward_v3.py), beta, LR, batch, num_generations,
# temperature, epochs, and every other hyperparameter are IDENTICAL to Amendment J
# so the run is a clean single-variable test (base = K instead of clean-SFT).
#
# WHY THIS IS EXPECTED TO BEAT J: on clean-SFT (J), the KL anchor pointed at a
# flat confidence reference and the proper-score term had to manufacture spread
# from nothing -> calibration stayed collapsed (std 0.027, AUROC 0.522) while
# behavior was preserved. On K, the base ALREADY has discriminating confidence
# (std 0.309, AUROC 0.684, cells correctly ordered), so the KL anchor PRESERVES
# it and the proper-score reward REINFORCES it; the dominant behavior term then
# repairs K's broken behavior (over_refusal 79% -> target <=67.5; correct_on_known
# 37% -> >=42.2). Division of labor: SFT (K) installed the calibration RL cannot;
# RL does the behavior shaping it is built for.
#
# beta and the reward weights in humility_reward_v3.py are the authorized tuning
# knobs (Amendment N section 3.3): if the smoke shows calibration drifting raise
# beta; if behavior will not move lower beta or raise behavior magnitudes. The
# defaults below match J exactly for the cleanest attribution on the first shot.
model:
  model_name: "/workspace/repo/scratch/schema_response_confidence/runs/sft_schema_contrastive_seed1_full/20260627_203232/Qwen3-4B-bnb-4bit/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 1
  use_rslora: false
  use_dora: false

training:
  output_dir: "/workspace/repo/scratch/schema_response_confidence/runs/schema_contrastive_sft_grpo_v3_beta005_seed1_full"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.05
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 500
  save_total_limit: 3
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/workspace/repo/scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: true
    module: null
    file: "../../../experiment/phase1/grpo/humility_reward_v3.py"
    functions:
      - name: "epistemic_humility_reward"
        weight: 1.0
        params: {}

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 1
