# Amendment J clean schema-SFT-merged -> GRPO v3 seed-1 full local run (B0).
# Launch after the v3 smoke confirms reward variance and sane reward-debug rows.
# Identical to grpo_schema_clean_sft_merged_seed1_v2_full.yaml except the custom
# reward file (humility_reward_v3.py: proper-scoring Brier vs per-question
# appropriateness, target_mode=group) and the output dir. Same clean-SFT base,
# same GRPO dataset, same hyperparameters as the v2 cell so the reward is the only
# changed variable (clean attribution vs clean-sft-grpo-v2).
model:
  model_name: "/workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 1
  use_rslora: false
  use_dora: false

training:
  output_dir: "/workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v3_seed1_full"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.1
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 500
  save_total_limit: 3
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/workspace/repo/scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: true
    module: null
    file: "../../../experiment/phase1/grpo/humility_reward_v3.py"
    functions:
      - name: "epistemic_humility_reward"
        weight: 1.0
        params: {}

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 1
