# Amendment L: answer-sub-span-MASKED contrastive schema-SFT seed1 — SMOKE (max_steps 32).
# Identical to the Amendment K contrastive recipe EXACTLY (LoRA r32/a64, batch 10,
# LR 2e-4, completion_only_loss true / assistant_only_loss false, seed 1) — the ONLY
# differences from K are (a) the dataset carries the additive loss_mask_text column
# on inappropriate rows, and (b) the engine honors it (synaptic-tuner sub-span loss
# masking), so the wrong-answer text is excluded from the loss while response_confidence
# stays supervised. lineage should report loss_mask_mode assistant_only+subspan_masked.
# Gated artifact for Amendment L §4 (calibration gate reused from K + behavior gate).
#
# Consumed directly by: train_sft.py --config <this>.yaml  (YAML path, like GRPO).
model:
  model_name: "unsloth/Qwen3-4B-bnb-4bit"
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 1
  use_rslora: false
  use_dora: false

training:
  output_dir: "scratch/schema_response_confidence/runs/sft_schema_contrastive_masked_seed1_smoke"
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  max_grad_norm: 1.0
  lr_scheduler_type: "linear"
  max_seq_length: 2048
  max_steps: 32
  packing: false
  completion_only_loss: true
  assistant_only_loss: false
  gradient_checkpointing: true
  optim: "adamw_8bit"
  fp16: false
  bf16: true
  num_train_epochs: 1
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 0
  dataloader_pin_memory: true
  group_by_length: false
  eval_strategy: "no"
  eval_steps: 50
  chat_template_kwargs:
    enable_thinking: false

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "scratch/schema_response_confidence/qwen3-4b-instruct/sft_response_confidence_train_contrastive_masked.jsonl"
  num_proc: 1
  test_size: 0.0
  split_dataset: false
  filter_desirable: false

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

evolutionary:
  enabled: false

seed: 1
