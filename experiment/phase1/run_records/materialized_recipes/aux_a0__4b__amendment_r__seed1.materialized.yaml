# Amendment R Phase B — A0 (LM-only reference) SCORED run, materialized for the
# local Windows/Docker copy lane. NOT a new design: mirrors the canonical recipe
#   experiment/phase1/recipes/eh_phase1_qwen3_4b_amendment_r_a0_lm_only.yaml
# exactly, with two launch-layer additions required to run on this host:
#   (1) setup.copy — copy mode (py.exe -> Docker Desktop) needs an explicit copy
#       set. The tuner DEFAULT copy set [Trainers/sft, shared, tuner, <data>]
#       OMITS Trainers/shared, but train_sft.py imports Trainers.shared.callbacks
#       (callbacks refactor, tuner PR #85) -> ModuleNotFoundError without it.
#       (Ignored in bind mode, so this stays portable.)
#   (2) training.seed: 1 — the canonical recipe omits seed; the run record is
#       pinned to seed1 and A0/A1/A2 must share a seed. Set explicitly here.
# Hyperparameters / data / render are byte-identical to canonical.
name: eh-phase1-qwen3-4b-amendment-r-a0-lm-only
target: local
method: sft
provider: local_docker

job:
  image: unsloth/unsloth:latest
  pull_policy: missing
  transfer: auto
  keep_container: false

setup:
  pip:
    - trl==0.22.2
    - git+https://github.com/unslothai/unsloth_zoo.git
    - git+https://github.com/unslothai/unsloth.git
  copy:
    - Trainers/sft
    - Trainers/shared
    - shared
    - tuner
    - scratch/amendment_r/phase_b/phase_b_aux_train.jsonl

run:
  method: sft
  trainer: Trainers/sft/train_sft.py
  dry_run: false
  dashboard: false
  quiet: true

model:
  name: unsloth/Qwen3-4B-bnb-4bit
  max_seq_length: 2048
  load_in_4bit: true

dataset:
  # Same conversations as A1/A2 (aux_target ignored when no head is attached).
  local_file: scratch/amendment_r/phase_b/phase_b_aux_train.jsonl

training:
  batch_size: 2
  gradient_accumulation: 4
  learning_rate: 2.0e-4
  num_epochs: 1
  prompt_render: prompt_completion
  chat_template_kwargs:
    enable_thinking: false
  seed: 1

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# aux_head intentionally OMITTED — A0 is the head-off reference arm.

artifacts:
  output_root: toolset-training-artifacts/runs/local_docker/sft/{name}
  run_timestamp: "{timestamp}"
