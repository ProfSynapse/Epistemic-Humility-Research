# Epistemic-Humility Amendment R (Phase B) — A2: JOINT co-train, PLACEBO targets.
#
# Control arm for A1. BYTE-IDENTICAL to A1 except the aux_target column is the
# seed-shuffled placebo (same marginal — 7981 known / 6414 unknown — but the
# question<->target correspondence is broken). The head therefore co-trains on a
# target with no recoverable per-row signal beyond the base rate.
#
# This is the falsifier's null: if A1's emitted-scalar calibration does NOT exceed
# A2's by the candidate +0.05 AUROC-to-appropriateness margin, the "real
# answerability supervision changes native behavior" claim FAILS. A2 controls for
# the mere act of attaching/optimizing a head (capacity, gradient interference,
# regularization) independent of whether the target carries information.
#
# ⚠️ LAUNCH-BLOCKED (prep artifact). Same two engine/runner prerequisites as A1
#    (prompt_render mode + aux_head runner forwarding) — see the A1 recipe header
#    and AMENDMENT-R §6 / docs/sessions/0029.
name: eh-phase1-qwen3-4b-amendment-r-a2-joint-placebo
target: local
method: sft
provider: local_docker

job:
  image: unsloth/unsloth:latest
  pull_policy: missing
  transfer: auto
  keep_container: false

setup:
  pip:
    - trl==0.22.2
    - git+https://github.com/unslothai/unsloth_zoo.git
    - git+https://github.com/unslothai/unsloth.git

run:
  method: sft
  trainer: Trainers/sft/train_sft.py
  dry_run: false
  dashboard: false
  quiet: true

model:
  name: unsloth/Qwen3-4B-bnb-4bit
  max_seq_length: 2048
  load_in_4bit: true

dataset:
  # Shuffled-target file (staged, gitignored). Same conversations as A0/A1; only
  # aux_target differs. A2 = seed-permuted placebo targets.
  local_file: scratch/amendment_r/phase_b/phase_b_aux_train_shuffled.jsonl

training:
  batch_size: 2
  gradient_accumulation: 4
  learning_rate: 2.0e-4
  num_epochs: 1
  chat_template_kwargs:
    enable_thinking: false

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

aux_head:
  enabled: true
  layer: 35
  token_position: end_of_prompt
  target_field: aux_target        # shuffled placebo label (data file differs from A1)
  loss: bce
  head_type: linear
  hidden_dims: []
  out_activation: sigmoid
  input_norm: layernorm
  freeze_base: false
  lm_loss_weight: 1.0
  head_lr: null
  prompt_render: prompt_completion  # ⚠ pending engine support (0029)

artifacts:
  output_root: toolset-training-artifacts/runs/local_docker/sft/{name}
  run_timestamp: "{timestamp}"
