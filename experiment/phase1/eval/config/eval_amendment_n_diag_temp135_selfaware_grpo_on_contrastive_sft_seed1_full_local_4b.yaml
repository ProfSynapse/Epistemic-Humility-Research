# experiment/phase1/eval/config/eval_amendment_n_response_confidence_selfaware_grpo_on_contrastive_sft_seed1_full_local_4b.yaml
#
# Full SelfAware eval for Amendment N: Amendment K (contrastive schema-SFT) base
# -> GRPO v3 (proper-scoring Brier + dominant behavior reward) seed 1. The GRPO
# LoRA adapter is applied directly on the K merged-16bit base via vLLM
# (enable_lora, max_lora_rank 32) -- the SAME corrected-base pattern as the
# Amendment J eval -- and the no-adapter arm is the K merged base itself, so the
# scored_rows are apples-to-apples vs Amendment K (the calibration baseline this
# cell must RETAIN) and vs the clean-SFT base / GRPO v3 (same prompt, gold,
# generation/vLLM settings).
#
# NOTE: the adapter path below pins the FULL-run final_model; fill in the run
# timestamp after the full run completes (pinned via train_grpo output_dir).

model_tag: qwen3-4b-contrastive-schema-sft-merged-seed1
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_contrastive_seed1_full/20260627_203232/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_n_diag_temp135_selfaware_grpo_on_contrastive_sft_seed1_full_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 1.35
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: grpo_v3_on_contrastive_sft_seed1
    method: contrastive_schema_sft_grpo_v3
    model: qwen3-4b-contrastive-schema-sft-merged-seed1
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_contrastive_sft_grpo_v3_seed1_full/20260628_093753/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../datasets/selfaware/SelfAware.json
