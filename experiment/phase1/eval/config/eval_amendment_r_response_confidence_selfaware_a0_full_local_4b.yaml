# Amendment R (Phase B) full SelfAware response-confidence eval — arm a0.
# Instantiated from eval_amendment_r_..._full_local_4b.template.yaml. Mirrors the
# B0/Amendment-J response_confidence SelfAware eval EXACTLY (prompt, generation,
# vLLM, bootstrap, gold, eval set); only the merged-16bit base differs per arm.
# model_name = merged-16bit of THIS arm's own adapter (the merge IS the eval base);
# arms[0].adapter is EMPTY (base only), like Amendment A's sft_merged arm.
# Container paths assume the repo root bind-mounted at /workspace/repo.
model_tag: qwen3-4b-amendment-r-a0-merged
model_name: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local_docker/sft/eh-phase1-qwen3-4b-amendment-r-a0-lm-only/20260629_200753/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_r_response_confidence_selfaware_a0_full_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: a0_lm_only
    method: amendment_r_a0_sft
    model: qwen3-4b-amendment-r-a0-merged
    adapter:

eval_sets:
  selfaware:
    type: ood
    path: ../../../datasets/selfaware/SelfAware.json
