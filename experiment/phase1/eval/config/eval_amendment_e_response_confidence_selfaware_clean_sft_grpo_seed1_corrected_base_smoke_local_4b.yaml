# experiment/phase1/eval/config/eval_amendment_e_response_confidence_selfaware_clean_sft_grpo_seed1_corrected_base_smoke_local_4b.yaml
#
# Corrected-base smoke for Amendment E clean schema-SFT -> GRPO seed 1.
# Evaluate the GRPO LoRA on the merged clean-SFT base, not the original Qwen base.

model_tag: qwen3-4b-clean-schema-sft-merged-seed1
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_e_response_confidence_selfaware_clean_sft_grpo_seed1_corrected_base_smoke_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_schema_sft_grpo_seed1_corrected_base
    method: clean_schema_sft_grpo
    model: qwen3-4b-clean-schema-sft-merged-seed1
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_seed1_full/20260623_233309/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../datasets/selfaware/SelfAware.json
    offset: 2240
    limit: 192
