# experiment/phase1/eval/config/eval_amendment_m_response_confidence_selfaware_probe_factual_sft_seed1_merged_full_local_4b.yaml
#
# Amendment M Revision 3 (SIGNED 2026-06-29): full SelfAware eval for the merged
# probe-FACTUAL schema-SFT seed-1 model — the AUTHORIZED M cell. Mirrors the
# Amendment K / clean-SFT merged-base eval (same gold, generation/vLLM settings,
# base-only arm with adapter:null) so scored_rows are apples-to-apples vs the
# clean-SFT base (the §4.2 behavior baseline), K, and GRPO v3.
#
# TWO differences from the K/L/N evals, both per Amendment M R3:
#   1. model_name -> the probe-factual merged-16bit base (PLACEHOLDER below; fill in
#      the real <timestamp>/Qwen3-4B-bnb-4bit/merged-16bit path produced under the
#      sft_schema_probe_factual_seed1_full output_dir after the M full run lands).
#   2. The system prompt defines response_confidence as FACTUAL confidence (P the
#      answer is correct), matching the R3 training target. The field name and JSON
#      schema are UNCHANGED, so calibration_gap / AUROC plumbing is identical; the
#      §4.1 gate AUROC is computed against correctness, which is prompt-agnostic.

model_tag: qwen3-4b-probe-factual-schema-sft-merged-seed1
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_probe_factual_seed1_full/20260629_111239/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_amendment_m_response_confidence_selfaware_probe_factual_sft_seed1_merged_full_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer is factually correct; if you
    abstain, it is your probability that you would be correct if you did answer.
    Do not include markdown, code fences, reasoning, or any text outside the
    JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: probe_factual_schema_sft_merged_seed1
    method: probe_factual_schema_sft_merged
    model: qwen3-4b-probe-factual-schema-sft-merged-seed1
    adapter: null

eval_sets:
  selfaware:
    type: ood
    path: ../../../datasets/selfaware/SelfAware.json
