# EXAMPLE CELL - NOT A REGISTERED INSTRUMENT.
#
# This is a teaching artifact for the mechinterp-cells skill: it shows an
# AN-style setpoint-regulator design expressed against the real tuner
# SteerCellConfig schema (synaptic-tuner MechInterp/config.py). It is NOT signed,
# NOT gated, and must never be launched as if it were a confirmatory cell. A real
# registered cell lives under experiment/phase1/cells/<amendment-slug>/ and pins
# its shas in the amendment doc.
#
# Validate that it parses (CPU, no GPU) with:
#   cd synaptic-tuner && python -c "from MechInterp.config import load_steer_config; \
#     load_steer_config('../experiment/phase1/cells/example-cell/cell.yaml'); print('ok')"
#
# The six blocks below map 1:1 to the tuner schema. See the skill for the block
# model and the organization principles.

# 1. surface: where rows come from + the reproducibility contract.
surface:
  rows_path: experiment/phase1/probe/analysis/example-cell/rows_pool.jsonl
  seed: 20260706
  generation:
    max_new_tokens: 96
    do_sample: false
  # expected_config_sha is filled AFTER the first run and pinned in the amendment
  # doc. When set, the tuner aborts unless the recipe still hashes to it, so the
  # goalposts cannot drift silently.
  # expected_config_sha: <sha256-of-this-file-at-signing>

# 2. readouts: frozen mechinterp-direction/v1 JSONs, referenced by repo path.
readouts:
  # A REAL cell points at a frozen mechinterp-direction/v1 JSON under
  # experiment/phase1/probe/steering/directions/<checkpoint>/... (those dirs are
  # gitignored data). This example ships a tiny hand-written stub alongside the
  # cell so it parses and runs end to end without a fitted direction.
  - name: caution_perp
    path: experiment/phase1/cells/example-cell/direction_stub.json

# 3. law: an erase_write setpoint along the caution_perp axis (AN-style).
#    erase_write removes the current projection and writes strength*sigma exactly.
law:
  kind: erase_write
  readout: caution_perp
  position: answer_window   # only the generated tokens (needs window_start upstream)
  generation_mode: gen_stream

# 4. arms: baseline no-op, a selection-thresholded primary, a seeded permuted
#    control of primary, and a two-rung dose ladder on a flag field.
arms:
  - name: baseline
    strength: 0.0
  - name: primary
    strength: 2.0
    score_field: selector_score
    threshold: 1.0
  - name: control
    strength: 2.0
    permuted_control_of: primary
    control_seed: 20260706
  - name: dose_low
    strength: 1.0
    flag_field: selected
  - name: dose_high
    strength: 3.0
    flag_field: selected

# 5. execution: per-row output JSONL (untracked) + the project grader.
execution:
  output_path: experiment/phase1/probe/analysis/example-cell/rows_out.jsonl
  resume: true
  # Grader is resolved via importlib against sys.path. Put the graders dir on
  # PYTHONPATH so the flat module name resolves without adding __init__.py up a
  # tree that includes the frozen steering/ dir:
  #   PYTHONPATH=experiment/phase1/probe/graders
  grader: example_grader:grade

# 6. smoke: readback tolerances that gate the full arms.
smoke:
  n_rows: 8
  write_rel_tol: 0.05
  write_abs_floor: 0.5
  offtarget_tol: 0.001
