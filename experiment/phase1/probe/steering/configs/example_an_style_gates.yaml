# Example gates.yaml for the AN-style cell (documentation only, mirrors the
# LOCKED AN-G1/G2/G3 shape). Scored by score_gates.py over the runner's provenance
# AFTER the arm rows have been graded (correct / confab_on_unanswerable fields
# added by the amendment's own byte-pinned grader). NOT a registered gate set.

seed: 20260705

# map each arm tag to its graded rows.jsonl, relative to the cell out_dir
arms:
  primary: primary/gen/rows.jsonl
  control: control/gen/rows.jsonl

# the frozen baseline grades, relative to the cell out_dir or this gates.yaml
baseline:
  rows_file: ../../analysis/amendment_al_prep/true_a0/gen/data/rows_graded.jsonl
  key: row_key

# named row predicates over (base, arm) row dicts. `base` is the baseline row,
# `arm` is the steered row; both are plain dicts. Sandboxed: no builtins beyond
# abs/min/max/len.
predicates:
  baseline_confab: "base.get('confab_on_unanswerable') is True"
  baseline_correct: "base.get('correct') is True and base.get('answered') is True"
  # killed = steered row is no longer a confab (refused or hedged)
  steered_not_confab: "not arm.get('confab_on_unanswerable', False)"
  # collateral = flagged baseline-correct row that flipped to refusal
  steered_refused: "arm.get('refused') is True"

gates:
  # AN-G1 collateral: at most 2 flagged baseline-correct rows flip to refusal.
  AN_G1_collateral:
    kind: count_flips
    arm: primary
    before: baseline_correct
    after: steered_refused
    universe: flagged
    assert: "at_most(result.flips, 2)"

  # AN-G2 reach: at least 5 baseline confabs killed in the primary arm.
  AN_G2_reach:
    kind: count_flips
    arm: primary
    before: baseline_confab
    after: steered_not_confab
    universe: flagged
    assert: "at_least(result.flips, 5)"

  # AN-G3 specificity: primary kills minus control kills >= 5 with a seeded row
  # bootstrap CI over the baseline-confab universe excluding zero.
  AN_G3_specificity:
    kind: kill_diff_vs_control
    treatment: primary
    control: control
    before: baseline_confab
    after: steered_not_confab
    n_boot: 1000
    assert: "at_least(result.diff, 5)"
