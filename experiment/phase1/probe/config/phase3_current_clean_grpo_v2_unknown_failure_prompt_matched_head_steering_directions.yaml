# (sparse, 11 heads). Directions are computed from the h_lora (adapter-active)
# arm — the forward pass the intervention harness hooks during generation.
# Steering toward unknown_refused (the safe behavior) means negative alpha
# (positive_label is unknown_answered_wrong).

