# Phase 3 SelfAware SAE feature activation analysis.
#
# Exploratory screening only: ranks learned top-k SAE features by known/unknown
# activation separation. It is not causal evidence.

spec:
  name: phase3_selfaware_topk16_sae_feature_analysis
  analysis_type: phase3_sae_feature_analysis
  notice: SAE_FEATURE_ANALYSIS_ONLY
  no_phase1_headline_promotion: true

analysis:
  top_features: 20
  top_rows_per_feature: 5

candidate_runs:
  - label: sft_dpo_selfaware_full_delta_l24_topk16
    run_dir: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/sae_runs/phase3_selfaware_delta_sae_pilot_topk16/sft_dpo_selfaware_full_delta_l24
  - label: sft_kto_selfaware_full_delta_l25_topk16
    run_dir: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/sae_runs/phase3_selfaware_delta_sae_pilot_topk16/sft_kto_selfaware_full_delta_l25

output:
  root: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/sae_feature_analysis/phase3_selfaware_delta_topk16_features
