analysis:
  ridge: 1.0
  class_weighting: balanced
  cv_folds: 4
  min_rows_per_cell: 32
  ranks:
    - 1
    - 2
    - 4
    - 8
    - 16
    - full
  cells:
    - label: known_refused
      filter:
        label: known
        refused: true
    - label: known_correct_answered
      filter:
        label: known
        refused: false
        correct: true
    - label: unknown_refused
      filter:
        label: unknown
        refused: true
    - label: unknown_answered_wrong
      filter:
        label: unknown
        refused: false
        correct: false

