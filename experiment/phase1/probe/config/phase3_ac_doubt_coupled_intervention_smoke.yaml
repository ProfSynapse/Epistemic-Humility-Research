# Amendment AC SMOKE: 25 rows/cell x 3 cells x 4 arms = 300 generation units.
# SPEC: experiment/protocol/AMENDMENT-AC-doubt-regulated-caution.md §3.
# Pass gate: mechanics run end-to-end AND any directional coupled-vs-permuted
# separation. The falsifier CAN fire early here (permuted ~ coupled on 25/cell
# is a warning, not yet a verdict — the full run decides).
# Identical to phase3_ac_doubt_coupled_intervention.yaml except
# rows_filter.max_rows_per_cell and the output root.

model:
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
  adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model
  adapter_name: clean_sft_grpo_v2
  torch_dtype: bfloat16
  device_map: cuda
  enable_thinking: false

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

caution_direction: experiment/phase1/probe/analysis/current_clean_grpo_v2_caution_residual_direction/caution_perp_direction_L35.json

rows: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl

rows_filter:
  cells:
    - known_refused
    - known_correct_answered
    - unknown_refused
  max_rows_per_cell: 25

arms:
  - arm_id: baseline
    mode: baseline
  - arm_id: coupled
    mode: couple
    gain_map: experiment/phase1/probe/analysis/ac_doubt_gain_map/doubt_gain_map_L35.json
    gain_key: gains
  - arm_id: permuted
    mode: couple
    gain_map: experiment/phase1/probe/analysis/ac_doubt_gain_map/doubt_gain_map_L35.json
    gain_key: gains_permuted
  - arm_id: ablate
    mode: ablate

sweep:
  max_new_tokens: 96
  max_rows: null

output:
  root: experiment/phase1/probe/analysis/ac_doubt_coupled_intervention_smoke
