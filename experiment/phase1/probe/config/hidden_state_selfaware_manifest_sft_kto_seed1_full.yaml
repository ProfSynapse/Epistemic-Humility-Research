# Phase 3 dedicated SelfAware frozen-manifest hidden-state extraction, full run.
#
# Full run over the frozen SelfAware manifest for the symmetric SFT->KTO seed1
# arm. No max_rows and no explicit strata filter, so every manifest row is
# selected. Output is isolated from the SFT->DPO full run under
# hidden_states_selfaware_full_kto.

model:
  model_tag: qwen3-4b-sft-merged-seed1-selfaware
  model_name: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed1/20260614_053221/Qwen3-4B-bnb-4bit/merged-16bit
  revision: null
  enable_thinking: false

extraction:
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: sft_merged_seed1_base
    adapter_state: disabled
    adapter: null
  - name: sft_kto_seed1
    adapter_state: active
    # staged on HF: professorsynapse/eh-qwen3-4b-seq-sft-kto-seed1-lora @ 2ccb2ec3883bf004feb545fb555ea3846e8c39fb
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_kto__4b__amendment_a__seed1/20260614_085358/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: experiments/common/artifacts/row_manifests/selfaware/phase3_selfaware_frozen_row_manifest.json

output:
  hidden_states_subdir: hidden_states_selfaware_full_kto
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: sft_kto__4b__amendment_a__seed1
  source_split: phase3-selfaware-frozen-row-manifest/v1
