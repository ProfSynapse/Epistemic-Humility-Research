# Larger generated-answer replay for the leading current clean GRPO v2
# known-overrefusal steering candidate.

sweep:
  name: phase3_current_clean_grpo_v2_known_overrefusal_generation_replay_96
  evidence_tier: tier2_exploratory_local
  runner_config: experiment/phase1/probe/config/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_grpo_v2_known_overrefusal_generation_replay_96
  candidates:
    - clean_sft_grpo_v2_delta_known_refused_vs_known_correct_l25_normed
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      max_rows_default: 96
      probe_results: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl
      row_keys_by_candidate: null
      row_keys_file: experiment/phase1/probe/config/phase3_current_clean_grpo_v2_known_overrefusal_replay_96_row_keys.txt
  modes:
    - name: generation
      max_rows: 96
      max_new_tokens: 96
      coefficients: [10.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
        - activation_addition
