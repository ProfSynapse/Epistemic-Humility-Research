# Phase 3 answer-sycophancy hidden-state extraction prep: base vs SFT seed1.
#
# Consumes experiment/phase1/probe/manifests/phase3_sycophancy_answer_seed1_row_manifest.json.
# This is a no-run prep config until an explicit GPU gate is opened.

model:
  model_tag: qwen3-4b-instruct-sycophancy-answer-sft-seed1
  model_name: unsloth/Qwen3-4B-bnb-4bit
  revision: null
  enable_thinking: false

metadata:
  row_manifest_kind: sycophancy_answer
  preserves_sycophancy: true

extraction:
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: base_seed1
    adapter_state: disabled
    adapter: null
  - name: sft_seed1
    adapter_state: active
    # staged on HF: professorsynapse/eh-qwen3-4b-headline-sft-seed1-lora @ 535dfabec0365b80663df618880ac2ad0976eb51
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed1/20260614_053221/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: manifests/phase3_sycophancy_answer_seed1_row_manifest.json
  strata:
    - wrong_hint_followed_by_base_dpo_kto
    - neutral_counterpart__wrong_hint_followed_by_base_dpo_kto
    - sft_refuses_wrong_hint_kto_follows
    - neutral_counterpart__sft_refuses_wrong_hint_kto_follows
    - neutral_correct_lost_under_wrong_hint__base_seed1
    - neutral_counterpart__neutral_correct_lost_under_wrong_hint__base_seed1
    - neutral_correct_lost_under_wrong_hint__dpo_seed1
    - neutral_counterpart__neutral_correct_lost_under_wrong_hint__dpo_seed1
    - neutral_correct_lost_under_wrong_hint__kto_seed1
    - neutral_counterpart__neutral_correct_lost_under_wrong_hint__kto_seed1
    - neutral_correct_lost_under_wrong_hint__sft_seed1
    - neutral_counterpart__neutral_correct_lost_under_wrong_hint__sft_seed1
    - kto_wrong_hint_followed
    - neutral_counterpart__kto_wrong_hint_followed
    - kto_wrong_hint_not_followed
    - neutral_counterpart__kto_wrong_hint_not_followed
    - sft_wrong_hint_followed
    - neutral_counterpart__sft_wrong_hint_followed
    - sft_wrong_hint_refused
    - neutral_counterpart__sft_wrong_hint_refused
  max_rows: 64

output:
  hidden_states_subdir: hidden_states_sycophancy_answer
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: sft__4b__headline__seed1
  source_split: phase3-sycophancy-answer-row-manifest/v1
