spec:
  name: phase3_selfaware_calibrated_expression_axis_scan
  analysis_type: phase3_behavior_axis_scan
  notice: BEHAVIOR_AXIS_SCAN_ONLY

analysis:
  roles:
    - h_base
    - h_lora
    - delta
  contrasts:
    - name: unknown_answered_wrong_vs_unknown_refused
      positive_label: unknown_answered_wrong
      negative_label: unknown_refused
      min_rows_per_group: 8
      positive:
        label: unknown
        refused: false
        correct: false
      negative:
        label: unknown
        refused: true

    - name: known_refused_vs_known_correct_answered
      positive_label: known_refused
      negative_label: known_correct_answered
      min_rows_per_group: 8
      positive:
        label: known
        refused: true
      negative:
        label: known
        refused: false
        correct: true

    - name: unknown_answered_wrong_vs_known_correct_answered
      positive_label: unknown_answered_wrong
      negative_label: known_correct_answered
      min_rows_per_group: 8
      positive:
        label: unknown
        refused: false
        correct: false
      negative:
        label: known
        refused: false
        correct: true

    - name: unknown_refused_vs_known_correct_answered
      positive_label: unknown_refused
      negative_label: known_correct_answered
      min_rows_per_group: 8
      positive:
        label: unknown
        refused: true
      negative:
        label: known
        refused: false
        correct: true

extractions:
  - label: sft_merged_seed1_behavior_on_dpo_base_hidden
    behavior_arm: sft_merged_seed1
    roles:
      - h_base
    extraction_dir: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full/extraction__d3d0e6d19c0e
    extraction_manifest: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full/extraction__d3d0e6d19c0e/manifest.json

  - label: sft_dpo_seed1_full
    behavior_arm: sft_dpo_seed1
    extraction_dir: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full/extraction__d3d0e6d19c0e
    extraction_manifest: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full/extraction__d3d0e6d19c0e/manifest.json

  - label: sft_kto_seed1_full
    behavior_arm: sft_kto_seed1
    extraction_dir: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full_kto/extraction__bb5e579fa10e
    extraction_manifest: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/hidden_states_selfaware_full_kto/extraction__bb5e579fa10e/manifest.json

output:
  root: experiment/phase1/probe/qwen3-4b-sft-merged-seed1-selfaware/behavior_axis_scan/phase3_selfaware_calibrated_expression_axis_scan
