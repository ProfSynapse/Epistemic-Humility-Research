# No-vector baseline generation pass for the targeted 448-row SFT->KTO panel.
# The scored output feeds phase3_gold_behavior_panel.py to materialize actual
# generated-answer behavior cells.
sweep:
  name: phase3_gold_kto_targeted_baseline_generation_replay
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_gpu_smoke.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_gold_kto_targeted_candidates.yaml
  output_root: experiment/phase1/probe/qwen3-4b-instruct/causal_pilots/phase3_gold_kto_targeted_baseline_generation_replay
  candidates:
    - sft_kto_targeted_h_lora_l35
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    readiness_checks:
      require_extraction_manifest:
        row_count: 448
        label_counts:
          known: 224
          unknown: 224
    selection:
      row_keys_file: experiment/phase1/probe/config/phase3_gold_kto_targeted_rare_cell_row_keys.txt
      probe_results: experiment/phase1/probe/qwen3-4b-instruct/probe_results.jsonl
  modes:
    - name: generation
      max_rows: 448
      max_new_tokens: 32
      coefficients:
        - 50.0
      controls:
        - no_vector_baseline
