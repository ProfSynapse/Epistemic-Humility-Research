# C1 cross-dataset transfer — KUQ frozen-manifest hidden-state extraction.
#
# Step 4 of the cross-dataset protocol. Mirrors the SelfAware GRPO v2 extraction
# but consumes the KUQ panel manifest (phase3_xdataset_build_panel.py output).
# GRPO adapter over the clean SFT merged base: h_base = schema SFT model,
# h_lora = adapter-active (the surface the caution-axis probe reads), delta =
# the reward-shaped GRPO surface. final_prompt_token residual stream, no
# generation.

model:
  model_tag: qwen3-4b-clean-sft-grpo-v2-seed1-kuq
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
  revision: null
  enable_thinking: false

extraction:
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: clean_sft_merged_seed1_base
    adapter_state: disabled
    adapter: null
  - name: clean_sft_grpo_v2_seed1
    adapter_state: active
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: xdataset/kuq_panel/manifest.json

output:
  hidden_states_subdir: hidden_states_kuq_clean_sft_grpo_v2_full
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: schema_clean_sft_grpo_v2_seed1_full
  source_split: phase3-selfaware-frozen-row-manifest/v1
