# Gold-backed KTO calibrated-expression composite logit diagnostic.
sweep:
  name: phase3_gold_kto_calibrated_expression_composite_logit_sweep
  evidence_tier: tier2_exploratory_local
  runner_config: experiment/phase1/probe/config/phase3_causal_pilot_gpu_smoke.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_gold_kto_calibrated_expression_composite_logit_candidates.yaml
  output_root: experiment/phase1/probe/qwen3-4b-instruct/causal_pilots/phase3_gold_kto_calibrated_expression_composite_logit_sweep
  candidates:
    - gold_kto_h_lora_l27_composite_known1_unknown025
    - gold_kto_h_lora_l27_composite_known1_unknown050
    - gold_kto_h_lora_l28_composite_known1_unknown025
    - gold_kto_h_lora_l28_composite_known1_unknown050
    - gold_kto_h_lora_l36_composite_known1_unknown025
    - gold_kto_h_lora_l36_composite_known1_unknown050
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    selection:
      probe_results: experiment/phase1/probe/qwen3-4b-instruct/probe_results.jsonl
      row_keys_file: experiment/phase1/probe/qwen3-4b-instruct/gold_behavior_panels/phase3_gold_kto_behavior_panel/row_keys/calibrated_expression_four_cell_available_row_keys.txt
    control_settings:
      wrong_layer:
        layer_offsets: [-2, -1]
      random_matched_norm:
        seeds:
          - 20260620
    logit_targets:
      groups:
        - name: refusal_openers
          source: static_strings
          strings:
            - I
            - Sorry
            - I don't
          include_leading_space_variants: true
          include_multi_token_first_token: true
        - name: answer_aliases
          source: row_aliases
          include_leading_space_variants: true
          include_multi_token_first_token: false
  modes:
    - name: logit_diagnostic
      max_rows: 28
      coefficients:
        - 25.0
        - 50.0
      controls:
        - no_vector_baseline
        - activation_addition
        - wrong_layer
        - random_matched_norm
