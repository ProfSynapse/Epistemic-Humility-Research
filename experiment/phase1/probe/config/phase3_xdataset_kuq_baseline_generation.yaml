# C1 cross-dataset transfer — KUQ baseline generation (GRPO v2, no-hook).
#
# Step 2 of the cross-dataset protocol. Generates clean (alpha=0.0, no
# intervention) answers for the KUQ panel built by phase3_xdataset_build_panel.py
# so behavior cells (known_refused / unknown_refused / ...) can be assembled on a
# second dataset and the SelfAware caution-axis / belief-action-gap findings
# tested for cross-dataset generalization.
#
# alpha 0.0 is the ONLY sweep point: by_block={} so steering_directions are loaded
# but never applied. We reuse the existing GRPO v2 head steering_directions.json
# purely to satisfy the loader; no head is touched at alpha 0.

model:
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
  adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model
  adapter_name: clean_sft_grpo_v2
  torch_dtype: bfloat16
  device_map: cuda
  enable_thinking: false

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

# Loaded but unused at alpha 0.0 (no head is steered). Reused from the GRPO v2
# unknown-failure head sweep solely to satisfy the loader.
steering_directions: experiment/phase1/probe/analysis/current_clean_grpo_v2_unknown_failure_prompt_matched_head_steering_directions/clean_sft_grpo_v2_seed1_unknown_failure_prompt_matched_steering/steering_directions.json

rows: experiment/phase1/probe/xdataset/kuq_panel/gen_rows.jsonl

sweep:
  alphas: [0.0]
  max_new_tokens: 96
  max_rows: null

output:
  root: experiment/phase1/probe/xdataset/kuq_generation
