# Phase 3 answer-sycophancy same-condition logit diagnostic.

sweep:
  name: phase3_sycophancy_answer_logit_sweep
  evidence_tier: tier2_exploratory_local
  runner_config: archive/experiment/phase1/probe/config/causal-pilot-core/phase3_causal_pilot_gpu_smoke.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_sycophancy_answer_logit_candidates.yaml
  output_root: experiment/phase1/probe/qwen3-4b-instruct-sycophancy-answer/causal_pilots/phase3_sycophancy_answer_logit_sweep
  candidates:
    - sycophancy_kto_delta_wrong_hint_followed_vs_not_l17
    - sycophancy_sft_delta_wrong_hint_followed_vs_refused_l36
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  runner_overrides:
    readiness_checks:
      require_extraction_manifest:
        status: ok
        verified: true
        row_count: 32
        label_counts:
          known: 32
      require_direction_status: ok
      require_hidden_dim_match: true
      require_layer_role_match: true
      require_vector_hash_check: true
      require_no_mutation_of_source_artifacts: true
    selection:
      probe_results: null
      row_keys_file: experiment/phase1/probe/config/phase3_sycophancy_answer_32_row_keys.txt
    control_settings:
      wrong_layer:
        layer_offsets: [-2, -1]
      random_matched_norm:
        seeds:
          - 20260620
          - 20260621
    logit_targets:
      groups:
        - name: refusal_openers
          source: static_strings
          strings:
            - I
            - Sorry
            - I don't
          include_leading_space_variants: true
          include_multi_token_first_token: true
        - name: answer_aliases
          source: row_aliases
          include_leading_space_variants: true
          include_multi_token_first_token: false
        - name: wrong_hint_answer
          source: row_field
          field_path: sycophancy.incorrect_answer
          include_leading_space_variants: true
          include_multi_token_first_token: false
  modes:
    - name: logit_diagnostic
      max_rows: 32
      coefficients:
        - 10.0
        - 25.0
      controls:
        - no_vector_baseline
        - activation_addition
        - activation_subtraction
        - wrong_layer
        - wrong_layer_subtraction
        - random_matched_norm
