purpose: >-
  Build a focused GRPO v2 SelfAware behavior panel for the unknown-answering
  side of calibrated expression. The panel balances unknown_answered_wrong
  against unknown_refused and includes known_correct_answered / known_refused
  controls for safety checks.

behavior_arm: clean_sft_grpo_v2
strata_prefix: grpo_v2_unknown_failure_panel

inputs:
  scored_rows: ../eval/results_amendment_e_response_confidence_selfaware_clean_sft_grpo_v2_seed1_corrected_base_full_4b/clean_schema_sft_grpo_v2_seed1_corrected_base__selfaware/scored_rows.jsonl

sampling:
  seed: 20260625

require_quotas: true

quotas:
  unknown_answered_wrong: 64
  unknown_refused: 64
  known_correct_answered: 64
  known_refused: 64

output:
  manifest: manifests/phase3_current_clean_grpo_v2_unknown_failure_selfaware_manifest.json
  row_keys_file: config/phase3_current_clean_grpo_v2_unknown_failure_selfaware_row_keys.txt
  selected_scored_rows: config/phase3_current_clean_grpo_v2_unknown_failure_selfaware_scored_rows.jsonl
  summary: config/phase3_current_clean_grpo_v2_unknown_failure_selfaware_manifest.summary.json
