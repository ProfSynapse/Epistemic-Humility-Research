# Generated-answer replay for the best first GRPO v2 unknown-failure candidate.
#
# The direction points toward unknown_answered_wrong, so activation_subtraction
# is the intended repair direction.

sweep:
  name: phase3_current_clean_grpo_v2_unknown_failure_l16_generation_replay
  evidence_tier: tier2_exploratory_local
  runner_config: experiment/phase1/probe/config/phase3_current_clean_grpo_v2_unknown_failure_logit_candidates.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_current_clean_grpo_v2_unknown_failure_logit_candidates.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_grpo_v2_unknown_failure_l16_generation_replay
  candidates:
    - clean_sft_grpo_v2_delta_unknown_wrong_vs_refused_l16_normed
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  modes:
    - name: generation
      max_rows: 256
      max_new_tokens: 48
      coefficients: [5.0, 10.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
