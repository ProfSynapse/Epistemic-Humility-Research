# Phase 3 dedicated SelfAware frozen-manifest hidden-state extraction, full run.
#
# Current JSON-output response-confidence clean SFT row. This extracts clean SFT
# as an active LoRA over the original Qwen3-4B base so h_lora/delta represent
# the SFT-learned schema/calibrated-expression surface.

model:
  model_tag: qwen3-4b-clean-sft-seed1-selfaware
  model_name: unsloth/Qwen3-4B-bnb-4bit
  revision: null
  enable_thinking: false

extraction:
  layer_list: null
  token_position_rule: final_prompt_token
  compute_dtype: bfloat16
  persist_dtype: float32
  persistence_format: safetensors
  device: cuda
  persist_delta: true

arms:
  - name: qwen3_4b_base
    adapter_state: disabled
    adapter: null
  - name: clean_sft_merged_seed1
    adapter_state: active
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/final_model

eval_arms_source: null

selection:
  source: selfaware_manifest
  manifest: manifests/phase3_selfaware_frozen_row_manifest.json

output:
  hidden_states_subdir: hidden_states_selfaware_clean_sft_full
  manifest_filename: manifest.json
  rows_filename: rows.jsonl

manifest_provenance:
  aligned_run_record_id: sft_schema_clean_seed1_full
  source_split: phase3-selfaware-frozen-row-manifest/v1
