# Tier-2 causal residual intervention on the CAUTION axis (B1 load-bearing test).
# B2 showed the L35 caution signal fires BEFORE the refusal is verbalized
# (pre-commitment), but a read cannot prove the encoded state CAUSES the
# over-refusal. B1 ablates (projects out) the raw mass-mean caution direction from
# the L35 residual at every position during greedy generation and re-scores
# realized behavior: does ablation drop over-refusal on known_refused while
# leaving known_correct_answered (specificity control) alone? Additive ITI is
# anti-steerable (F/K), so the headline arm is ablation; the +/-2 sigma shift arms
# only characterize the steerability sign. Same model/adapter/prompt/direction as
# the A.4 sweep, the caution read-trajectory (B2), and the failure-axis work.

model:
  model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
  adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model
  adapter_name: clean_sft_grpo_v2
  torch_dtype: bfloat16
  device_map: cuda
  enable_thinking: false

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

caution_direction: experiment/phase1/probe/analysis/current_clean_grpo_v2_caution_residual_direction/caution_direction_L35.json

rows: experiment/phase1/probe/analysis/current_selfaware_behavior_rows/clean_sft_grpo_v2/rows.jsonl

# Run on the two A2 contrast cells only: known_refused is the over-refusal target,
# known_correct_answered is the specificity control (ablation should NOT push it
# toward refusal). Other cells are off the caution contrast and would burn GPU.
rows_filter:
  cells:
    - known_refused
    - known_correct_answered

# Arms: baseline (no hook) + ablate (headline causal handle) + two directional
# shift arms (+/-2 sigma) for the steerability sign check. alpha is in sigma units.
arms:
  - arm_id: baseline
    mode: baseline
  - arm_id: ablate
    mode: ablate
  - arm_id: shift_minus2
    mode: shift
    alpha: -2.0
  - arm_id: shift_plus2
    mode: shift
    alpha: 2.0

sweep:
  max_new_tokens: 96
  max_rows: null

output:
  root: experiment/phase1/probe/analysis/current_clean_grpo_v2_caution_residual_intervention
