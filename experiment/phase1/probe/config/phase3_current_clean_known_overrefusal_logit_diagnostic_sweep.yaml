# Current clean known-overrefusal logit diagnostic sweep.

sweep:
  name: phase3_current_clean_known_overrefusal_logit_diagnostic
  evidence_tier: tier2_exploratory_local
  runner_config: experiment/phase1/probe/config/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  candidate_source_config: experiment/phase1/probe/config/phase3_current_clean_known_overrefusal_logit_diagnostic.yaml
  output_root: experiment/phase1/probe/analysis/current_clean_known_overrefusal_logit_diagnostic
  candidates: all
  execution:
    backend: docker
    docker:
      image: unsloth/unsloth:latest
      repo_mount: /workspace/repo
      workdir: /workspace/repo
      hf_home: /workspace/repo/.cache/hf
      huggingface_hub_cache: /workspace/repo/.cache/hf/hub
  modes:
    - name: logit_diagnostic
      max_rows: 24
      coefficients: [10.0, 25.0, 50.0]
      controls:
        - no_vector_baseline
        - activation_subtraction
        - wrong_layer_subtraction
        - random_matched_norm
        - activation_addition
