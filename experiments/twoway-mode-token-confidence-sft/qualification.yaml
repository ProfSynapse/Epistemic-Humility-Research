schema_version: 1
experiment: twoway-mode-token-confidence-sft
# DRAFT dev-qualification config (was Stage-S qualification.yaml). Two modes; adds
# the rethought noninferiority gate and the new confidence-calibration gate.

training_config: training.yaml
dev:
  path: analysis/dataset/dev.jsonl
  sha256: e6eb7a1d2552b4e8e5df6517e2da492a40199cc381a2f5b41713d6b32de6cb9b   # relabeled dev; filled in CODE from builder output, re-verified at sign
  rows: 602
  rows_by_mode: {ABSTAIN: 200, ANSWER: 402}
heldout:
  access: hash_only_outside_qualification_runner
  path_forbidden_in_runner: experiments/fresh-sft-epistemic-mode-token-grpo/analysis/dataset/heldout.jsonl

canonical_scorer:
  path: experiments/common/knowledge_probe/scoring.py
  sha256: 1be766d57a8c8b8e99748156c72e3a4b967f768ce81a561e95be2c1636c80948

models:
  base:
    repo: unsloth/Qwen3-4B-bnb-4bit
    revision: cad0bedfdd862093a12af478cb974ab2addd0e0a
  stage_s:
    artifact_path: invocation_required
    special_token_lineage_path: invocation_required

tuner:
  expected_commit: f6f1229   # repaired PEFT-aware adapter loader, mandatory
  require_clean_worktree: true

generation:
  public_tuner_verb: batch-generate
  engine: hf-batched
  batch_size: 8
  max_new_tokens: 128
  min_new_tokens: 1
  do_sample: false
  seed: 20260722
  enable_thinking: false
  paths:
    - base_native
    - stage_s_native
    - stage_s_forced_each_configured_token   # two tokens now -> 2 forced lanes
  persistence: tuner_incremental_jsonl_with_resume

posture_contract:
  ANSWER:
    require_nonempty_substantive_answer: true
    forbidden_phrases_casefold:
      - "i don't know"
      - "i do not know"
      - "not sure"
      - "not certain"
      - "uncertain"
      - "cannot answer"
      - "can't answer"
      - "no reliable answer"
      - "no idea"
      - "unknown"
  ABSTAIN:
    exact_answers:
      - "I don't know reliably."
  # No QUALIFY posture contract: QUALIFY is a product-layer rendering rule, not a
  # trained token (see AMENDMENT.md sec 7).

gates:
  configured_first_token_rate_min: 0.95
  valid_json_after_mode_token_rate_min: 0.95
  exact_required_fields_rate_min: 0.95
  confidence_parse_and_range_rate_min: 0.95
  confidence_population_sd_min: 0.10          # LOCKED 2026-07-24 (raised from Stage-S 0.05)
  deterministic_forced_token_posture_compliance_min: 0.95
  visible_special_token_stripping_rate_min: 1.0
  per_mode_recall:
    metric: two_sided_95pct_wilson_lower_bound
    lower_bound_gt: 0.5
    minimum_successes:
      abstain_n_200: 114
      answer_n_402: 221
  max_single_mode_share:
    numerator_max: 542                         # LOCKED 2026-07-24
    denominator: 602
  answer_quality_noninferiority:
    subset: attempted_rows_stage_s_answer
    metric: paired_correctness_difference_stage_s_minus_base
    ci: two_sided_95pct_paired_percentile_bootstrap
    seed: 20260722
    resamples: 10000
    lower_bound_gt: -0.10
  abstention_rate_band:                        # LOCKED 2026-07-24
    lower: 0.22
    upper: 0.42
  confidence_calibration:                      # LOCKED 2026-07-24, first-class HARD gate
    hard_gate: true
    subset: attempted_rows_only
    discrimination_auroc_min: 0.62
    ece_max: 0.30
    ece_buckets: 10
    bootstrap_seed: 20260722
    bootstrap_resamples: 1000

output:
  root: analysis/qualification
  prompt_files:
    base_native: prompts_base_native.jsonl
    stage_s_native: prompts_stage_s_native.jsonl
    stage_s_forced: prompts_stage_s_forced.jsonl
  generation_directories:
    base_native: generation_base_native
    stage_s_native: generation_stage_s_native
    stage_s_forced: generation_stage_s_forced
  scored_rows: scored_rows.jsonl
  run_manifest: run_manifest.json
  summary: summary.json
