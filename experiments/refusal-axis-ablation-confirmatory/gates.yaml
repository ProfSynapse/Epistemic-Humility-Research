# Pre-stated gates for refusal-axis-ablation-confirmatory.
# Fixed at signing; never retuned after any result.

rc_g0:
  # Integrity precondition (pre-outcome stop).
  per_seed_lineage: {adapter_run: schema_clean_sft_grpo_v2_seed2_full/20260804_131151,
                     base_run: sft_schema_clean_seed2_full/20260731_232307}
  direction_fit_metadata: {pos_cell: known_refused, neg_cell: known_correct_answered,
                           layer: 35,
                           schema_version: mechinterp-residual-caution-direction/v1}
  full_coverage: true            # every behavior-cell row in every arm
  baseline_known_overrefusal_min: 0.97   # by construction; seed-1 read 0.994

rc_g1:
  # Confirmatory call, fixed here. Post-ablation known-item over-refusal:
  confirmed_max: 0.10            # AND specificity intact => promotion licensed
  specificity: {induced_refusal_max: 0.05, correct_rate_drop_max: 0.05}
  partial_range: [0.10, 0.30]    # or any specificity break: NOT CONFIRMED, no promotion
  falsified_min: 0.30            # collapse is seed-1-specific; no promotion
  promotion_on_pass: paper 3 Section 6 and paper 5 section 6.6 may carry the
    full-ablation collapse with both seeds cited
