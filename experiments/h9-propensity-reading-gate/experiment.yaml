question: >-
  Does the AL confabulation-propensity direction, frozen from its 1,662-row fit
  surface, still separate confabulations from honest unanswerable refusals on a
  disjoint held-out draw the fit never saw, on the AI-TRUE checkpoint?
prediction: >-
  orchestrator: H9-G1 PASS (~55%) with the held-out propensity AUROC landing in
  the low-to-mid 0.6s near the 0.62 pass line; H9-G2 caution floor PASS (~90%);
  H9-G0 evaluability met (~85%). User prediction: H9-G1 INCONCLUSIVE band (recorded 2026-07-10).
falsifier: >-
  Held-out propensity AUROC <= 0.55, OR the upper bound of its 1,000-resample
  row-bootstrap 95% CI < 0.60, means the reading does not generalize off the fit
  surface and paper 5's "the propensity direction reads" claim is not supported
  on held-out data.
