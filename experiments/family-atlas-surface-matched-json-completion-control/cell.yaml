generation:
  engine: vllm
  decode: greedy
  do_sample: false
  max_new_tokens: 512
  min_new_tokens: 1
  batch_size: 16
  num_beams: 1
  canonical_eos_enabled: true
  vllm:
    synaptic_tuner_host_revision: 901dbe803699e0bf00b73426526babdaf8598cf3
    synaptic_tuner_source:
      root: synaptic-tuner
      algorithm: sha256_canonical_path_digest_size_v1
      sha256: e989fb5ef07d95612dbb6aff88f92c259a484d557c8bb4e91ddf8add2007bee3
      files:
      - tuner.py
      - tuner/__init__.py
      - tuner/cli/__init__.py
      - tuner/cli/main.py
      - tuner/cli/parser.py
      - tuner/cli/router.py
      - tuner/handlers/__init__.py
      - tuner/handlers/base.py
      - tuner/handlers/batch_generate_handler.py
      - tuner/core/__init__.py
      - tuner/core/config.py
      - tuner/core/interfaces.py
      - tuner/utils/__init__.py
      - tuner/utils/conda.py
      - tuner/utils/environment.py
      - tuner/utils/validation.py
      - tuner/batch/__init__.py
      - tuner/batch/runner.py
      - tuner/batch/persistence.py
      - tuner/batch/gpu_telemetry.py
      - tuner/batch/sync_hook.py
      - tuner/batch/engines/__init__.py
      - tuner/batch/engines/base.py
      - tuner/batch/engines/vllm_engine.py
      - shared/utilities/__init__.py
      - shared/utilities/paths.py
    expected_version: 0.23.0
    model_runner: v1
    batch_invariant: true
    batch_invariant_env: VLLM_BATCH_INVARIANT=1_before_engine_construction
    compute_dtype: bfloat16
    trust_remote_code: false
    tensor_parallel_size: 1
    max_model_len: 2048
    gpu_memory_utilization: 0.90
    max_num_seqs: 32
    max_num_batched_tokens: 8192
    per_model:
      gemma4_e4b_it:
        limit_mm_per_prompt: {image: 0, audio: 0, video: 0}
        suppress_tokens:
        - {token: "<turn|>", expected_id: 106}
        - {token: "<|tool_response>", expected_id: 50}
      qwen3_4b_raw_base:
        limit_mm_per_prompt: {}
        suppress_tokens:
        - {token: "<|endoftext|>", expected_id: 151643}
    structured_output_backend: xgrammar
    structured_output_disable_any_whitespace: true
    output_schema:
      type: object
      properties:
        answer: {type: string}
        response_confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [answer, response_confidence]
      additionalProperties: false
    require_prompt_token_ids_sha256: true
    require_prompt_token_count: true
    require_completion_token_ids: true
    require_finish_reason: true
    require_schema_hash: true
  grader_contract:
    base: program_standard_degeneracy_refusal_alias_correctness
    answerable_alias_conversion: canonical_string_from_numeric_umwp_answer
    unanswerable_answers_consumed: false
    required_fixture_classes: [integer, negative, decimal, numeric_boundary, refusal, malformed, degenerate, wrong_answer]
  role_labels: [confab, known_correct_answered, unknown_refused]
  exclude_ambiguous_grade: true
  answerable_reference_answers_only: true
  fresh_exclusion:
    normalization: unicode_normalize_casefold_whitespace_collapse
    against_each_models_prior_atlas_pool: true
    commit_hashes: false

surface_basis:
  scalar_features:
  - rendered_prompt_token_count
  - question_char_count
  - question_word_count
  - question_line_count
  - digit_count_and_fraction
  - punctuation_count_and_fraction
  - newline_count_and_fraction
  - uppercase_count_and_fraction
  lexical:
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
    hash_features_word: 65536
    hash_features_char: 65536
    alternate_sign: false
    tfidf_sublinear_tf: true
    svd_components_word: 64
    svd_components_char: 64
    svd_seed: 20260721
    scaling: standard
  block_by: native_source
  forbidden_features:
  - role
  - answer_text
  - alias_text
  - UMWP_category
  - model_generation
  - model_grade
  - activation
  - completion_length

matching:
  ratio: "1:1:1"
  roles: [known_correct_answered, confab, unknown_refused]
  method: deterministic_two_pass_hungarian
  pass_1:
    sides: [confab, unknown_refused]
    within: [native_source, UMWP_category]
    quota: smaller_role_count_per_source_category
  pass_2:
    left: mean_surface_vector_of_matched_unknown_pair
    right: known_correct_answered
    within: native_source
  cost: squared_euclidean_standardized_scalar_and_lexical_svd
  within: native_source
  without_replacement: true
  cross_original: true
  forbidden_edge_cost: infinity
  tie_break: lexicographic_role_ordered_umwp_ids
  category_use: balance_confab_vs_unknown_refused_and_report_only
  partition:
    unit: intact_triad
    stratify_by: native_source
    seed: 20260721
  minimum_fit_triads: 64
  minimum_held_out_triads: 64

surface_classifier:
  feature_basis: full_hashed_lexical_plus_scalars
  comparisons: all_pairwise_one_vs_one
  folds: 5
  grouped_by: intact_triad
  metric: maximum_pairwise_best_orientation_held_out_auroc
  max_auroc: 0.60
  max_pairwise_scalar_abs_smd: 0.10
  positive_control_tag: three_column_one_hot_role
  positive_control_min_each_pairwise_auroc: 0.90

capture:
  layers: all
  position: final_prompt_token
  persist_dtype: float32
  no_steering_hooks: true
  profile_population: matched_fit_intact_triads

profile:
  metric: eff_dim_frac
  estimator: participation_ratio_over_n_rows
  depth_formula: hs_index / (n_hidden_states - 1)
  early_exterior_max_depth: 0.20
  primary_invariant: peak_location
  margin_decision_use: descriptive_only
  require_unique_real_peak: true
  subsample:
    fraction: 0.50
    unit: intact_triad
    stratify_by: native_source
    seed: 20260721

read_panel:
  held_out: true
  axes: [doubt, caution, raw_refusal]
  minimum_auroc: 0.80
  strict_interior_depth: [0.20, 0.85]
  require_joint_layer: true
  bootstrap_resamples: 2000
  bootstrap_seed: 20260707
  random_direction_seed: 20260707

planted_location_control:
  seed: 20260722
  distribution: centered_high_rank_gaussian_row_space_noise
  rms_scale_grid: [0.25, 0.5, 1, 2, 4, 8, 16]
  require_unique_peak: true
  min_peak_to_runner_up_ratio: 1.05

secondary_sensitivities:
  exact_original_pairs:
    decision_use: descriptive_only
    split_by_unanswerable_behavior: true

containers:
