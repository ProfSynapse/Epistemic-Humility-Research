question: >-
  Does a direction fit purely on the in-context true-vs-false evidence
  contrast (d_ev, mean paired difference of true_answer minus
  false_answer_placebo hs20 anchors over 200 fit confab rows) also separate
  held-out confab from correct-control at the no_answer_baseline arm, i.e. do
  the evidence-registration and prospective-ignorance signals live on one
  recoverable axis, or does M4-WK's fragmentation reading stand?
prediction: >-
  d_ev separates the 200 held-out confab rows from the 360 correct-control
  rows at the no_answer_baseline arm with AUROC >= 0.70, exceeds the
  covariance-shaped random-direction null at p < 0.05, and matches the native
  ignorance-fit direction (paired AUROC-difference lower 95% CI >= -0.05):
  one evidence/doubt axis, upgrading the fragmentation reading.
falsifier: >-
  With the fit/held-out split valid and all provenance gates green, d_ev's
  held-out baseline confab-vs-correct AUROC is < 0.70: the evidence-contrast
  direction carries no prospective ignorance content (an in-context
  answer-integration direction only), and M4-WK's fragmentation reading
  stands, strengthened. A below-floor rung (a) is a substantive null, not a
  void/lift; void is reserved for broken SC0/SC3 provenance gates.
