question: >-
  Can a fresh Qwen3-4B SFT learn to emit ANSWER, QUALIFY, or ABSTAIN as its
  first action according to frozen empirical knowledge evidence, and can GRPO
  then improve that internal-state-to-action alignment without sacrificing
  answer quality?
prediction: >-
  The fresh SFT will learn valid and causally effective mode tokens, and
  true-label GRPO will improve held-out mode selection and external utility over
  both SFT-only and permuted-label GRPO while preserving a monotonic relationship
  between an independent knowledge readout and token choice.
falsifier: >-
  Falsify the path if true-label GRPO does not beat both SFT-only and matched
  permuted-label GRPO on held-out mode appropriateness, if gains require
  single-mode collapse, or if behavior improves while the independent internal
  readout no longer orders mode-token logits and choices.
