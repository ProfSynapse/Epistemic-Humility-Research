question: Can a fresh Qwen3-4B SFT imitate a frozen empirical epistemic action policy
  by emitting ANSWER, QUALIFY, or ABSTAIN as its first action while preserving the
  corresponding visible posture and answer quality?
prediction: The fresh SFT will emit valid native mode tokens and JSON on the dev split,
  achieve a two-sided 95% Wilson recall lower bound above 0.5 for every mode, preserve
  the deterministic forced-token posture contract, avoid collapse, and retain answer
  quality relative to the original pinned base.
falsifier: Stop this SFT checkpoint if any mode's two-sided 95% Wilson recall lower
  bound is at most 0.5, if the native token, JSON, or deterministic causal-posture
  contract fails, if choices collapse to one mode, or if answer quality falls below
  the pre-signed noninferiority floor.
