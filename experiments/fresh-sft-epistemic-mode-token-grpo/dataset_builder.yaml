schema_version: 1

source:
  canonical_scorer:
    path: experiments/common/knowledge_probe/scoring.py
    sha256: 1be766d57a8c8b8e99748156c72e3a4b967f768ce81a561e95be2c1636c80948
  probe_results:
    path: archive/experiment/phase1-data/probe/qwen3-4b-instruct/probe_results.jsonl
    sha256: f8b4b89345f15b89fa40fd834c3d9249e0a5417b67d2cf7da7eee6f936635c43
    expected_rows: 20000
  probe_manifest:
    path: archive/experiment/phase1-data/probe/qwen3-4b-instruct/probe_manifest.json
    sha256: 52f374db01b4e60c55784ae7bfa3b9353e4830ac73628457fd858b0707eb18b4
  identity:
    model_name: unsloth/Qwen3-4B-bnb-4bit
    model_tag: qwen3-4b-instruct
    probe_config_sha: 893861257973170b
    n_samples: 32
    temperature: 1.0
    top_p: 0.9
    seed: 20260610
    enable_thinking: false
  required_row_schema:
    probe_pool_row_key: string
    probe_pool_source_index: integer
    question_id: string
    question: string
    question_norm: string
    normalized_aliases: list_string
    answer_value: string
    n_samples: integer
    greedy_correct: boolean
    p_correct: number
    sampled_correct: list_boolean
    model_tag: string
    probe_config_sha: string

labeling:
  chance_probability: 0.5
  one_sided_confidence: 0.95
  clopper_pearson_boundaries:
    abstain_max_correct: 10
    answer_min_correct: 22
  confidence_target:
    estimator: jeffreys_posterior_mean
    alpha: 0.5
    beta: 0.5

# Token strings and visible behavior are experiment data, not builder semantics.
# They may be replaced by arbitrary non-empty, unique, prefix-free strings.
mode_tokens:
  ANSWER: <ANSWER>
  QUALIFY: <QUALIFY>
  ABSTAIN: <ABSTAIN>

render:
  system_message: >-
    You are a helpful assistant. Answer the question concisely. If you do not
    know the answer, say so.
  user_message_template: "$question"
  answer_text_templates:
    ANSWER: "$gold_answer"
    QUALIFY: "My best answer is $gold_answer, but I am not certain."
    ABSTAIN: "I don't know reliably."
  assistant_output_template: "$mode_token$json_payload"
  output_json:
    required_fields:
      - answer
      - answer_confidence
    additional_fields_allowed: false

splits:
  seed: 20260722
  evaluation_targets_per_mode:
    dev:
      ANSWER: 200
      QUALIFY: 200
      ABSTAIN: 200
    heldout:
      ANSWER: 400
      QUALIFY: 400
      ABSTAIN: 400
  max_group_fraction: 0.05
  max_absolute_mode_count_deviation: 5
  wilson_confidence: 0.95

output:
  directory: experiments/fresh-sft-epistemic-mode-token-grpo/analysis/dataset
  files:
    train: train.jsonl
    dev: dev.jsonl
    heldout: heldout.jsonl
    aggregate_manifest: aggregate_manifest.json
