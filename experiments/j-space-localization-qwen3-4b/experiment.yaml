verdict: 'PREP COMPLETE, NOT YET RUN AT SCALE. Correctness smoke PASSED locally
  (n=20 prompts, 5 random directions, final layer: mean cosine similarity
  0.981, mean top-10 overlap 0.82, top-1 match 3/5) -- the J-lens implementation
  is validated against the logit lens and runs end to end. Small local layer_profile
  (n=50 prompts, 4 random directions, 10 layers) and H1 direction check (n=100
  prompts) both ran and produced coherent, reportable signal (pos_ctrl/c_hat
  verbalize clearly as first-person/error/abstention tokens including literal
  "我不知道"/"I don''t know"; u_d and neg_ctrl are weaker/noisier), but at these
  small local sample sizes this is exploratory poking-around, not a resolved
  characterization. The Modal script (cloud/modal_jlens.py) is written, cost-estimated
  (~2.3-2.5h GPU-busy, ~$3-4 of the $25 cap) from an actual local-3090 benchmark,
  and launch-gated on EHR_LAUNCH_OK + MODAL_COST_CAP_USD; it has NOT been run.
  This experiment stays in status=draft until the lead reviews and fires it,
  then this verdict is replaced with the full-corpus result.'
