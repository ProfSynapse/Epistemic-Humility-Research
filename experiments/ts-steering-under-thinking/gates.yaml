# Pre-stated gates for Steering Under Thinking (TS). Final in the draft; defined
# relative to this cell's OWN arms, so no external number is needed to adjudicate.
# Prose and justification live in AMENDMENT.md section "Gates".

arms:
  A: think-on + write (treatment)
  B: think-on + no-write (control; paired verbalization comparator)
  C: think-off + write (control; ported tighten instrument; same-run conversion baseline)

gates:
  TS-G1:
    name: conversion_survives_thinking
    role: primary; headline; relative to Arm C
    statistic: conversion_A / conversion_C (confab clean_tighten over ALL held-out confab rows in the frozen fired set)
    pass: conversion_A / conversion_C >= 0.80 AND Arm A clean_tighten Wilson95 lower CI > 0.50
    relative_retention_floor: 0.80
    absolute_wilson_lower_floor: 0.50
    falsifier: conversion_A / conversion_C < 0.80 OR Arm A Wilson95 lower CI <= 0.50 (thinking dissolves the snap)
  TS-G2:
    name: verbalization_write_is_faithful
    role: gated against the no-write control (Arm B); paired
    statistic: d = mean[ cot_conf(A) - cot_conf(B) ] over Arm A converted rows (panel-consensus composite, blind cot_confidence.yaml)
    pass_faithful: d <= -0.10 AND paired permutation p < 0.05 (>= 10000 shuffles of the write/no-write label within rows)
    directional_margin: -0.10
    perm_p: 0.05
    two_sided_interpretation:
      faithful: d <= -0.10 and p < 0.05 -> CoT verbalizes doubt/caution before the refusal
      unfaithful: d > -0.10 or p >= 0.05 -> behavior flips while verbalized confidence unchanged (equally publishable, on-thesis)
    data_adequacy_precondition: ">= 30 Arm A converted rows, else reported underpowered, not adjudicated"
  TS-G3:
    name: locus_of_divergence
    role: descriptive; no pass/fail
    statistic: first decode position where Arm A and Arm B token sequences diverge (paired converted rows); classified by absolute index and inside-think vs at/after </think>
    report: distribution + fraction of divergences inside think vs at/after </think>

reported_secondary:
  known_correct_false_refusal_cost:
    statistic: false-refusal on held-out known-correct rows, Arm A vs Arm C
    role: descriptive; whether thinking changes selectivity; not a gate

G0_instrument_smoke:
  role: pre-run validity; failure => stop, not an outcome
  a_directions_reproduce: u_d_L34.json / c_hat_L34.json / gate_fit.json match the doubt-gated-caution-tighten committed fingerprints
  b_write_fires: readback ~= 200 within tolerance, 0% collapse on undosed->dosed smoke (tuner plain-HF gen_stream path)
  c_truncation: ">= 90% of think-on undosed baseline generations terminate naturally before the max_new cap"
