question: Does a doubt-gated caution write actuate raw refusal on the non-Qwen families
  (Llama-3.2-3B, Mistral-7B-v0.3) when written at their own atlas-located workspace-band
  sites, rather than at the ported round(0.94*(L-1)) late site the cross-family confirmatory
  indicted, with directions and dose chosen on FIT only and the operating point confirmed
  on held-out?
prediction: The doubt-gated caution write actuates clean raw refusal at the atlas-located
  workspace-band site on at least one of the two non-Qwen families; at least one of
  {llama, mistral} reaches outcome shape A, i.e. held-out fired-confab refused >=
  0.60 (Wilson 95% LCB > 0.50) AND well-formed >= 0.80 with known-correct false-refusal
  <= 0.05 (Wilson 95% UCB < 0.10) and the random_direction placebo a no-op within
  2 points of baseline on both populations.
falsifier: Falsified if neither family reaches shape A, i.e. both families land in
  shape B (refusal does not transfer with confidence), C (refusal transfers but well-formed
  < 0.80), D (confab legs clear but not cost-safe), E (thresholds clear but random_direction
  not a no-op), or F (no FIT-viable dose exists, so the write does not actuate clean
  refusal at the atlas site even where the axis is maximally readable). Shapes A-F
  are exhaustive over a family that clears G0; a G0 instrument-validity failure is
  a pre-outcome stop, not a shape.
