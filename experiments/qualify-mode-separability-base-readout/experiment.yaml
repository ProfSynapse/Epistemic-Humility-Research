slug: qualify-mode-separability-base-readout
title: QUALIFY Mode Separability on Base-Model Readout
type: lab-diagnostic
status: null-result
registered: true
created_at: '2026-07-23T22:27:09Z'
question: Is the QUALIFY category of the falsified fresh-sft-epistemic-mode-token-grpo
  Stage-S checkpoint recoverable from the base model's own pre-generation representations
  -- i.e. would a class-balanced retrain plausibly fix the QUALIFY-void, or is the
  category itself not encoded in the base model?
prediction: The QUALIFY band is substantially recoverable from base-model hidden states
  under a band-aware readout (banded k-regression and/or direct multinomial 3-way
  readout clear the primary PASS bar, AUROC>=0.62 with CI lower>0.55, at at least
  one of the four measured depths), while the naive linear QUALIFY-vs-rest floor underperforms
  both band-aware readouts by a nontrivial margin -- supporting a retrain-worth-trying
  verdict and confirming the class-imbalance-during-training mechanism flagged in
  fresh-sft-epistemic-mode-token-grpo/AMENDMENT.md sec 10 rather than a fundamentally
  unencoded category.
falsifier: If both the banded k-regression QUALIFY-vs-rest AUROC and the direct multinomial
  3-way QUALIFY-vs-rest AUROC fail the PASS bar at every one of the four measured
  depths (point AUROC<=0.55 OR bootstrap 95% CI upper<0.60), that falsifies recoverability
  under this instrument -- a class-balanced retrain would not be expected to fix the
  QUALIFY-void by this evidence, and the category should be treated as not encoded
  (or not linearly/banded-linearly encoded) in the base model's representation at
  these depths.
