purpose: >-
  Build a focused clean SFT->DPO->GRPO SelfAware behavior panel for the
  unknown-answering side of calibrated expression. The panel mirrors the GRPO
  v2, GRPO-DPO, and KTO unknown-failure panels so cross-regimen scans compare
  the same behavior-cell structure (GRPO stacking-order question: DPO-then-GRPO
  vs GRPO-then-DPO).

behavior_arm: clean_sft_dpo_grpo
strata_prefix: dpo_grpo_unknown_failure_panel

inputs:
  scored_rows: ../eval/results_amendment_f_response_confidence_selfaware_clean_sft_dpo_grpo_seed1_full_4b/clean_sft_dpo_grpo_seed1__selfaware/scored_rows.jsonl

sampling:
  seed: 20260626

require_quotas: true

quotas:
  unknown_answered_wrong: 64
  unknown_refused: 64
  known_correct_answered: 64
  known_refused: 64

output:
  manifest: manifests/current_clean_dpo_grpo_unknown_failure_selfaware_manifest.json
  row_keys_file: experiments/grpo-centered-stacking/artifacts/configs/current-clean-dpo-grpo-unknown-failure/current_clean_dpo_grpo_unknown_failure_selfaware_row_keys.txt
  selected_scored_rows: experiments/grpo-centered-stacking/artifacts/configs/current-clean-dpo-grpo-unknown-failure/current_clean_dpo_grpo_unknown_failure_selfaware_scored_rows.jsonl
  summary: experiments/grpo-centered-stacking/artifacts/configs/current-clean-dpo-grpo-unknown-failure/current_clean_dpo_grpo_unknown_failure_selfaware_manifest.summary.json
