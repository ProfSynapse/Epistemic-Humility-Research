analysis:
  ridge: 1.0
  class_weighting: balanced
  cv_folds: 4
  min_rows_per_cell: 32
  ranks:
    - 1
    - 2
    - 4
    - 8
    - 16
    - full
  cells:
    - label: known_refused
      filter:
        label: known
        refused: true
    - label: known_correct_answered
      filter:
        label: known
        refused: false
        correct: true
    - label: unknown_refused
      filter:
        label: unknown
        refused: true
    - label: unknown_answered_wrong
      filter:
        label: unknown
        refused: false
        correct: false

extractions:
  - label: clean_sft_dpo_grpo_unknown_failure_prompt_matched_panel
    behavior_arm: clean_sft_dpo_grpo
    roles:
      - h_base
      - h_lora
      - delta
    extraction_dir: archive/experiment/phase1/probe/qwen3-4b-clean-sft-dpo-grpo-seed1-selfaware/hidden_states_selfaware_clean_sft_dpo_grpo_unknown_failure_panel_prompt_matched/extraction__7dfcdd2681a5
    extraction_manifest: archive/experiment/phase1/probe/qwen3-4b-clean-sft-dpo-grpo-seed1-selfaware/hidden_states_selfaware_clean_sft_dpo_grpo_unknown_failure_panel_prompt_matched/extraction__7dfcdd2681a5/manifest.json
    rows_path: archive/experiment/phase1/probe/qwen3-4b-clean-sft-dpo-grpo-seed1-selfaware/hidden_states_selfaware_clean_sft_dpo_grpo_unknown_failure_panel_prompt_matched/extraction__7dfcdd2681a5/rows.jsonl

output:
