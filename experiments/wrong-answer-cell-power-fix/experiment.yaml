question: On hundreds of wrong-answered rows instead of sixteen, does the internal
  known-unknown axis still rank the model's own correct versus wrong answers better
  than its emitted response_confidence does, and does the calibration contrast in
  paper 3 Figure 1 survive once the answered-known base rate is no longer 96 percent?
prediction: Internal refit readout AUROC(correct vs wrong) lands at 0.60 to 0.72 against
  the emitted scalar's already-measured 0.5207, a gap of +0.08 to +0.20 with a paired
  CI excluding 0; internal ECE rises off 0.004 to 0.05 to 0.15 raw while emitted ECE
  rises to 0.25 to 0.32 raw, so the calibration contrast survives and widens under
  both accountings; the correct > wrong internal ordering holds.
falsifier: 'On at least 300 wrong rows the internal refit readout ranks correct versus
  wrong at AUROC below 0.60 AND the gap over the emitted scalar is at most +0.05 with
  a paired CI including 0: the internal axis does not discriminate its own correctness
  better than the stated channel at deployment, overturning manuscript.md:336-337
  in its discrimination half.'
