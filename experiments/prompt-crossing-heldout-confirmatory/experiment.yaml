  full coverage 1832 rows on all 20 primary arms, config shas match pinned bytes,
  lead recomputed all 20 arms from raw scored rows matching metrics exactly. Secondary
  descriptive: internalization generalizes to KUQ (88.34) and BIG-bench (100.0) with
  base at 0.00 on both.'
