slug: prompt-crossing-heldout-confirmatory
title: 'Prompt-crossing held-out confirmatory: promoting the paper-2 prompt-condition
  claims on out-of-distribution surfaces'
type: eval
status: resolved
registered: true
created_at: '2026-08-17T14:04:19Z'
question: Do the three exploratory prompt-condition claims of paper 2 Section 4.2
  (instruction gap at base; SFT-only internalization under structure-only; erosion
  not erasure after a preference stage) replicate on held-out out-of-distribution
  known/unknown surfaces on the same Qwen3-4B checkpoints?
prediction: On AmbigQA validation, base P-rc minus P-plain refusal-recall gap in 50-90pp;
  every cold SFT seed P-struct recall 40-80% with base and every cold DPO/KTO seed
  <= 10% scored; every seq preference arm at 40-100% of its same-seed cold-SFT parent.
falsifier: Per-claim, fixed at signing - C1 gap < 15pp; C2 any cold SFT seed < 20%
  or base > 15% or any cold DPO/KTO seed >= 20%; C3 any seq arm < 25% of its same-seed
  parent (erasure).
