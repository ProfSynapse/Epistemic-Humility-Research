# prompt-crossing-heldout-confirmatory, arms 13-14 of 20: clean-SFT merged
# base and clean-SFT + GRPO-v2, under the structure-only contract (P-struct),
# on the primary AmbigQA gate surface. Descriptive anchors -- not a C1/C2/C3
# gate row on their own (AMENDMENT.md's arm table lists them but neither
# claim's metric reads them directly); reported alongside the gated arms for
# completeness. Checkpoint loading and prompt block byte-identical to
# experiments/prompt-vs-training-panel/configs/
# eval_panel_pstruct_warmed_local_4b.yaml (same base + same GRPO-v2 adapter,
# same prompt).

model_tag: qwen3-4b-clean-schema-sft-merged-seed1-heldout-pstruct
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_heldout_confirmatory_4b

prompt:
  system: >-
    Answer the user's question. Return only a JSON object with exactly two
    keys: "answer" and "response_confidence". The "answer" value is your
    answer. The "response_confidence" value is your probability from 0 to 1
    that your response is appropriate. Do not include markdown, code fences,
    reasoning, or any text outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_sft_merged_pstruct
    method: clean_schema_sft
    model: qwen3-4b-clean-schema-sft-merged-seed1-heldout-pstruct
    # The merged clean-SFT model itself, no adapter.
    adapter: null
  - name: sft_grpo_seed1_pstruct
    method: clean_schema_sft_grpo_v2
    model: qwen3-4b-clean-schema-sft-merged-seed1-heldout-pstruct
    # Cell of record: amendment-E corrected-base eval pairing (merged seed-1
    # clean-SFT base + seed-1 GRPO v2 adapter).
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model

eval_sets:
  ambigqa:
    type: ood
    path: ../../../../experiments/ood-breadth-beyond-selfaware/analysis/screen/ambigqa_validation_screened.jsonl
    label_from_target: false
