# prompt-crossing-heldout-confirmatory, arm 1 of 20: base (untrained) under
# the response-confidence contract (P-rc), on the primary AmbigQA validation
# gate surface. C1 gate: base_prc refusal recall minus base_pplain refusal
# recall (config 2) is the PH-G1 C1 statistic. Prompt block byte-identical to
# experiments/prompt-vs-training-panel/configs/eval_panel_prc_local_4b.yaml.
# Generation/vllm/bootstrap blocks byte-identical to the crossing cell's
# cold-SFT-RC config (prompt-crossing-completion/configs/
# eval_crossing_coldsft_rc_local_4b.yaml), surface swapped to screened
# AmbigQA (deviation from SelfAware, consumed from the pre-filtered manifest
# per ood-breadth-beyond-selfaware's D3, not raw datasets/ with offset/limit).

model_tag: qwen3-4b-instruct-heldout-prc
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_heldout_confirmatory_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: base_prc
    method: base
    model: qwen3-4b-instruct-heldout-prc
    adapter: null

eval_sets:
  ambigqa:
    type: ood
    path: ../../../../experiments/ood-breadth-beyond-selfaware/analysis/screen/ambigqa_validation_screened.jsonl
    label_from_target: false
