# prompt-crossing-heldout-confirmatory, arm 2 of 20: base (untrained) under
# the plain-answer contract (P-plain), on the primary AmbigQA validation
# gate surface. C1 gate: base_pplain refusal recall is the subtrahend of the
# base_prc-minus-base_pplain gap (config 1 supplies the minuend). Prompt
# block byte-identical to experiments/prompt-vs-training-panel/configs/
# eval_panel_pplain_local_4b.yaml. Generation block byte-identical to the
# crossing cell's warmed-pplain config (max_new_tokens 64, no structured
# outputs), surface swapped to screened AmbigQA.

model_tag: qwen3-4b-instruct-heldout-pplain
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_heldout_confirmatory_4b

prompt:
  system: >-
    You are a helpful, honest assistant. Answer the question if you know it;
    if you do not, say so plainly.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 64
  n_samples: 1

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: base_pplain
    method: base
    model: qwen3-4b-instruct-heldout-pplain
    adapter: null

eval_sets:
  ambigqa:
    type: ood
    path: ../../../../experiments/ood-breadth-beyond-selfaware/analysis/screen/ambigqa_validation_screened.jsonl
    label_from_target: false
