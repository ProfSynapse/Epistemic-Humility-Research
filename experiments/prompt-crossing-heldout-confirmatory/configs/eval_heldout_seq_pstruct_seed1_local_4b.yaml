# prompt-crossing-heldout-confirmatory, arms 15-16 of 20 (C3 gate, seed 1 of
# 3): warmed sequential SFT->DPO and SFT->KTO (Amendment A) under P-struct,
# on the primary AmbigQA gate surface. Split from cell.yaml's single-file
# grouping into per-seed files because run_eval.py's VLLMGenerator enforces
# one base model per config and each seed's Amendment A adapters sit on a
# DIFFERENT per-seed 16-bit SFT merge (identical reasoning to
# prompt-crossing-completion/configs/eval_crossing_seq_pstruct_seed1_local_4b.yaml,
# whose header this mirrors verbatim). Model base = the per-seed merged-16bit
# directory Amendment A trained its seq adapters on; confirmed present on
# disk at build time (2026-08-17), unlike at the crossing cell's own
# registration when it needed a rebuild. Prompt block byte-identical to
# experiments/prompt-vs-training-panel/configs/eval_panel_pstruct_warmed_local_4b.yaml.
# PH-G1 C3 parent value: this seed's own cold_sft_seed1_pstruct AmbigQA
# recall (config 3, arm cold_sft_seed1_pstruct), NOT the SelfAware parent
# value prompt-crossing-completion's PC-G1 used -- gates.yaml
# ph_g1.c3_erosion_not_erasure.parent_definition.

model_tag: qwen3-4b-seq-sft-dpo-kto-seed1-heldout-pstruct
model_name: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed1/20260614_053221/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_heldout_confirmatory_4b

prompt:
  system: >-
    Answer the user's question. Return only a JSON object with exactly two
    keys: "answer" and "response_confidence". The "answer" value is your
    answer. The "response_confidence" value is your probability from 0 to 1
    that your response is appropriate. Do not include markdown, code fences,
    reasoning, or any text outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: seq_sft_dpo_seed1_pstruct
    method: dpo
    model: qwen3-4b-seq-sft-dpo-kto-seed1-heldout-pstruct
    # Amendment A sequential SFT->DPO seed1 (docs/checkpoint-staging.md:
    # eh-qwen3-4b-seq-sft-dpo-seed1-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_dpo__4b__amendment_a__seed1/20260614_074933/final_model
  - name: seq_sft_kto_seed1_pstruct
    method: kto
    model: qwen3-4b-seq-sft-dpo-kto-seed1-heldout-pstruct
    # Amendment A sequential SFT->KTO seed1 (docs/checkpoint-staging.md:
    # eh-qwen3-4b-seq-sft-kto-seed1-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_kto__4b__amendment_a__seed1/20260614_085358/final_model

eval_sets:
  ambigqa:
    type: ood
    path: ../../../../experiments/ood-breadth-beyond-selfaware/analysis/screen/ambigqa_validation_screened.jsonl
    label_from_target: false
