# prompt-crossing-heldout-confirmatory, arms 3-12 of 20: base (untrained),
# cold SFT (3 seeds), cold DPO (3 seeds), cold KTO (3 seeds), all under the
# structure-only contract (P-struct), all on the raw bnb-4bit base (adapter-
# only differences, one config per the panel's P-struct-cold precedent
# experiments/prompt-vs-training-panel/configs/
# eval_panel_pstruct_cold_local_4b.yaml, which groups base/SFT/DPO/KTO/GRPO
# arms sharing one base into a single file). C1's base_pstruct row is
# descriptive here (C1's gate metric only reads P-rc/P-plain, configs 1-2);
# C2 gate: cold SFT/DPO/KTO internalization test.
#
# cold_dpo_seed1 / cold_kto_seed1 use the postfix-rerun cell of record
# (experiments/headline-seed1-postfix-rerun/, scope = DPO/KTO seed1 only,
# per experiments/prompt-vs-training-panel/NOTEBOOK.md ~60-67); seeds 2-3
# have no postfix rerun in scope and use the original headline checkpoints
# (docs/checkpoint-staging.md rows eh-qwen3-4b-headline-{dpo,kto}-seed{2,3}-lora).
# Prompt block byte-identical to eval_panel_pstruct_cold_local_4b.yaml.

model_tag: qwen3-4b-instruct-heldout-cold-pstruct
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_heldout_confirmatory_4b

prompt:
  system: >-
    Answer the user's question. Return only a JSON object with exactly two
    keys: "answer" and "response_confidence". The "answer" value is your
    answer. The "response_confidence" value is your probability from 0 to 1
    that your response is appropriate. Do not include markdown, code fences,
    reasoning, or any text outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: base_pstruct
    method: base
    model: qwen3-4b-instruct-heldout-cold-pstruct
    adapter: null
  - name: cold_sft_seed1_pstruct
    method: sft
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # Cell of record: headline SFT seed 1 (not a postfix rerun; predates the
    # dev-split fix; postfix scope is DPO/KTO only).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed1/20260614_053221/final_model
  - name: cold_sft_seed2_pstruct
    method: sft
    model: qwen3-4b-instruct-heldout-cold-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed2/20260615_090734/final_model
  - name: cold_sft_seed3_pstruct
    method: sft
    model: qwen3-4b-instruct-heldout-cold-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed3/20260615_104507/final_model
  - name: cold_dpo_seed1_pstruct
    method: dpo
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # Cell of record: postfix-rerun DPO r2 (headline-seed1-postfix-rerun).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed1_postfix/20260807_192026/final_model
  - name: cold_dpo_seed2_pstruct
    method: dpo
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # No postfix rerun in scope for seed2; original headline checkpoint
    # (docs/checkpoint-staging.md: eh-qwen3-4b-headline-dpo-seed2-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed2/20260615_114512/final_model
  - name: cold_dpo_seed3_pstruct
    method: dpo
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # No postfix rerun in scope for seed3; original headline checkpoint
    # (docs/checkpoint-staging.md: eh-qwen3-4b-headline-dpo-seed3-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed3/20260615_130441/final_model
  - name: cold_kto_seed1_pstruct
    method: kto
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # Cell of record: postfix-rerun KTO compliant relaunch (headline-seed1-postfix-rerun).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed1_postfix/20260807_124416/final_model
  - name: cold_kto_seed2_pstruct
    method: kto
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # No postfix rerun in scope for seed2; original headline checkpoint
    # (docs/checkpoint-staging.md: eh-qwen3-4b-headline-kto-seed2-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed2/20260615_142046_logging_patch/final_model
  - name: cold_kto_seed3_pstruct
    method: kto
    model: qwen3-4b-instruct-heldout-cold-pstruct
    # No postfix rerun in scope for seed3; original headline checkpoint
    # (docs/checkpoint-staging.md: eh-qwen3-4b-headline-kto-seed3-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed3/20260615_204215_logging_patch/final_model

eval_sets:
  ambigqa:
    type: ood
    path: ../../../../experiments/ood-breadth-beyond-selfaware/analysis/screen/ambigqa_validation_screened.jsonl
    label_from_target: false
