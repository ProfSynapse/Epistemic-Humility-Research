  # scope = DPO/KTO seed1 only); seeds 2-3 have no postfix rerun in scope, so they
  # use the original headline checkpoints unchanged (docs/checkpoint-staging.md).
  cold_dpo_seed2: synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed2/20260615_114512/final_model
  cold_dpo_seed3: synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed3/20260615_130441/final_model
