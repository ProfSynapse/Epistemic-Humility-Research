# ---------------------------------------------------------------------------
# Secondary descriptive arms (KUQ + BIG-bench known-unknowns; no gates read
# these, reported straight per AMENDMENT.md).
#
# AMBIGUITY FLAGGED FOR THE LEAD (see AMENDMENT.md "run on the base arms and
# cold SFT seed 1 only"; report also flags this): the AMENDMENT's own budget
# note reads "~5.6k" secondary generations. (rows_kuq + rows_bigbench) x
# n_arms only lands near that figure at n_arms = 1 (5540 + 46 = 5586); the
# most literal grammatical reading of "the base arms [plural] and cold SFT
# seed 1" names 4 arms (base_prc, base_pplain, base_pstruct, cold_sft_seed1)
# for 22344 generations, a ~4x mismatch, or 2 arms (base_pstruct +
# cold_sft_seed1, since P-struct is the only prompt contract C2/C3 need and
# the only one already carrying a "base" row beyond the P-rc/P-plain pair
# that exists solely for the AmbigQA-only C1 claim) for 11172, a ~2x
# mismatch. Built here as the 2-arm P-struct-only reading (closest to the
# "descriptive... to bound cost" framing and the only reading under which
# every secondary arm shares the claim the secondary surfaces exist to
# sanity-check). NOT adjudicated by this build; confirm before signing.
# ---------------------------------------------------------------------------
arms_secondary:
  - {name: base_pstruct,           checkpoint: base, adapter: null,             prompt: P_struct}
  - {name: cold_sft_seed1_pstruct, checkpoint: base, adapter: cold_sft_seed1,   prompt: P_struct}

secondary_rows_per_arm: 5586   # 5540 (KUQ) + 46 (BIG-bench)
secondary_generations_total: 11172   # 5586 x 2 arms, under the built (2-arm) reading

# ---------------------------------------------------------------------------
# Config granularity: one config per (prompt contract, base checkpoint)
# group, matching prompt-crossing-completion's precedent (run_eval.py's
# VLLMGenerator enforces one base model per config -- see that cell's
# configs/eval_crossing_seq_pstruct_seed1_local_4b.yaml header, quoting
# archive/experiment/phase1/eval/run_eval.py lines 256-272). 7 primary
# configs (covers all 20 arms) + 1 secondary config (2 arms x 2 surfaces).
# ---------------------------------------------------------------------------
configs:
  granularity: prompt_x_base_checkpoint_groups
  primary:
    - {file: configs/eval_heldout_base_prc_local_4b.yaml,        arms: [base_prc]}
    - {file: configs/eval_heldout_base_pplain_local_4b.yaml,     arms: [base_pplain]}
    - {file: configs/eval_heldout_cold_pstruct_local_4b.yaml,    arms: [base_pstruct, cold_sft_seed1_pstruct, cold_sft_seed2_pstruct, cold_sft_seed3_pstruct, cold_dpo_seed1_pstruct, cold_dpo_seed2_pstruct, cold_dpo_seed3_pstruct, cold_kto_seed1_pstruct, cold_kto_seed2_pstruct, cold_kto_seed3_pstruct]}
    - {file: configs/eval_heldout_warmed_pstruct_local_4b.yaml,  arms: [clean_sft_merged_pstruct, sft_grpo_seed1_pstruct]}
    - {file: configs/eval_heldout_seq_pstruct_seed1_local_4b.yaml, arms: [seq_sft_dpo_seed1_pstruct, seq_sft_kto_seed1_pstruct]}
    - {file: configs/eval_heldout_seq_pstruct_seed2_local_4b.yaml, arms: [seq_sft_dpo_seed2_pstruct, seq_sft_kto_seed2_pstruct]}
    - {file: configs/eval_heldout_seq_pstruct_seed3_local_4b.yaml, arms: [seq_sft_dpo_seed3_pstruct, seq_sft_kto_seed3_pstruct]}
  secondary:
    - {file: configs/eval_heldout_secondary_pstruct_local_4b.yaml, arms: [base_pstruct, cold_sft_seed1_pstruct], eval_sets: [kuq, bigbench_known_unknowns]}

# ---------------------------------------------------------------------------
# Run order (primary first, gate-relevant; secondary last, descriptive-only)
# ---------------------------------------------------------------------------
run_order:
  - {order: 1, config: configs/eval_heldout_base_prc_local_4b.yaml,
     arms: [base_prc], purpose: "C1 gate: base P-rc"}
  - {order: 2, config: configs/eval_heldout_base_pplain_local_4b.yaml,
     arms: [base_pplain], purpose: "C1 gate: base P-plain"}
  - {order: 3, config: configs/eval_heldout_cold_pstruct_local_4b.yaml,
     arms: [base_pstruct, cold_sft_seed1_pstruct, cold_sft_seed2_pstruct, cold_sft_seed3_pstruct,
            cold_dpo_seed1_pstruct, cold_dpo_seed2_pstruct, cold_dpo_seed3_pstruct,
            cold_kto_seed1_pstruct, cold_kto_seed2_pstruct, cold_kto_seed3_pstruct],
     purpose: "C1 base-pstruct row + C2 gate: cold SFT/DPO/KTO internalization"}
  - {order: 4, config: configs/eval_heldout_warmed_pstruct_local_4b.yaml,
     arms: [clean_sft_merged_pstruct, sft_grpo_seed1_pstruct],
     purpose: "warmed-stack P-struct anchors (descriptive; not a C1/C2/C3 gate row)"}
  - {order: 5, config: configs/eval_heldout_seq_pstruct_seed1_local_4b.yaml,
     arms: [seq_sft_dpo_seed1_pstruct, seq_sft_kto_seed1_pstruct], purpose: "C3 gate: seed1"}
  - {order: 6, config: configs/eval_heldout_seq_pstruct_seed2_local_4b.yaml,
     arms: [seq_sft_dpo_seed2_pstruct, seq_sft_kto_seed2_pstruct], purpose: "C3 gate: seed2"}
  - {order: 7, config: configs/eval_heldout_seq_pstruct_seed3_local_4b.yaml,
     arms: [seq_sft_dpo_seed3_pstruct, seq_sft_kto_seed3_pstruct], purpose: "C3 gate: seed3"}
  - {order: 8, config: configs/eval_heldout_secondary_pstruct_local_4b.yaml,
     arms: [base_pstruct, cold_sft_seed1_pstruct], purpose: "secondary descriptive, KUQ + BIG-bench, no gate"}

budget_gpu_hours: {low: 11, high: 14, basis: "AMENDMENT.md Budget section; comparable total generation volume to prompt-crossing-completion (37k, ~10.5h wall)"}
