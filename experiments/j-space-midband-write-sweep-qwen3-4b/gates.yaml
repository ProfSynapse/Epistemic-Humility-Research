# J-space mid-band write sweep gates. DRAFT until `bin/exp sign`.

seed: 20260707
alpha: 0.05

gates:
  - name: g0_instrument_validity
    interpretation: stop_before_outcome
    checks:
      - id: row_text_materialized_locally
        pass_if: analysis/rows_with_text.jsonl exists locally and has no missing questions or known-correct aliases
      - id: layer_extract_complete
        pass_if: layer_sweep_anchor_extract.safetensors contains hs23/hs26/hs29/hs34 tensors for all predecessor split rows plus unknown_refused
      - id: gate_auc_per_layer
        pass_if: "FIT AUC for neg_z_d >= 0.90 at every tested layer"
      - id: directions_reproducible
        pass_if: byte-identical refit check passes for u_d/pos_ctrl/neg_ctrl/c_hat at every layer
      - id: smoke_write_readback
        pass_if: "all dosed smoke rows read back within 5% + 0.5 absolute of dose 200"
      - id: smoke_no_collapse
        pass_if: "collapse rate on dosed smoke rows is 0"

  - name: g1_midband_improves_tighten
    primitive: layer_contrast
    midband_layers:
      - hs23
      - hs26
      - hs29
    late_reference: hs34
    metric: confab_tighten.clean_tighten_rate
    pass_if: "best mid-band rate - hs34 rate >= 0.10"

  - name: g2_no_selectivity_regression
    primitive: layer_contrast
    midband_layers:
      - hs23
      - hs26
      - hs29
    late_reference: hs34
    metric: known_correct_cost_control.not_well_formed_correct_rate
    pass_if: "best mid-band cost - hs34 cost <= 0.02"

  - name: g3_predecessor_reference_still_viable
    primitive: rate_over_population
    layer: hs34
    population: confab_tighten
    indicator: clean_tighten
    pass_if_rate: ">= 0.60"
    pass_if_wilson_lower_ci: "> 0.50"

summary_rule: >-
  The J-space layer-site hypothesis passes only if G0, G1, G2, and G3 all pass.
  If G3 fails, the run is a replication failure of the predecessor reference,
  not interpretable as evidence about mid-band superiority.
