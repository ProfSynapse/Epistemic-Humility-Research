  reading. Grounds; the more-trained panel checkpoint reads slightly higher than the
  less-trained one (0.6349 vs 0.6279), the wrong direction for a training-dulls-it
  account, and Amendment Y H_B3 found post-training does not sharpen the SelfAware
  readout.
falsifier: heldout_probe_auroc >= 0.85 on the raw base, which establishes the training-warp
  reading; pretraining installed a substantially more general answerability signal
  and post-training narrowed it. The open interval (0.73, 0.85) is registered AMBIGUOUS
  and reported as such.
