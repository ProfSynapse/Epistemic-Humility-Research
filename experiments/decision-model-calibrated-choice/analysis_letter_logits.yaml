# Engine analysis config, DESCRIPTIVE secondary arm: letter-logit decision model.
# Identical to analysis_pointer.yaml except the run_id paths. Never adjudicates
# a gate (AMENDMENT "Arms"). Schema and staging as in analysis_pointer.yaml.

checkpoint: scratch/eh_staging/dmcc-letter-logits-popqa/final_model

data:
  files: [scratch/eh_staging/dmcc-letter-logits-popqa/decision_rows_primary.jsonl]
  max_rows: null
  fit_fraction: 0.4
  cal_fraction: 0.2
  seed: 0

ablation:
  enabled: false

capture:
  layers: all
  batch_size: 8
  max_length: null

probe:
  n_components: 128
  n_splits: 5
  C: 1.0
  max_iter: 2000
  permuted_control: true

conformal:
  alphas: [0.1, 0.2]
  min_rows_per_kind: 50

thresholds:
  confident: 0.8
  underconfident: 0.5
  ece_bins: 15

bootstrap:
  n_boot: 2000
  seed: 0

output:
  output_root: scratch/eh_staging/dmcc-letter-logits-popqa/output

export:
  states: false           # H-D1 is scored by the engine's directions block; raw states not needed
  layers: null
  per_row: true           # probs_r0/probs_r1, dial_score, stack_score, ku_probe_score, direction_scores

# Stage 0 frozen base-model directions (mechinterp-direction/v1), copied into
# the staging dir by dmcc_harness.py stage-engine after their sha256 is checked
# against analysis-committed/stage0_freeze.json. layer omitted = the layer frozen
# in each JSON (the Stage 0 FIT best layer); the engine scores
# h @ coef + intercept at that hidden-state index of the decision model's
# <answer> state (0 = embeddings, i = output of decoder block i; same index
# convention as MechInterp extraction, verified pre-sign, NOTEBOOK).
directions:
  - name: base_gate             # H-D1
    path: scratch/eh_staging/dmcc-letter-logits-popqa/directions/direction_gate.json
  - name: base_gate_permuted    # H-D1 control (descriptive)
    path: scratch/eh_staging/dmcc-letter-logits-popqa/directions/direction_gate_permuted.json
  - name: base_dial             # descriptive
    path: scratch/eh_staging/dmcc-letter-logits-popqa/directions/direction_dial.json
