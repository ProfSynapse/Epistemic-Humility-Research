# Knowledge-probe config for decision-model-calibrated-choice.
#
# Consumed by: experiments/common/knowledge_probe/probe.py (EH's canonical
#              known/unknown instrument, with two OPT-IN options added
#              2026-10-04/05 whose defaults leave every other cell unchanged).
# Derived from: experiments/common/configs/knowledge-probe/probe.yaml.
#   Verbatim from that file: sampling, prompt.system, labels, sensitivity, runtime.
#   Changed for this cell, and only these: model (the decision torso's base
#   model), probe_pool (PopQA instead of TriviaQA, no cap), output (this cell's
#   gitignored analysis dir), prompt.surface: base_kshot (Amendment Y rule) and
#   scoring.generated_thinking_policy: count_wrong (safety net).
#
# model.model_name is the HF id here. probe.py's VLLMBackend cannot take a
# revision, so dmcc_harness.py `stage-model` downloads the pinned snapshot and
# writes a MATERIALIZED copy of this file whose model.model_name is that
# snapshot directory (asserted to be named model_revision). probe.py ignores
# model_revision; it is recorded so the probe_config_sha covers the pin.

model:
  model_tag: qwen35-2b-base-popqa
  model_name: Qwen/Qwen3.5-2B-Base
  model_revision: b1485b2fa6dfa1287294f269f5fb618e03d52d7c
  # Must stay false under prompt.surface base_kshot (no chat template is used).
  enable_thinking: false

sampling:
  n_samples: 32
  temperature: 1.0
  top_p: 0.9
  max_new_tokens: 64
  seed: 20260610

prompt:
  # Kept verbatim from the common config; NOT used under surface base_kshot
  # (no system prompt on the base-mode surface).
  system: "You are a helpful assistant. Answer the question concisely. If you do not know the answer, say so."
  # Amendment Y's pre-stated surface for pretrain-only base models (PI decision
  # 2026-10-04, before any PopQA labeling or outcome; AMENDMENT checklist 10):
  # fixed 5-shot "Q: ...\nA: ..." block, no chat template, answer = first line,
  # generation stops at the first newline. Vendored byte-identical from
  # experiments/common/readouts/amendment_x_cross_model_extract.py.
  surface: base_kshot

probe_pool:
  # Written by dmcc_harness.py `build-pool` from PopQA test.tsv @ 098765c7:
  # question, question_id (popqa-<id>), answer.normalized_aliases (EH
  # scoring.normalize_answer over possible_answers), answer.value (obj).
  train_jsonl: experiments/decision-model-calibrated-choice/analysis/popqa/probe_pool.jsonl
  fallback_validation_remainder: null
  question_id_prefix: popqa-
  max_questions: null
  subset_seed: 20260610

scoring:
  # Generated-thinking policy (EH probe, opt-in; default "abort"). PI decision
  # 2026-10-04, before any PopQA labeling or outcome: a T=1.0 sample from the
  # base model can contain '</think>' even with thinking off (pre-sign timing
  # run aborted on synthetic prompts); such a generation is scored INCORRECT
  # and counted (rows: n_sampled_thinking_marker / greedy_thinking_marker;
  # manifest: generated_thinking). Sanity bound and sensitivity analysis:
  # gates.yaml g0_label_marker_bound, AMENDMENT "Labels".
  generated_thinking_policy: count_wrong

labels:
  # EH protocol bands: known = greedy correct AND p_correct >= 0.5 (>= 16/32);
  # unknown = p_correct <= 0.0 (0/32); everything else = discard (ambiguous).
  known_p_correct_min: 0.5
  unknown_p_correct_max: 0.0

sensitivity:
  enabled: true
  unknown_cutoffs: [0.0, 0.03125, 0.0625, 0.1]
  known_cutoffs: [0.5, 0.7, 0.9]
  max_questions: null
  subsample_seed: 20260610

output:
  root: experiments/decision-model-calibrated-choice/analysis/knowledge_probe
  results_filename: probe_results.jsonl
  manifest_filename: probe_manifest.json
  sensitivity_filename: sensitivity_grid.json

runtime:
  backend: vllm
  vllm:
    dtype: auto
    gpu_memory_utilization: 0.90
    max_model_len: 2048
