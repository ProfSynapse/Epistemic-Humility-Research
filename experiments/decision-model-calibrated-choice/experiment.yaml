slug: decision-model-calibrated-choice
title: 'Decision-model calibrated choice: does a never-refusing readout track what
  the base torso knows?'
type: eval
status: signed
registered: true
created_at: '2026-10-04T19:37:48Z'
tier: 2
posture: exploratory
question: Does a trained decision model (Qwen3.5-2B-Base torso, LoRA + pointer head),
  which always chooses and reports a temperature-calibrated distribution over options,
  give confidence on PopQA that tracks its base torso's prior known/unknown label
  (EH knowledge-probe protocol) without refusing, and does the base model's frozen
  known-unknown gate direction still read known vs unknown in the decision model's
  <answer> state?
prediction: 'On TEST, with Stage 0 valid (frozen base gate direction CAL AUROC >=
  0.80, permuted twin in [0.40, 0.60]): H-A unknown-row confidence-over-chance <=
  0.10 and confident-wrong <= 5%; H-B known-row underconfident-right <= 10%; H-C AUROC(calibrated
  max-p -> known) >= 0.75; H-D1 the frozen base gate direction on decision <answer>
  states reads known vs unknown at AUROC >= 0.75; H-D2 a fresh KU probe on <answer>
  states beats the readout by >= 0.03 AUROC with the paired-bootstrap CI excluding
  0.'
falsifier: The readout-tracks-knowledge line is falsified if H-C FAILS (95% CI upper
  bound of AUROC(R1 -> known) < 0.75) or H-A FAILS (gap CI lower bound > 0.10, or
  confident-wrong Wilson lower bound > 0.05 on unknowns); the residual-signal prediction
  is falsified if H-D2 FAILS (paired CI upper bound < +0.03); base-axis transfer is
  falsified if H-D1 FAILS (CI upper bound < 0.75) with Stage 0 valid. A CI that contains
  its threshold is INCONCLUSIVE.
