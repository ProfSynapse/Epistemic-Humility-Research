# Engine analysis config, primary arm: pointer decision model on PopQA rows.
#
# Schema: synaptic-tuner Trainers/decision/decision_core/confidence_analysis.py
#         (ConfidenceAnalysisConfig) at engine commit 29f7af0c; reference
#         configs Trainers/decision/configs/experiments/confidence_analysis_*.yaml.
# Consumed by: synaptic-tuner Trainers/decision/analyze_confidence.py, inside
#              the container launched by recipe_pointer.yaml.
# Staged by:   dmcc_harness.py `stage-engine` to the tuner's gitignored
#              scratch/eh_staging/dmcc-pointer-popqa/ (paths below are
#              tuner-repo-relative, as the engine resolves them).

checkpoint: scratch/eh_staging/dmcc-pointer-popqa/final_model

data:
  # 4-way PopQA choice rows, known + unknown only (ambiguous excluded).
  files: [scratch/eh_staging/dmcc-pointer-popqa/decision_rows_primary.jsonl]
  max_rows: null          # every row
  fit_fraction: 0.4       # FIT: probes (P-dial, KU probe) fit here
  cal_fraction: 0.2       # CAL: temperatures, conformal q-hat, stacker
  seed: 0                 # TEST = remaining 40%, stratified by task = popqa:<relation>

ablation:
  enabled: false          # the prior known/unknown label replaces state ablation here

capture:
  layers: all             # hidden-state indices (0 = embeddings) at <answer>
  batch_size: 8
  max_length: null

probe:                    # MechInterp.probe.fit: PCA -> logistic, out-of-fold AUROC, layer sweep on FIT
  n_components: 128
  n_splits: 5
  C: 1.0
  max_iter: 2000
  permuted_control: true  # label-permuted probe at the selected layer

conformal:
  alphas: [0.1, 0.2]
  min_rows_per_kind: 50

thresholds:
  confident: 0.8          # confident-wrong = wrong with calibrated max-p >= 0.8
  underconfident: 0.5     # underconfident-right = right with calibrated max-p < 0.5
  ece_bins: 15

bootstrap:
  n_boot: 2000            # paired bootstrap for H-D (ku_probe_minus_readout)
  seed: 0

output:
  output_root: scratch/eh_staging/dmcc-pointer-popqa/output

export:
  states: false           # H-D1 is scored by the engine's directions block; raw states not needed
  layers: null
  per_row: true           # probs_r0/probs_r1, dial_score, stack_score, ku_probe_score, direction_scores

# Stage 0 frozen base-model directions (mechinterp-direction/v1), copied into
# the staging dir by dmcc_harness.py stage-engine after their sha256 is checked
# against analysis-committed/stage0_freeze.json. layer omitted = the layer frozen
# in each JSON (the Stage 0 FIT best layer); the engine scores
# h @ coef + intercept at that hidden-state index of the decision model's
# <answer> state (0 = embeddings, i = output of decoder block i; same index
# convention as MechInterp extraction, verified pre-sign, NOTEBOOK).
directions:
  - name: base_gate             # H-D1
    path: scratch/eh_staging/dmcc-pointer-popqa/directions/direction_gate.json
  - name: base_gate_permuted    # H-D1 control (descriptive)
    path: scratch/eh_staging/dmcc-pointer-popqa/directions/direction_gate_permuted.json
  - name: base_dial             # descriptive
    path: scratch/eh_staging/dmcc-pointer-popqa/directions/direction_dial.json
