# Full SelfAware eval for the headline seed-1 post-fix DPO/KTO rerun.
# Modeled structurally on .tmp/eval_selfaware_full_seed1_all_arms_4b.yaml (the
# disposable, gitignored config that produced the locked seed-1/2/3 headline
# rows) but scoped to only the two rerun arms. Pinned here so the measurement
# surface for this rerun is committed rather than living in .tmp/ again. See
# AMENDMENT.md section 10, item 1 (RESOLVED 2026-08-01) and cell.yaml "eval".
#
# Adapter paths below are PLACEHOLDERS. Neither rerun adapter exists yet; fill
# both `adapter:` values with the real final_model paths after training
# completes and before this config is used to launch eval. Do not launch eval
# with placeholder paths still in place.

model_tag: qwen3-4b-instruct
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_selfaware_full_seed1_postfix_rerun_4b

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 64
  n_samples: 1

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.35
  max_lora_rank: 32
  max_model_len: 2048

arms:
  # Arm-scoping history (pre-stated rulings, see NOTEBOOK):
  # - dpo_seed1_postfix arm REMOVED 2026-08-07 ~12:05Z: its eval completed
  #   under config_sha 876842ce; rerunning would nondeterministically
  #   regenerate finished results (silent-substitution hazard). That result
  #   is now the DEVIATED attempt's record (retroactive G0 setup.pip
  #   finding, ~12:55Z entry), preserved untouched.
  # - kto_seed1_postfix arm REMOVED 2026-08-07 ~19:45Z: its eval completed
  #   under config_sha 52e78ef1, cell closed (~19:15Z entry). Same hazard.
  # - dpo_seed1_postfix_r2 is the PI-approved recipe-honoring DPO retrain
  #   (cell of record, ~18:35Z rules): distinct arm name so results land in
  #   a NEW subdirectory, preserving the deviated attempt's directory.
  - name: dpo_seed1_postfix_r2
    method: dpo
    model: qwen3-4b-instruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed1_postfix/20260807_192026/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
