    reason: 'Fixed a real bug found via a small dry-run smoke test on the
      partial (in-progress) generation output before trusting the module for
      the final build: `dose_ladder.load_baseline_wide_by_key` sets each
      baseline row''s `role` from the baseline file''s own `role` field, which
      does not exist in `baseline_graded_private.jsonl` (that file only carries
      a DIFFERENT pre-fit `role_candidate` label in
      {"answerable","unanswerable"}) -- so `role` was always None and every
      baseline row was silently dropped from TRACKED_ROLES filtering (dry run
      showed n_rows_by_arm.baseline=0 against an expected ~2000+). This is
      benign inside dose_ladder.py itself (its own baseline lookups match by
      row_key against already role-filtered FIT row lists and never read the
      `role` field back), but this module needs the real role to decide
      TRACKED_ROLES membership and clear_negative eligibility for baseline
      rows, so it now joins baseline rows against
      `analysis/<family>/joined_rows_private.jsonl` (materialize_rows.py''s
      row_key -> role map) by row_key instead of trusting the baseline dict''s
      role field. Re-ran the dry run after the fix: n_rows_by_arm.baseline
      rose from 0 to 2009 (confab + known_correct_answered), matching
      expectation. No change to gated/random_direction handling, which already
      read role correctly from the RunLog rows themselves. No gate, floor, or
      falsifier threshold touched; this is a new module, not a repin of a
      pinned rr/calibration file.'
