    reason: 'New module added by the harness-build assignment (task step 3: build
      the blinded adjudication pool over detector-negative rows). Adapted from
      abstention-wide-instrument-calibration/build_adjudication_pool.py for this
      cell''s single-family/single-cell design (no multi-cell loop): core = every
      row from any arm (gated at every rung, random_direction at the two registered
      rungs, and the reused baseline arm) restricted to the two tracked roles
      (confab, known_correct_answered) that detector_v2 screens as NOT refused;
      decoys carved out disjointly -- clear_negative from well_formed_correct
      known_correct_answered rows (any arm), clear_positive from random_direction
      rows detector_v2 DOES mark refused. Per the explicit CG1 lesson cited in
      AMENDMENT.md/gates.yaml (the calibration cell''s 14-decoy draw voided a QL
      cell), this module sizes shard count off clear_positive availability first
      (MIN_CLEAR_POSITIVE_PER_SHARD_TARGET=20 per shard, i.e. >14) rather than off
      core size, via cap_shards_by_decoy_availability, and reports the resulting
      per-shard decoy counts in the committed manifest so any shortfall is visible.
      Mechanics (salted opaque ids via sha256, seeded shuffle, round-robin sharding)
      ported from the calibration cell''s build_adjudication_pool.py. Per-row text
      lives only in gitignored analysis/shards/; the committed
      analysis-committed/adjudication_pool_manifest.json is ID-only (opaque ids,
      counts, salt hash), no question/answer/generation text, per this experiment''s
      containment rule. This script BUILDS the pool only; it does not grade
      anything -- the lead orchestrates the CG1-gated blinded grading lane
      separately. Added post-sign with pin recorded here because exp repin
      repairs existing pins only (same precedent as detector_v2.py above).'
  - file: build_adjudication_pool.py
    old_sha256: baac3b49034c01658110e32887fa3ce9dd09d4ab194aac8fe8163cff5d7485a2
    new_sha256: 8e6818d5a2b98c10a2cfaf1592b22f08bf411f5c80a3d976a52ba931b716eb70
