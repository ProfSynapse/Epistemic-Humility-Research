  does refitting in-contract recover the separation?'
prediction: 'Contract-invariant: for every checkpoint-contract pair (base, clean-SFT
  seed 1, SFT->GRPO-v2 seed 1; P-rc, P-plain, P-struct), transfer AUROC drops <= 0.05
