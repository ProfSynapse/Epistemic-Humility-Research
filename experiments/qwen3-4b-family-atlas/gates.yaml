# Pre-stated gates for qwen3-4b-family-atlas, transcribed verbatim from
# AMENDMENT.md "## Gates". Do not add, drop, or retune a threshold here
# without a signed amendment revision. Identical thresholds and structure to
# jspace-family-atlas (same program-standard floors) -- NOT gemma-4-e4b-
# family-atlas's shape: this cell reuses an already-vetted pool for two of
# its three roles (see cell.yaml's KNOWN GAP note for the third), so no
# AG0a pool-mining-integrity gate is added. The unknown_refused row-key
# promotion this cell still needs is a data-completeness precondition, not
# a fresh-generation mining-integrity question (no GPU generation, no
# termination-rate check, no parity smoke needed to derive it), so it is
# recorded as a blocking precondition in AMENDMENT.md "Design" / "Row pool"
# rather than as a new gate.

AG0:
  name: integrity (pre-outcome)
  checks:
    - id: capture_coverage
      rule: "capture covers >= 95% of the cell's manifest rows at every layer"
      threshold: 0.95
      scope: per_cell_per_layer
    - id: direction_refit_determinism
      rule: "direction refits are byte-identical under the fixed seed"
      method: "fit twice from the same captured H under seed 20260707; compare byte-for-byte"
    - id: held_out_power_survives_attrition
      rule: >-
        held-out power carried over from the source pool (confab >= 150,
        known-correct >= 250 -- same program-standard floors as
        jspace-family-atlas and gemma-4-e4b-family-atlas) still holds after
        capture attrition
      thresholds:
        confab_held_out_minimum: 150
        known_correct_answered_held_out_minimum: 250

AG1:
  name: profile
  checks:
    - id: eff_dim_frac_every_layer
      rule: "eff_dim_frac profile is computed at every layer with the registered estimator"
      scope: "hs_index 0..36 inclusive"
    - id: profile_reproducibility
      rule: >-
        reproducibility re-run on a 20% row subsample keeps the peak layer
        within +/- 1 layer
      subsample_frac: 0.20
      tolerance_layers: 1

AG2:
  name: read panel
  checks:
    - id: per_layer_auroc_with_ci
      rule: >-
        per-layer held-out AUROCs reported with CIs for all three axes plus
        the standard random-direction control; no threshold gate on the
        values themselves beyond the prediction/falsifier
      axes: [doubt, caution, raw_refusal]
      ci_method: bootstrap
      bootstrap_resamples: 2000
      note: "AG2 itself has no pass/fail numeric threshold; the numbers are the atlas. Prediction/falsifier (AMENDMENT.md) are adjudicated separately at resolve, not by this gate."

# Prediction / falsifier restated for cross-reference only (source of truth
# remains AMENDMENT.md; do not edit here without a signed revision there).
# Authored by the lead 2026-07-20 (program-standard wording retained,
# extended per SKILL.md gotchas to explicitly name early-exterior and
# late-exterior peaks as outcomes).
prediction_restated: >-
  (Authored by the lead 2026-07-20, AMENDMENT.md is source of truth.)
  Qwen3-4B (raw-base, unsloth/Qwen3-4B at the pinned revision) shows an
  interior workspace band: a contiguous set of layers strictly inside
  (20%, 85%) depth where eff_dim_frac peaks AND all three read axes
  (doubt, caution, raw refusal) hold held-out AUROC >= 0.80, with the
  band's peak layer differing from the ported/resolved L34 write site
  (hs_index 34). Kept identical to the program default deliberately: this
  cell is the pre-registered fourth-family test of the decoupling pattern.
falsifier_restated: >-
  (Authored by the lead 2026-07-20, AMENDMENT.md is source of truth.)
  No interior eff_dim_frac peak exists
  (the profile is monotone to the last layer, OR the profile peaks in the
  outer 20% of depth on either end -- early-exterior, as jspace-family-atlas
  found for both llama and mistral and gemma-4-e4b-family-atlas found for
  gemma, or late-exterior), OR no layer inside (20%, 85%) depth reaches
  held-out AUROC >= 0.80 on all three axes simultaneously.
