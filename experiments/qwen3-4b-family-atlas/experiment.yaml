  containing that peak holds all three axes (doubt, caution, raw_refusal) at held-out
  AUROC >= 0.80. See AMENDMENT.md "Prediction" and "Predictions scoreboard" for the
  two pre-sign calls (orchestrator: early-exterior peak + J-lens dissociation sub-call;
  user: interior peak).'
falsifier: 'Fires if the profile peak lands in the outer 20% of depth on either end
  (early- or late-exterior, as in llama, mistral, and gemma), or if no layer inside
  (20%, 85%) depth reaches held-out AUROC >= 0.80 on all three axes simultaneously.
  See AMENDMENT.md "Falsifier" for the full registered wording.'
