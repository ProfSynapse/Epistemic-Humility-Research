# 3. law: fixed-strength erase_write at the pre-generation anchor onward,
#    edited on every decode step (AMENDMENT "Design": erase_write or additive
#    push at matched norms, position anchor_onward, generation_mode
#    gen_stream). erase_write is used here (not additive) so the commanded
#    projection is written exactly regardless of the row's current projection,
#    matching the AN-style setpoint convention this screen's dose ladder is
#    modeled on.
law:
  kind: erase_write
  readout: L34_succ_pc0   # DEFAULT; launch-time wrapper overrides per direction
  position: anchor_onward
  generation_mode: gen_stream

# 4. arms: baseline (strength 0) + a small ambient-relative dose ladder, every
#    row active (fixed strength, no score/flag selection -- the screen scores
#    the WHOLE unanswerable pool at each dose, per AMENDMENT "Design": "score
#    the behavioral flip rate ... on the pool").
#
#    AMBIENT-RELATIVE DOSING (AMENDMENT "Design -> Dose calibration"): erase_write
#    writes an absolute setpoint = strength * sigma, and the coherent
#    behavioral window scales with each direction's OWN ambient (un-intervened)
#    projection, not with a fixed absolute strength -- a single absolute ladder
#    over- or under-doses depending on a direction's scale (a free-3090
#    pre-flight showed the earlier absolute {1,2,4} ladder is entirely inert
#    for pos_ctrl_L34, which would have voided the screen). The dose1/dose2/
#    dose3 `strength` values below are therefore the K-MULTIPLIER (5, 7, 9 --
#    pre-flight-calibrated clean-flip range, median 7; see NOTEBOOK.md), NOT a
#    raw setpoint: run_screen.py's ambient-relative dose resolution measures
#    each direction's ambient_dir before materializing its config and
#    OVERWRITES this placeholder with strength = k * ambient_dir / sigma_dir
#    (run_screen.py::compute_ambient_relative_strengths /
#    resolve_ambient_strengths). Baseline's 0.0 is never overwritten. A
#    standalone parse of this file (e.g. `--dry-run`) sees these k-multiplier
#    placeholders, never the resolved per-direction setpoint.
#
#    ARM-NAMING CONVENTION (launch-time wrapper -- see run_screen.py /
#    NOTEBOOK.md): every direction's sub-run must land its rows in the SAME
#    execution.output_path (append + resume=true) with arm names PREFIXED by
#    the direction name, e.g. "L34_succ_pc0__baseline",
#    "L34_succ_pc0__dose3", "randctrl_L34_succ_pc0__dose3", so gates.yaml's
#    per-candidate kill_diff_vs_control gates can reference an exact
#    (candidate, random-control) arm-name pair from the ONE combined output
#    file the tuner's evaluator reads. The arm names below are the GENERIC
#    per-direction pattern (undecorated); the wrapper adds the prefix.
arms:
  - name: baseline
    strength: 0.0
  - name: dose1  # k=5; resolved to 5 * ambient_dir / sigma_dir at run time
    strength: 5.0
  - name: dose2  # k=7; resolved to 7 * ambient_dir / sigma_dir at run time
    strength: 7.0
  - name: dose3  # k=9; resolved to 9 * ambient_dir / sigma_dir at run time
    strength: 9.0

# 5. execution: per-row output JSONL (untracked; shared across every
#    direction's sub-run once the launch-time wrapper exists) + the project
#    grader.
execution:
  output_path: experiments/dark-actuator-screen/analysis/rows_out.jsonl
  resume: true
  # PYTHONPATH=experiments/common/graders:experiment/phase1/eval so the flat
  # module name resolves (dark_actuator_grader imports experiment/phase1/eval
  # scorers.py directly).
  grader: dark_actuator_grader:grade
  # Authorized-knob (execution only, not a gate/population/seed/law change):
  # batched generation, proven greedy-equivalent to batch-1 (PR #135). 12 is
  # the 4B-on-3090 value from the lead's launch brief.
  batch_size: 12

# 6. smoke: readback tolerances. gen_stream cells additionally get the
#   fail-closed decode-hook-firing guard (pinned tuner 294a653) before the
#   full arms run. That guard's own probe strength (tuner PR #138,
#   SmokeConfig.gen_stream_probe_strength, synaptic-tuner 56c7c6b) is left
#   UNSET here (None -> tuner's built-in 100.0 default) and OVERWRITTEN by
#   run_screen.py per direction at real-run time to GEN_STREAM_PROBE_L /
#   sigma_dir -- a fixed, over-driven absolute wiring-check setpoint, the same
#   for every direction regardless of ambient/sigma. This is NOT a dose (see
#   run_screen.py module docstring "GEN_STREAM FIRING PROBE"): a direction
#   expected to be behaviorally inert (most candidates, the random controls)
#   must still pass this check, since it only proves the decode hook is
#   wired, not that this direction moves behavior. `--dry-run` never performs
#   the GPU sweep this needs, so a standalone parse of this file always sees
#   the tuner's built-in 100.0 default here.
smoke:
  n_rows: 8
  write_rel_tol: 0.05
  write_abs_floor: 0.5
  offtarget_tol: 0.001
