# dark-actuator-screen -- Tier-2 exploratory dose SCREEN. DRAFT (not signed);
# do not launch as confirmatory evidence. See AMENDMENT.md for the full design.
#
# ONE STEER CELL PER SCREENED DIRECTION. The tuner's SteerCellConfig binds
# exactly one `law.readout` per run (synaptic-tuner MechInterp/config.py
# LawConfig.readout), so this file is the SHARED PATTERN every direction in
# `readouts:` below is run through, one direction at a time: a launch-time
# wrapper copies this recipe, overrides `law.readout` (and, to land every
# direction's rows in the ONE shared `execution.output_path` gates.yaml reads,
# prefixes each arm name with the direction name -- see the arm-naming
# convention note under `arms:`). That wrapper is NOT built yet; see
# NOTEBOOK.md "what remains before this screen can run".
#
# readouts: lists the full direction inventory this screen consumes (12 frozen
# dark-displacement candidates + 5 per-layer positive controls + 5 per-layer
# negative(propensity) controls + 12 paired random-direction controls -- see
# build_directions.py). `law.readout` below is a concrete, parseable DEFAULT
# (the strongest candidate by within-checkpoint consistency, per the census
# summary table) so this file is valid on its own; every other direction is
# reached by overriding `law.readout` at launch, never by editing this file
# per direction.
#
# Validate (CPU, no GPU):
#   cd synaptic-tuner && python -c "from MechInterp.config import load_steer_config; \
#     load_steer_config('../experiments/dark-actuator-screen/cell.yaml'); print('cell ok')"

# 1. surface: the AK Stage-1 raw-base unanswerable pool (confab/refuse rows).
#    rows_pool.jsonl is staged at launch time from
#    $HOME/ak_census_data/ak-stage1-raw-base-r1/data/rows.jsonl (gitignored;
#    never committed -- see build_directions.py prep_manifest.json for the
#    exact source path + sha). Same system prompt / greedy decode / model as
#    the AK Stage-1 raw-base capture (checkpoint_tag "raw-base",
#    unsloth/Qwen3-4B-bnb-4bit, no adapter).
surface:
  rows_path: experiments/dark-actuator-screen/analysis/rows_pool.jsonl
  seed: 20260706
  generation:
    max_new_tokens: 96
    do_sample: false
  # expected_config_sha is filled AFTER the first per-direction run and pinned
  # in the amendment doc at sign time (this experiment is still draft).
  # expected_config_sha: <sha256-of-this-file-at-signing>

# 2. readouts: full direction inventory (gitignored data under directions/,
#    generated by build_directions.py -- see prep_manifest.json for
#    provenance). Every vector here is unit-norm with sigma=1.0, so a
#    strength/gain value is a directly comparable, matched-norm dose across
#    every direction below.
readouts:
  # 12 frozen dark-displacement candidates (dark_displacement_census.py, PR #222).
  - name: L16_arel_pc7
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L16_arel_pc7.json
  - name: L20_arel_pc5
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L20_arel_pc5.json
  - name: L20_arel_pc8
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L20_arel_pc8.json
  - name: L20_succ_pc5
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L20_succ_pc5.json
  - name: L24_arel_pc5
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L24_arel_pc5.json
  - name: L24_arel_pc7
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L24_arel_pc7.json
  - name: L24_succ_pc4
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L24_succ_pc4.json
  - name: L28_arel_pc11
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L28_arel_pc11.json
  - name: L28_succ_pc0
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L28_succ_pc0.json
  - name: L28_succ_pc3
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L28_succ_pc3.json
  - name: L28_succ_pc4
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L28_succ_pc4.json
  - name: L34_succ_pc0
    path: experiments/dark-actuator-screen/directions/dark_cand_raw-base_L34_succ_pc0.json
  # Positive control: raw-base answer-vs-refuse mass-mean, per capture layer
  # (build_span lines 206-215, pre-QR "refuse" direction).
  - name: pos_ctrl_L16
    path: experiments/dark-actuator-screen/directions/pos_ctrl_L16.json
  - name: pos_ctrl_L20
    path: experiments/dark-actuator-screen/directions/pos_ctrl_L20.json
  - name: pos_ctrl_L24
    path: experiments/dark-actuator-screen/directions/pos_ctrl_L24.json
  - name: pos_ctrl_L28
    path: experiments/dark-actuator-screen/directions/pos_ctrl_L28.json
  - name: pos_ctrl_L34
    path: experiments/dark-actuator-screen/directions/pos_ctrl_L34.json
  # Negative control: raw-base confab-propensity, per capture layer
  # (build_span lines 206-215, pre-QR "propensity" direction; AL showed this
  # signal reads but does not actuate).
  - name: neg_ctrl_L16
    path: experiments/dark-actuator-screen/directions/neg_ctrl_L16.json
  - name: neg_ctrl_L20
    path: experiments/dark-actuator-screen/directions/neg_ctrl_L20.json
  - name: neg_ctrl_L24
    path: experiments/dark-actuator-screen/directions/neg_ctrl_L24.json
  - name: neg_ctrl_L28
    path: experiments/dark-actuator-screen/directions/neg_ctrl_L28.json
  - name: neg_ctrl_L34
    path: experiments/dark-actuator-screen/directions/neg_ctrl_L34.json
  # Random-direction controls: one seeded unit vector per candidate, at the
  # candidate's own layer/block (build_directions.py::build_random_controls).
  - name: randctrl_L16_arel_pc7
    path: experiments/dark-actuator-screen/directions/randctrl_L16_arel_pc7.json
  - name: randctrl_L20_arel_pc5
    path: experiments/dark-actuator-screen/directions/randctrl_L20_arel_pc5.json
  - name: randctrl_L20_arel_pc8
    path: experiments/dark-actuator-screen/directions/randctrl_L20_arel_pc8.json
  - name: randctrl_L20_succ_pc5
    path: experiments/dark-actuator-screen/directions/randctrl_L20_succ_pc5.json
  - name: randctrl_L24_arel_pc5
    path: experiments/dark-actuator-screen/directions/randctrl_L24_arel_pc5.json
  - name: randctrl_L24_arel_pc7
    path: experiments/dark-actuator-screen/directions/randctrl_L24_arel_pc7.json
  - name: randctrl_L24_succ_pc4
    path: experiments/dark-actuator-screen/directions/randctrl_L24_succ_pc4.json
  - name: randctrl_L28_arel_pc11
    path: experiments/dark-actuator-screen/directions/randctrl_L28_arel_pc11.json
  - name: randctrl_L28_succ_pc0
    path: experiments/dark-actuator-screen/directions/randctrl_L28_succ_pc0.json
  - name: randctrl_L28_succ_pc3
    path: experiments/dark-actuator-screen/directions/randctrl_L28_succ_pc3.json
  - name: randctrl_L28_succ_pc4
    path: experiments/dark-actuator-screen/directions/randctrl_L28_succ_pc4.json
  - name: randctrl_L34_succ_pc0
    path: experiments/dark-actuator-screen/directions/randctrl_L34_succ_pc0.json

# 3. law: fixed-strength erase_write at the pre-generation anchor onward,
#    edited on every decode step (AMENDMENT "Design": erase_write or additive
#    push at matched norms, position anchor_onward, generation_mode
#    gen_stream). erase_write is used here (not additive) so the commanded
#    projection is written exactly regardless of the row's current projection,
#    matching the AN-style setpoint convention this screen's dose ladder is
#    modeled on.
law:
  kind: erase_write
  readout: L34_succ_pc0   # DEFAULT; launch-time wrapper overrides per direction
  position: anchor_onward
  generation_mode: gen_stream

# 4. arms: baseline (strength 0) + a small fixed-strength dose ladder, every
#    row active (fixed strength, no score/flag selection -- the screen scores
#    the WHOLE unanswerable pool at each dose, per AMENDMENT "Design": "score
#    the behavioral flip rate ... on the pool").
#
#    ARM-NAMING CONVENTION (launch-time wrapper, not yet built -- see
#    NOTEBOOK.md): every direction's sub-run must land its rows in the SAME
#    execution.output_path (append + resume=true) with arm names PREFIXED by
#    the direction name, e.g. "L34_succ_pc0__baseline",
#    "L34_succ_pc0__dose3", "randctrl_L34_succ_pc0__dose3", so gates.yaml's
#    per-candidate kill_diff_vs_control gates can reference an exact
#    (candidate, random-control) arm-name pair from the ONE combined output
#    file the tuner's evaluator reads. The arm names below are the GENERIC
#    per-direction pattern (undecorated); the wrapper adds the prefix.
arms:
  - name: baseline
    strength: 0.0
  - name: dose1
    strength: 1.0
  - name: dose2
    strength: 2.0
  - name: dose3
    strength: 4.0

# 5. execution: per-row output JSONL (untracked; shared across every
#    direction's sub-run once the launch-time wrapper exists) + the project
#    grader.
execution:
  output_path: experiments/dark-actuator-screen/analysis/rows_out.jsonl
  resume: true
  # PYTHONPATH=experiments/common/graders:experiment/phase1/eval so the flat
  # module name resolves (dark_actuator_grader imports experiment/phase1/eval
  # scorers.py directly).
  grader: dark_actuator_grader:grade
  # Authorized-knob (execution only, not a gate/population/seed/law change):
  # batched generation, proven greedy-equivalent to batch-1 (PR #135). 12 is
  # the 4B-on-3090 value from the lead's launch brief.
  batch_size: 12

# 6. smoke: readback tolerances. gen_stream cells additionally get the
#   fail-closed decode-hook-firing guard (pinned tuner 294a653) before the
#   full arms run.
smoke:
  n_rows: 8
  write_rel_tol: 0.05
  write_abs_floor: 0.5
  offtarget_tol: 0.001
