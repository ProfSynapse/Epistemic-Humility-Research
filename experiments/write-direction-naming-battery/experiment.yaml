question: 'What is the mid-band hs20 c_hat write behaviorally, and which name does
  that behavior earn? Three axes decide it: whether the intermediate-dose output form
  is epistemically marked (hedged / non-answerability) or merely degraded; whether
  a negative dose releases natural over-refusal with answer-level specificity; and
  whether positive dosing on known-correct rows tracks retrieval difficulty or is
  difficulty-blind. The deliverable is a pre-stated, exhaustive outcome-to-name mapping
  table.'
prediction: 'Graded form, positive-only, difficulty-tracking, with the silent-wrongness
  override firing: naming table row 4 with the O-1 prefix, "answer-corrupting retrieval-suppression
  gradient". Neither "caution" nor an abstention-actuator name is earned.'
falsifier: 'Any assembled table row other than row 4, or override O-1 failing to fire.
  Named alternatives: axis G resolving BINARY (rows 5-8); axis B resolving BIDIRECTIONAL,
  which would earn the abstention-actuator name (rows 1, 2, 5, 6); axis K resolving
  KNOWLEDGE-STATE (rows 1, 3, 5, 7); known loss-of-correctness within a factor of
  3 of known abstention at the setpoint.'
