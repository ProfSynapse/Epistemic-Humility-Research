verdict: 'Under the structure-only contract the stated-confidence channel is not noise
  but is severely miscalibrated on every trained arm (ECE 0.55-0.85), discriminates
  near chance except in SFT-lineage sequential arms (best 0.72), and couples to refusal
  only where SFT is in the lineage: DPO/KTO barely refuse, and GRPO refuses at high
  stated confidence. P2 held; P1 and P3 did not; neither falsifier fired.'
