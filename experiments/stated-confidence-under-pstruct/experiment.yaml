question: Does the stated-confidence channel emitted under the structure-only prompt
  (P-struct) — captured across 20 arms of the prompt-crossing held-out confirmatory
  campaign but never analyzed (paper 2's recorded scope condition) — carry information
  about answer correctness and refusal behavior, or is it schema-compliance noise?
prediction: 'P1: confidence-correctness AUROC on answered rows in [0.55, 0.80] for
  at least two-thirds of trained P-struct arms. P2: 10-bin ECE >= 0.15 on at least
  half of trained arms. P3: refused rows carry lower median stated confidence than
  answered rows in at least two-thirds of trained arms.'
falsifier: 'F1: AUROC <= 0.55 on ALL trained P-struct arms (channel carries no correctness
  information under the structure-only contract). F2: refused rows carry HIGHER median
  confidence in a majority of trained arms.'
