# pstruct-internalization-seed-robustness: single config, six arms, all on the
# raw bnb-4bit base. P-struct prompt BYTE-IDENTICAL to the panel's
# (prompt-vs-training-panel configs); the seed-1 rows this cell extends were
# measured there. Cell-of-record checkpoints: headline matrix seeds 2/3
# (seed-1 postfix rerun did not touch seeds 2/3; KTO *_logging_patch dirs are
# the record per run_records/kto__4b__headline__seed{2,3}.json).

model_tag: qwen3-4b-instruct-seedrobust-pstruct
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_pstruct_internalization_seed_robustness_4b

prompt:
  system: >-
    Answer the user's question. Return only a JSON object with exactly two
    keys: "answer" and "response_confidence". The "answer" value is your
    answer. The "response_confidence" value is your probability from 0 to 1
    that your response is appropriate. Do not include markdown, code fences,
    reasoning, or any text outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: cold_sft_seed2_pstruct
    method: sft
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed2/20260615_090734/final_model
  - name: cold_sft_seed3_pstruct
    method: sft
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed3/20260615_104507/final_model
  - name: cold_dpo_seed2_pstruct
    method: dpo
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed2/20260615_114512/final_model
  - name: cold_dpo_seed3_pstruct
    method: dpo
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/dpo__4b__headline__seed3/20260615_130441/final_model
  - name: cold_kto_seed2_pstruct
    method: kto
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed2/20260615_142046_logging_patch/final_model
  - name: cold_kto_seed3_pstruct
    method: kto
    model: qwen3-4b-instruct-seedrobust-pstruct
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/kto__4b__headline__seed3/20260615_204215_logging_patch/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
