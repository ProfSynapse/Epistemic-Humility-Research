question: Where does raw-base Qwen3.5-4B's (Qwen/Qwen3.5-4B) workspace midband sit
  (eff_dim_frac profile over depth), and do the doubt, caution, and raw-refusal axes
  read there, supplying the family-atlas-standard layer map this substrate's own steer
  cells (qwen35-4b-midband-doubt-snap / -heldout, which established the hs20 write
  site behaviorally) never measured, and testing whether the eff_dim_frac peak decouples
  from both the interior read band AND the independently established interior write
  site?
prediction: 'Program-standard family-atlas prediction, kept deliberately (fifth-family
  test of the decoupling pattern): the eff_dim_frac profile peaks at an interior layer
  (inside 20%-85% of depth) and a contiguous band containing that peak holds all three
  axes (doubt, caution, raw_refusal) at held-out AUROC >= 0.80, with the peak layer
  differing from this substrate''s established mid-band write site hs20. See AMENDMENT.md
  "Prediction" and the DRAFT "Predictions scoreboard" (to be ratified by lead + user
  before sign).'
falsifier: Fires if the profile peak lands in the outer 20% of depth on either end
  (early- or late-exterior, as in llama, mistral, gemma, and qwen3-4b), or if no layer
  inside (20%, 85%) depth reaches held-out AUROC >= 0.80 on all three axes simultaneously.
  See AMENDMENT.md "Falsifier" for the full registered wording.
