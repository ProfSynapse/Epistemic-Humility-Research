# Pre-stated gates for qwen35-4b-family-atlas, transcribed verbatim from
# AMENDMENT.md "## Gates". DRAFT until `bin/exp sign`; do not add, drop, or
# retune a threshold here without a signed amendment revision. Identical
# thresholds and structure to qwen3-4b-family-atlas and jspace-family-atlas
# (same program-standard floors) -- NOT gemma-4-e4b-family-atlas's shape: this
# cell reuses an already-vetted pool for ALL THREE roles, so no AG0a
# pool-mining-integrity gate is added.
#
# The row-key material this cell needs is fully present in the source
# committed split_manifest (all three roles, ID-only); the only remaining
# capture-launch step is joining IDs to question text (a data-materialization
# precondition recorded in AMENDMENT.md "Design" -> "Row pool", not a
# fresh-generation mining-integrity question -- no GPU generation, no
# termination-rate check, no parity smoke -- so it is a blocking precondition,
# not a new gate).
#
# OPEN for the lead (see cell.yaml header NOTE and AMENDMENT.md): whether to
# add an explicit refused-pole held-out power floor to AG0 given
# unknown_refused is only 181 fit_only rows (-> ~90/91 after the deterministic
# refused split). Left OUT here to match the program-standard gate shape
# exactly; flagged for the lead to add before sign if desired.

AG0:
  name: integrity (pre-outcome)
  checks:
    - id: capture_coverage
      rule: "capture covers >= 95% of the cell's manifest rows at every layer"
      threshold: 0.95
      scope: per_cell_per_layer
    - id: direction_refit_determinism
      rule: "direction refits are byte-identical under the fixed seed"
      method: "fit twice from the same captured H under seed 20260707; compare byte-for-byte"
    - id: held_out_power_survives_attrition
      rule: >-
        held-out power carried over from the source pool (confab >= 150,
        known-correct >= 250 -- same program-standard floors as
        jspace-family-atlas, gemma-4-e4b-family-atlas, and
        qwen3-4b-family-atlas) still holds after capture attrition
      thresholds:
        confab_held_out_minimum: 150
        known_correct_answered_held_out_minimum: 250
    - id: loader_path_is_image_text_to_text
      rule: >-
        the capture log must show the tuner loaded this checkpoint via
        AutoModelForImageTextToText (Qwen3_5ForConditionalGeneration), NOT via
        the text-only AutoModelForCausalLM path. This substrate's nested
        Qwen3_5Config would otherwise be SILENTLY loaded as a flat text-only
        class with garbage weights (all keys missing/unexpected, no exception --
        the silent-substitution failure the tuner multimodal-loader-fallback fix
        prevents). A CausalLM path means the fix did not engage; the capture is
        contaminated and must be discarded and re-run.
      method: "grep the tuner capture log for the logged loader path; assert AutoModelForImageTextToText"
      requires_tuner_pin: "feature/multimodal-loader-fallback @ e0e02a3 (see cell.yaml capture.tuner_submodule_pin)"

AG1:
  name: profile
  checks:
    - id: eff_dim_frac_every_layer
      rule: "eff_dim_frac profile is computed at every layer with the registered estimator"
      scope: "hs_index 0..32 inclusive"
    - id: profile_reproducibility
      rule: >-
        reproducibility re-run on a 20% row subsample keeps the peak layer
        within +/- 1 layer
      subsample_frac: 0.20
      tolerance_layers: 1

AG2:
  name: read panel
  checks:
    - id: per_layer_auroc_with_ci
      rule: >-
        per-layer held-out AUROCs reported with CIs for all three axes plus
        the standard random-direction control; no threshold gate on the
        values themselves beyond the prediction/falsifier
      axes: [doubt, caution, raw_refusal]
      ci_method: bootstrap
      bootstrap_resamples: 2000
      note: "AG2 itself has no pass/fail numeric threshold; the numbers are the atlas. Prediction/falsifier (AMENDMENT.md) are adjudicated separately at resolve, not by this gate."

