# Frozen detector-v2 pattern config for rr2-mistral-adjudicated-refusal-confirm.
# Pinned at sign (hashed in experiment.yaml instrument.pins).
#
# CONTAINMENT (binding, .skills/data-exhaust + this experiment's cell.yaml):
# this file holds ONLY short, generic abstention idiom STEMS. It must NEVER
# contain question text, answer values, aliases, category text, or any full
# generation text. Every stem below was validated at build time either as a
# generic idiom stem (no source text) or via a mined-idiom count check run
# against RR's private mistral runlog (not committed; see NOTEBOOK.md) --
# the count is recorded per stem group below for provenance, never the text.
#
# Matching contract (detector_v2.py): `canonical` entries are RR's locked
# 3-phrase detector (grader.py._STATED_CONFIDENCE_REFUSAL_PATTERNS), reused
# verbatim as compiled regex so refused_v2 >= refused_v1 always (detector_v2
# is canonical OR diverse_idioms, never a subset). `diverse_idioms` entries
# are matched as a lowercase substring after apostrophe normalization
# (curly quotes folded to straight), applied identically to both the
# fired-confab (benefit) and known-correct (cost) populations -- the same
# deterministic function, no population-conditional logic anywhere.

version: 1
canonical:
- id: canonical_i_do_not_know
  note: grader.py _STATED_CONFIDENCE_REFUSAL_PATTERNS[0], reused verbatim (regex,
