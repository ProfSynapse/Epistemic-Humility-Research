  do the measured margin distributions retrodict the three anchor results (factorial,
  doubt-snap, H4 overdrive) from their doses alone?
prediction: Median known margin exceeds median confab margin by at least the separation
  floor in both families, the family setpoint lies between the two medians, the margin
  CDFs retrodict the factorial and doubt-snap arm rates within tolerance, and the
  ladder top exhibits the collapse regime that explains H4's overdrive non-selectivity.
falsifier: Median margin ratio below the separation floor or its bootstrap 95% CI
  includes 1.0 (Claim 1 falsified); or the setpoint does not sit between the medians
  in either family (Claim 2 falsified); or retrodicted anchor rates miss by more than
  the registered tolerance; or the non-monotone fraction exceeds its ceiling or the
  detector-vs-adjudication calibration gate fails (instrument void, reported straight).
  Thresholds resolve at sign in the Decision record and never move after results.
