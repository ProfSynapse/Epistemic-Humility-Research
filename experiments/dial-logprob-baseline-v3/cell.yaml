# dial-logprob-baseline-v3 (LP v3) instrument config, pinned at build.
# Fresh self-consistent generation cell: no cached rows.jsonl, no reproduction
# bet against v1/v2's artifacts. Populations, arms (checkpoints, dial layers),
# logprob variant definitions, and the paired-bootstrap statistic transfer
# verbatim from v1/v2 (experiments/dial-logprob-baseline-v2/cell.yaml); only
# the generation/extraction machinery is new (AMENDMENT.md "Design").
apiVersion: lab-cell/v1
experiment: dial-logprob-baseline-v3
seed: 20260813
n_boot_paired: 2000
engine:
  # Capability-check finding: NOTEBOOK.md 2026-08-13 "vLLM capability check".
  name: vllm
  version: 0.27.1                 # latest stable at build time; single pinned stack
  venv: /home/profsynapse/.venvs/vllm   # isolated venv; NOT the shared base conda env
  stack:
    torch: 2.13.0+cu130           # vLLM's own pin (distinct from base conda torch 2.9.0+cu128)
    transformers: 5.15.0
    safetensors: 0.8.0
    numpy: 2.3.5
    bitsandbytes: 0.50.0          # >=0.48.1 required by vllm's bnb quant path
    scikit-learn: 1.9.0           # CPU dial-refit runs in the SAME stack (AMENDMENT.md "Environment")
    peft: 0.20.0                  # HF+PEFT fallback extraction pass, same stack
  env_vars:
    # Discovered during build (NOTEBOOK.md); both required on this host.
    VLLM_WSL2_ENABLE_PIN_MEMORY: "1"   # WSL2 UVA/pinned-memory compat guard; without it engine init fails
    VLLM_BATCH_INVARIANT: "1"          # batch-invariant execution (docs.vllm.ai/features/batch_invariance)
  batch_invariance:
    enabled: true
    hardware_requirement: "compute capability >=8.0"
    hardware_confirmed: "RTX 3090, compute_cap 8.6 (nvidia-smi --query-gpu=compute_cap)"
  scheduler:
    # Proposed pins, NOT validated by the harness build (no vLLM generation
    # smoke over real S/T prompts was run -- registered as a pre-launch step
    # per .skills/experiment-runner/reference/batched-generation.md).
    max_model_len: 512
    max_num_seqs: 64
    max_num_batched_tokens: 8192
  hidden_state_path: fallback_hf_teacher_forced
  hidden_state_path_reason: >-
    Build verification (NOTEBOOK.md) found vLLM 0.27.1's only hidden-state
    mechanism (extract_hidden_states) is a speculative-decoding/EAGLE-training
    method requiring a draft model config + KV connector + file-based
    retrieval, not a per-request generation-time readout; the AMENDMENT's
    registered fallback applies. The teacher-forced HF pass runs in the same
    pinned stack/process, consuming vLLM's own reported prompt_token_ids +
    completion token_ids verbatim (never re-tokenized).
prompt_inventory:
  # Imported by reference, unchanged: build_pool() from
  # amendment_s_correctness_probe_extract.py. S and T draw from the IDENTICAL
  # pool (T's extractor imports build_pool from S's module unchanged, and both
  # default to the same seed/datasets/per_dataset -- verified by reading both
  # extractor modules).
  module: experiments/common/readouts/amendment_s_correctness_probe_extract.py
  datasets: [popqa, triviaqa]
  per_dataset: null
  pool_seed: 20260630              # verbatim: amendment_s/_t extractor default --seed
  target_correct: 500              # verbatim: amendment_s/_t extractor default
  target_wrong: 500                # verbatim: amendment_s/_t extractor default
  max_attempts: 4000                # verbatim: amendment_s/_t extractor default
generation:
  max_new_tokens: 48                # verbatim: amendment_s/_t extractor --max-new-tokens default
  do_sample: false                  # greedy
  temperature: 0.0
  enable_thinking: false            # pinned explicitly through render_probe_prompt's chat-template discovery
logprob_variants:
  primary: mean_answer_span         # length-normalized mean token logprob, verbatim from v1/v2
  secondary: [sum_answer_span, min_answer_span]   # descriptive only, verbatim from v1/v2
arms:
  - id: s_base_primary
    model:
      name: unsloth/Qwen3-4B-bnb-4bit    # verbatim from v1/v2; as-cached offline snapshot
      adapter: null
      quantization: bitsandbytes
    system_prompt_source: experiments/common/readouts/amendment_s_correctness_probe_extract.py:SYSTEM_PROMPT
    dial_layer: 20                    # S best post layer, verbatim from v1/v2
    gate: LP3-G1
  - id: t_deployed_descriptive
    model:
      name: scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
      adapter: scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model
      quantization: null
      lora: true
    system_prompt_source: experiments/common/readouts/amendment_t_correctness_readout_deployment_extract.py:SYSTEM_PROMPT
    dial_layer: 22                    # T best post layer, verbatim from v1/v2
    gate: descriptive-only
dial_refit:
  module: experiments/common/readouts/amendment_s_correctness_probe_score.py
  procedure: out-of-fold (oof_probe) on fresh hidden states; NO reproduction target (no external artifact to reproduce -- LP3-G0(d) is a sanity floor, not a match)
  instrument_sanity_auroc_min: 0.75   # S arm only, LP3-G0(d)
power_floor_n: 1000                   # LP3-G0(c), both arms
containment:
  commit: [id_manifest, aggregate_json, variant_table]
  never_commit: [question_text, answer_text, aliases, token_ids, per_row_scores, per_step_logprobs, hidden_state_tensors_raw]
lane: local-3090   # GPU launch requires explicit PI approval naming exact cells/lane; NOT authorized by this file; this build task ran NO arm
