r_draws: 30                      # stratified matched-n draws per scale
r_rand: 20                       # E3 random-slice comparison draws
r_sim: 30                        # G_val planted-signal replicates per (scale, rank)
planted_ranks: [1, 2, 4, 8, diffuse]
position: post_generation   # dial's native position (CD Method sec.1)
pre_gen_secondary: descriptive-only-not-built   # correct-vs-hallucination + pre-gen anchor deferred (packet sec.2)

