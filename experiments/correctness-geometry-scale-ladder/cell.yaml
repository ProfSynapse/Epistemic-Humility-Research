  never_commit: [question_text, answer_text, aliases, generations, token_ids, hidden_states, row-level real fit outputs]
  exhaust_staging:
    durable_dir: /home/profsynapse/code/ehr-exhaust/correctness-geometry-scale-ladder/
    rule: RunLogs + provenance staged before any worktree teardown

