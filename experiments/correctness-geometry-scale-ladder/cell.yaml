# correctness-geometry-scale-ladder instrument config, pinned at sign.
# Design source: scale_identifiability_design.md (subspace-designer,
# 2026-07-20), sections 1-11; LEAD ADJUDICATION section 12 is binding where
# it overrides the packet. CPU-only, Tier-2 exploratory probe-fit/geometry
# cell. Never pooled with the locked PROTOCOL v0.3 headline matrix or the
# S/T headline readings.
apiVersion: lab-cell/v1
