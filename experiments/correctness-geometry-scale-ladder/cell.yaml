method_reference:
  - experiments/correctness-direction-rotation/cd_rotation_analysis.py   # full_direction, cv_auroc, cos
  - experiments/correctness-subspace-overlap/subspace_overlap_analysis.py  # sub_seed, rng_for, parallel_map, deflation_subspace

