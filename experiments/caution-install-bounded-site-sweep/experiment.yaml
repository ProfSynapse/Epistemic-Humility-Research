slug: caution-install-bounded-site-sweep
title: Bounded caution-install site sweep on the trained Qwen3-4B lineage
type: steer-cell
status: resolved
registered: true
created_at: '2026-08-08T22:27:53Z'
tier: 2
posture: exploratory
question: Does the raw-base answerability-gated caution snap, the one mechanism in
  this program with a governed installation success, transfer to the trained clean-SFT
  to GRPO-v2 checkpoint; and if not, does a bounded search over seven write sites,
  two write positions, an eight-rung ratio-normalized dose ladder, and three magnitude-matched
  two-site combinations find a site where caution can be installed on genuine unknowns?
prediction: The null survives on the trained checkpoint. No registered site and position
  clears G1 on the trained lineage, while the raw-base anchor arms at hs23 and hs29
  reproduce their published rates inside their Wilson intervals. If anything clears
  G1, it is an in-band site between hs13 and hs23 rather than hs34.
falsifier: Any registered site and position on the trained checkpoint clears G1, an
  ADJUDICABLE G2, and G3 together, at a dose drawn from the registered ladder. One
  qualifying cell is sufficient, because the statement being tested is an impossibility
  claim.
