# Pre-sign feasibility probe for caution-install-bounded-site-sweep.
#
# Tier 3, lab notebook. This is a coverage probe, not evidence. It exists
# because .skills/experiment-runner/reference/amendment-vs-lab-notebook.md,
# section "Pre-sign feasibility probe: every arm must be constructible from real
# data", requires confirming that every arm can be built from data that exists
# before an amendment is signed, and records that this is permitted and required
# even under a self-blinding rule.
#
# It BLOCKS SIGNING of the main cell. Prose pre-registration, pass criterion,
# and rationale live in NOTEBOOK.md under the dated entry that references this
# file. Nothing here is a claim and nothing here is pooled with anything.
#
# WHAT THIS PROBE MAY COMPUTE: role counts and their rates, corpus inventory
# counts, capture rate, and the measured generation throughput.
# WHAT IT MAY NOT COMPUTE: any steered quantity, any direction fit, any gate
# AUC, any tau, any tighten rate, any AUROC. Computing any of those would
# consume the main cell's blind.

seed: 20260707

question: >-
  Does the trained clean-SFT to GRPO-v2 checkpoint produce enough confab and
  known_correct_answered rows to populate the main cell's G0a held-out floors of
  150 and 250, given the available corpus?

why_it_is_in_doubt: >-
  The trained checkpoint over-refuses. A checkpoint that refuses may confabulate
  too rarely to fill a confab pool, and may answer answerable questions too
  rarely to fill a known-correct pool. Both populations are therefore at risk and
  both are probed.

substrate:
  base_model: unsloth/Qwen3-4B
  base_form: clean-SFT merged-16bit
  adapter_repo: professorsynapse/eh-qwen3-4b-clean-sft-grpo-v2-seed1-lora
  adapter_revision: 8914081dfcec4f1f025f2dbe4195d4f7aa8d210e
  quantization: none
  dtype: bf16
# The raw-base substrate is NOT probed: its pool is already established at
# confab held_out 185 and known_correct_answered held_out 258
# (experiments/doubt-gated-caution-tighten/gates.yaml header, realized split).

# ---------------------------------------------------------------- Stage A
# CPU. Corpus inventory. No model, no generation.
stage_a_corpus_inventory:
  device: cpu
  purpose: >-
    Count the candidate rows available to draw from, so the measured role rates
    can be converted into an achievable pool size.
  counts_required:
    - id: M_u
      quantity: available gold-unanswerable rows
    - id: M_a
      quantity: available gold-answerable rows
  disjointness_check:
    required: true
    rule: >-
      candidate rows must be disjoint from any training pool consumed by the
      clean-SFT or GRPO-v2 stages of this lineage; record the check and the
      overlap count, which must be zero
  output: analysis-committed/probe_corpus_inventory.json

# ---------------------------------------------------------------- Stage B
# GPU. Undosed generation only. ONE arm. No directions, no writes, no hooks.
stage_b_role_yield:
  device: gpu
  gpu_ack_flag: --i-know-this-runs-on-gpu
  arms:
    - name: undosed_baseline
      description: >-
        the ONLY arm. Unsteered greedy generation, graded for role labels. No
        direction is loaded and no hook is installed anywhere in this probe.
  sampling:
    n_unanswerable: 400
    n_answerable: 400
    draw: uniform without replacement from the Stage A candidate sets
    draw_seed: 20260707
    rationale: >-
      At n = 400 the Wilson 95% half-width is about 4.0 points at p = 0.20 and
      about 2.1 points at p = 0.05, which is enough precision to decide whether
      the corpus can supply the required pool. Drawn rows are recorded by id so
      the main cell's Stage 1 mining reuses these generations rather than
      repeating them, which makes the probe cost recoverable rather than
      additional.
  generation:
    # Identical to the main cell's surface.generation, so the role labels this
    # probe produces are produced by the same instrument the main cell uses.
    max_new_tokens: 200
    min_new_tokens: 1
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    eos_includes_im_end: true
    enable_thinking: false
  grading:
    roles:
      confab: gold-unanswerable row where the checkpoint answers
      known_correct_answered: gold-answerable row answered and graded correct
      unknown_refused: gold-unanswerable row where the checkpoint refuses
    read_policy: first_json
    read_policy_note: >-
      asserted explicitly rather than inherited. The role grader can read the
      whole completion, which lets trailing prose reach a role label; the
      gemma family atlas recorded 22 of 2815 split rows disagreeing between the
      whole-text and first-JSON reads.
  instrumentation:
    record_rows_per_minute: true
    record_mean_new_tokens: true
    purpose: >-
      the main cell's GPU budget currently rests on an unmeasured generation
      rate; this probe measures it so the budget can be restated from a
      measurement before the sweep is authorized
  token_budget:
    rows: 800
    max_new_tokens_per_row: 200
    worst_case_new_tokens: 160000
  output: analysis-committed/probe_role_yield.json

# ------------------------------------------------------------- Criterion
pass_criterion:
  # Conservative by construction: the Wilson LOWER bound is used, so the probe
  # passes only if the corpus supplies the pool even at the pessimistic end of
  # the estimate.
  derivation:
    fit_frac: 0.40
    held_out_frac: 0.60
    required_held_out_confab: 150
    required_held_out_known_correct: 250
    required_total_confab: 250          # 150 / 0.60
    required_total_known_correct: 417   # ceil(250 / 0.60)
  checks:
    - id: P1_confab_supply
      expression: wilson_lower_95(confab / n_unanswerable) * M_u >= 250
      direction: floor
    - id: P2_known_correct_supply
      expression: wilson_lower_95(known_correct / n_answerable) * M_a >= 417
      direction: floor
    - id: P3_capture
      expression: answer capture rate on probed rows >= 0.90
      direction: floor
      note: the atlas AG0a bar; a checkpoint that cannot be cleanly mined stops here
    - id: P4_disjointness
      expression: training-pool overlap count == 0
      direction: equality
  pass_meaning: >-
    all four checks pass. Signing of the main cell is unblocked, and the
    measured throughput is written into the AMENDMENT run plan in place of the
    engineering estimate.
  fail_meaning: >-
    any check fails. The main cell is NOT signed in its current form. The
    failure is recorded in NOTEBOOK.md with its counts, and the lead decides
    between narrowing the cell to the raw-base substrate, enlarging or changing
    the corpus, or recording the transfer question as unaskable on this
    checkpoint. The registered pool floors are not lowered to obtain a pass.

execution:
  lane: local_3090
  concurrency: one GPU job at a time
  runtime_image_digest: sha256:f21629b9ae4ed11231768edfaed0f40d41d85d6ea9a71e8096a3d96ea0311772
  render_fn_path: experiments/common/renders
  grader_path: experiments/common/graders
  reference_implementation: experiments/j-space-cross-family-layer-contrast/mine_eval_pool.py
  local_private_dir: experiments/caution-install-bounded-site-sweep/analysis/
  committed_public_dir: experiments/caution-install-bounded-site-sweep/analysis-committed/
  containment:
    committed_row_text: forbidden
    committed_generations: forbidden
    committed_aliases: forbidden
    committed_outputs: counts, rates, intervals, and throughput only
