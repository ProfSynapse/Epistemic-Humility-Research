question: Does the flavor-atlas-rawbase overt-unanswerability separation (all six
  KUQ flavors plus SelfAware, 0.9800-0.9994 held-out AUROC on the raw base) survive
  cross-fitted removal of the activation variance predictable from prompt surface
  (length, punctuation, digit profile, interrogative form, and lexical n-grams), or
  is it a style artifact?
prediction: 'P1 (primary): after cross-fitted combined-surface residualization, all
  six KUQ flavors retain held-out out-of-fold AUROC >= 0.90 at both of their two primary
  layers (committed best layer and L35), for all twelve primary cells. P2 (reference):
  SelfAware retains AUROC >= 0.90 at both L25 and L35, and AmbigQA stays <= 0.75 at
  both L25 and L35. P3 (secondary, S2): the surface-only probe on Z alone reaches
  at least 0.75 for at least one of the six KUQ flavors.'
falsifier: 'F1 (style artifact confirmed): with C1/C2/C3 passing, all six KUQ flavors
  fall to <= 0.75 at both primary layers; the atlas separation is carried by the registered
  linear surface model and may not be promoted to a claim. F2 (partial style dependence,
  blocks promotion): with C1/C2/C3 passing, any one of the twelve primary cells reads
  below 0.90. F1 and F2 are nested (F2 fires whenever F1 fires) but carry different
  write-ups. Any other pattern is reported as mixed, per flavor, with no pooled rescue.'
