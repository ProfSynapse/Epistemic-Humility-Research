schema_version: 1
decision_states: [pass, falsified, indeterminate]
hard_stop_before_capture_on: [g0_fail, g1_fail, g2_fail]

signing_prerequisites:
  generic_tuner_vllm_capability_merged: true
  generation_image_digest_exact: true
  pi_approved_model_smokes: [gemma4_e4b_it, qwen3_4b_raw_base]
  per_model_smoke:
    exact_private_rows: 20
    exact_prompt_bytes: true
    exact_prompt_token_sequence_sha256: true
    prompt_plus_generation_within_max_model_len: true
    repeats_original_order: 2
    repeats_fixed_permutation: 2
    completion_token_ids_identical: true
    finish_reasons_identical: true
    parsed_objects_identical: true
    whole_output_schema_valid_fraction: 1.0
    salvage_parsing: forbidden
    kill_resume_canonical_rowlog_exact: true
    kill_after_first_durable_rows: 16
  planted_role_matcher:
    minimum_fit_triads: 64
    minimum_held_out_triads: 64

g0:
  name: engine_provenance_containment_and_coverage
  checks:
    source_sha256_exact: true
    source_license_exact: true
    source_counts_exact: true
    same_source_pair_mapping_exact: true
    unanswerable_answer_fields_never_consumed: true
    model_revision_and_shape_exact: true
    render_and_anchor_contract_exact: true
    prior_atlas_normalized_text_overlap: 0
    committed_manifest_is_id_only: true
    prohibited_key_and_private_text_scan: pass
    generation_runlog_schema_smoke: pass
    generation_runlog_full_grader_dict_present: true
    generation_runlog_kill_resume_smoke: pass
    generation_engine: vllm
    synaptic_tuner_host_revision_provenance_exact: true
    synaptic_tuner_runtime_source_fingerprint_exact: true
    generation_image_digest_exact: true
    expected_vllm_version_exact: true
    vllm_model_runner_exact: v1
    minimum_compute_capability_satisfied: true
    hardware_class_exact: true
    host_driver_exact: true
    startup_runtime_provenance_complete: true
    batch_invariant_set_before_engine_construction: true
    tokenizer_revision_exact: true
    tensor_parallel_size_exact: true
    batch_size_exact: 16
    max_model_len_exact: true
    gpu_memory_utilization_exact: true
    trust_remote_code_exact: true
    max_num_seqs_exact: true
    max_num_batched_tokens_exact: true
    multimodal_limits_exact: true
    structured_output_schema_sha256_exact: true
    structured_output_disable_any_whitespace_exact: true
    output_affecting_config_hash_exact: true
    exact_generation_row_coverage: 1.0
    whole_output_schema_valid_fraction: 1.0
    salvage_parsing_used: false
    private_prompt_token_sequence_hashes_complete: true
    private_completion_token_ids_complete: true
    private_finish_reasons_complete: true
    private_checkpoint_and_resume_history_complete: true
  on_fail: indeterminate

g1:
  name: generation_yield_and_role_quality
  per_model:
    grader_integrity: pass
    minimum_fit_triads: 64
    minimum_held_out_triads: 64
    roles_per_triad: [confab, known_correct_answered, unknown_refused]
  on_fail: indeterminate_hard_stop_before_capture

g2:
  name: surface_support
  per_model:
    evaluate_separately: [fit, held_out]
    maximum_pairwise_scalar_abs_smd: 0.10
    maximum_grouped_pairwise_best_orientation_held_out_auroc: 0.60
    folds_group_intact_triads: true
  on_fail: indeterminate_hard_stop_before_capture

g3:
  name: planted_signal_reachability
  per_model:
    synthetic_surface_tag: three_column_one_hot_role
    synthetic_surface_tag_min_each_pairwise_held_out_auroc: 0.90
    planted_location_hs:
      gemma4_e4b_it: 21
      qwen3_4b_raw_base: 18
    planted_scale_grid: [0.25, 0.5, 1, 2, 4, 8, 16]
    planted_peak_unique: true
    planted_peak_min_runner_up_ratio: 1.05
  on_fail: indeterminate

g4:
  name: capture_integrity_and_atlas_applicability
  per_model:
    full_depth_final_prompt_token_coverage: 1.0
    exact_row_join: true
    activation_shard_index_complete: true
    activation_tensor_digests_exact: true
    registered_half_fit_surface_support_recheck: pass
    strict_interior_depth: [0.20, 0.85]
    require_one_joint_layer_all_axes_at_or_above_auroc: 0.80
  on_fail: indeterminate

g5:
  name: peak_location
  prerequisites: [g0_pass, g1_pass, g2_pass, g3_pass, g4_pass]
  per_model:
    require_unique_real_peaks: true
    full_matched_fit_peak_max_depth: 0.20
    fixed_seed_half_intact_triad_peak_max_depth: 0.20
    margin_use: descriptive_only
  joint_precedence:
  - falsified_if_either_model_has_any_valid_unique_full_or_subsample_peak_depth_above_0.20
  - otherwise_indeterminate_if_either_model_has_any_g0_g4_failure_or_nonunique_required_peak
  - otherwise_pass_only_if_both_models_satisfy_both_early_location_checks
  joint_row_is_derived_not_scored: true
