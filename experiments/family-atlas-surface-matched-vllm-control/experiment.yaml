question: Does the early-exterior family-atlas eff_dim_frac peak persist in fresh,
  cross-original, surface-matched KU-role pools for Gemma-4-E4B-it and Qwen3-4B when
  syntax is enforced by a pinned batch-invariant vLLM generator?
prediction: For both Gemma-4-E4B-it and Qwen3-4B, the surface-matched FIT profile
  and its fixed-seed 50% intact-triad subsample retain a unique early-exterior eff_dim_frac
  peak at depth at most 0.20.
falsifier: After G0-G4 pass for a model, any valid primary full or registered subsample
  profile whose eff_dim_frac peak is beyond depth 0.20 falsifies the surface-robustness
  prediction; a prerequisite failure or nonunique real peak is indeterminate and never
  a pass.
