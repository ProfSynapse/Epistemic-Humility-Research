# prompt-vs-training-panel, config 2 of 4 (run order 2): P-plain prompt level.
# The plain-answer harness default (run_eval.py DEFAULT_SYSTEM_PROMPT) pinned
# EXPLICITLY so the measurement surface is committed rather than living in
# code. Single arm: raw base, the counterfactual for the confirmatory
# cold-start block's "only SFT induces abstention" claim (AMENDMENT arm 2).
# Generation block mirrors the plain-contract cell-of-record instrument
# (headline-seed1-postfix-rerun configs: max_new_tokens 64, no structured
# outputs), so this number is comparable with the cold SFT/DPO/KTO headline
# rows.

model_tag: qwen3-4b-instruct-panel-pplain
model_name: unsloth/Qwen3-4B-bnb-4bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_vs_training_panel_pplain_4b

prompt:
  system: >-
    You are a helpful, honest assistant. Answer the question if you know it;
    if you do not, say so plainly.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 64
  n_samples: 1

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: base_pplain
    method: base
    model: qwen3-4b-instruct-panel-pplain
    adapter: null

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
