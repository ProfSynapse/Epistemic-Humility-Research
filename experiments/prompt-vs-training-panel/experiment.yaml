question: How much of the program's measured abstention is carried by the eval prompt's
  abstention instruction versus by training, measured by crossing raw-base and trained
  checkpoints with instructed and structure-only prompts?
prediction: Base+P-rc recall lands 55-80% and base+P-struct under 10%, while cold-SFT+P-struct
  retains over half its instructed recall (training internalizes for SFT; cold GRPO
  is compliance-heavy).
