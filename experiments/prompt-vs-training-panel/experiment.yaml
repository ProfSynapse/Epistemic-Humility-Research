verdict: The RC contract alone elicits near-ceiling abstention from the untrained
  base (recall 90.89) while plain and structure-only prompts elicit none (0.00 scored,
  ~4-6 audited); only SFT-trained weights carry abstention without the instruction
  (69.6, deepened to 77.4 by GRPO on top), so training-regimen abstention claims are
  meaningful only relative to prompt condition.
