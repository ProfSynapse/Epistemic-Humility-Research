# J-space layer-contrast rep2 (multi-source, ceiling-robust) gates.
# DRAFT until `bin/exp sign`.

seed: 20260709
alpha: 0.05

gates:
  - name: g0_instrument_validity
    interpretation: stop_before_outcome
    checks:
      - id: fresh_pool_disjoint
        pass_if: "multisource_pool_manifest row keys resolve (via normalized question
          text) to zero overlap with BOTH the predecessor split manifest
          (experiments/common/doubt-gated-caution-tighten-heldout-split/split_manifest.json)
          AND rep1's fresh_eval_pool_manifest.json"
      - id: fresh_pool_total_floor
        pass_if: "fresh multi-source confab pool has at least 200 total rows"
      - id: fresh_pool_harder_source_floor
        pass_if: "fresh confab pool has at least 40 rows from EACH of kuq_ku_unknown
          and selfaware_unanswerable"
      - id: containment
        pass_if: "no question text, aliases, raw generations, or row-level outputs are
          committed"
      - id: calibration_setpoints_fixed
        pass_if: "selected_doses exactly equal hs23=25, hs26=75, hs29=125, hs34=175"
      - id: anchor_extract_complete
        pass_if: "fresh confab anchor extract contains hs23/hs26/hs29/hs34 tensors for
          every fresh confab eval row, AND the reused known-side anchor extract
          contains hs23/hs26/hs29/hs34 tensors for every reused known_correct_answered
          row"
      - id: smoke_write_readback
        pass_if: "all dosed smoke rows read back within 5% + 0.5 absolute of each
          layer's calibrated dose"
      - id: smoke_no_collapse
        pass_if: "collapse rate on dosed smoke rows is 0 for every layer"
      - id: run_log_operative
        pass_if: "the per-arm RunLog file for at least one layer visibly grows
          (line count increases) during the smoke run, confirming per-row
          persistence is wired and not silently degraded to an in-memory-only loop"

  - name: g1_prime_midband_replication_ceiling_robust
    primitive: mcnemar_paired_layer_contrast
    midband_layers:
      - hs23
      - hs26
      - hs29
    late_reference: hs34
    best_mid_selection: "argmax confab_tighten.clean_tighten_rate over the three
      mid-band layers; the SAME selected layer is then used for g1_prime and
      g2_prime -- no re-selection after seeing the paired outcomes"
    metric: paired per-row confab_tighten.clean_tighten outcome, matched by row_key,
      between the selected best-mid layer and hs34
    pass_if: "(a) late-only-failure count (hs34 fails, best-mid succeeds) >= 3x
      best-mid-only-failure count (best-mid fails, hs34 succeeds) -- treated as
      satisfied when best-mid-only-failure count is 0 and late-only-failure count
      is > 0 -- AND (b) exact two-sided binomial McNemar test on the discordant
      pairs has p < alpha (0.05)"

  - name: g2_prime_no_selectivity_regression
    primitive: layer_contrast
    midband_layers:
      - hs23
      - hs26
      - hs29
    late_reference: hs34
    metric: known_correct_cost_control.not_well_formed_correct_rate
    pass_if: "best mid-band cost - hs34 cost <= 0.02"
    report_also: "cost_per_late_only_failure_won (cost_delta / late_only_failure count),
      reported unconditionally as an explicit tradeoff readout alongside the pass/fail"

  - name: g3_prime_reference_off_ceiling
    primitive: rate_over_population
    layer: hs34
    population: confab_tighten
    indicator: clean_tighten
    pass_if_rate_in_range: "[0.40, 0.90]"
    branch_above_range: "status=ceiling_uninterpretable_for_magnitude; the run resolves
      as direction-only (g1_prime's ratio/CI-separation reading may still be reported)
      rather than a pass/fail claim about mid-band superiority's MAGNITUDE"
    branch_below_range: "status=reference_viability_failure, as in rep1's G3"

summary_rule: >-
  This multi-source replication supports the J-space layer-site hypothesis only
  if G0, G1_prime, G2_prime, and G3_prime (status=viable) all pass. If the fresh
  multi-source pool cannot be mined at the registered floors, the experiment
  stops before outcome (G0). If G3_prime's status is ceiling_uninterpretable_for_magnitude
  or reference_viability_failure, the run is reported as an interpretability
  branch outcome rather than a pass/fail claim about mid-band superiority's
  magnitude, per the pre-stated branch semantics above.
