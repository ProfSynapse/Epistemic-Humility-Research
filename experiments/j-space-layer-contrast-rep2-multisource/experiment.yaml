question: On raw-base Qwen3-4B, does the calibrated J-space mid-band write-site advantage
  replicate on a fresh, MULTI-SOURCE private evaluation pool, using ceiling-robust
  gates (McNemar paired test plus an interpretability branch) instead of rep1's fixed
  point-estimate bar that saturated near ceiling?
prediction: 'With rep1''s frozen directions, gates, and calibrated doses unchanged,
  the harder- source-dominant multi-source pool will pull hs34 off the ceiling into
  the interpretable G3'' window (roughly 55-80% clean_tighten), the best mid-band
  arm will beat hs34 on paired outcomes with late-only failures at least 3x mid-only
  failures and exact McNemar p < 0.05 (G1'' pass), and the known-correct cost gap
  will stay within +2pp (G2'' pass): the mid-band advantage replicates at meaningful
  magnitude.'
falsifier: If G1' fails on an interpretable pool (G3' status = viable), the mid-band
  advantage does not replicate at meaningful magnitude on a comparable multi-source
  confab distribution; report straight, exactly as registered, with no goalpost movement.
