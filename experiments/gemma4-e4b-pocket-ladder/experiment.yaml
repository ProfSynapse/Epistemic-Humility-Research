slug: gemma4-e4b-pocket-ladder
title: 'Gemma-4-E4B pocket ladder: hs25/hs26/hs27, sharing ON'
type: steer-cell
status: draft
registered: true
created_at: '2026-07-31T10:32:02Z'
question: The cross-family operating range across every family that has actuated
  in this program is rd 0.375-0.639 (gemma4-e4b-kv-seam-quarantine/AMENDMENT.md:391-399).
  On gemma4-e4b (42 blocks, KV-sharing donors at blocks 22/23), the upper half of
  that range - rd 0.571-0.639 - falls entirely inside the KV-quarantined region,
  at hs25/hs26/hs27 (same doc, AMENDMENT.md:405-411). That band has never been written
  to on this substrate - the sibling gemma4-e4b-kv-seam-quarantine cell's own ladder
  stops at A5/hs24 on the above-seam side. Does gemma actuate, direction-specifically,
  anywhere in that pocket?
prediction: None of E1 (hs25), E2 (hs26), or E3 (hs27) produces an ADJUDICATED
  G3 PASS (effect_ratio >= 3.0, or PASS-DEGENERATE) jointly with a G1/G2 PASS on
  held-out. Basis - the quarantine cell's measured below-seam ladder falls monotonically
  toward the seam (D1/hs15 0.7857, D2/hs18 0.4464, D3/hs20 0.4048; a per-site-dose
  PROFILE, not a controlled contrast, NOTEBOOK.md:1621), and its one measured
  quarantined-region site, A5/hs24, cleared G1 (0.7321) and G2 (0.0333) but failed
  G3 outright at effect_ratio 1.139 (worst placebo draw reproduced 88% of the true
  effect) - NOTEBOOK.md:1573-1606, Stage 6 Ruling R3/R4. E1/E2/E3 sit deeper into
  the same quarantined region than hs24.
falsifier: An ADJUDICATED G3 result (K=5 accepted draws clearing the SC1 randomness
  bar, placebo readback in tolerance) with effect_ratio >= 3.0, or PASS-DEGENERATE
  under the transcribed zero_denominator_rule (reported WITH the degenerate label,
  never as flat direction-specific actuation), at ANY of E1/E2/E3, jointly with
  that same arm clearing BOTH G1 (held-out confab clean_tighten >= 0.50, Wilson
  lower > 0.40) AND G2 (held-out known-correct not_well_formed_correct <= 0.05,
  Wilson upper < 0.10) - falsifies the prediction. Because the falsifier fires on
  any of three correlated arms sharing one instrument and one extraction, a
  single-arm triple PASS is registered as exploratory evidence subject to the
  standing promotion rule (confirmatory replication before any claim), not as a
  standalone confirmatory result. Subordinate - if no arm finds a usable FIT dose,
  NULL-RESULT (dose-viability), consistent with D4/hs23 NOT-RUN one site upstream.
  If an arm clears G1/G2 but G3 is NOT-RUN or UNADJUDICATED at every such arm, the
  experiment resolves INCONCLUSIVE on the direction-specificity question rather
  than being read either way. A failing ADJUDICATED G3 at an arm that cleared
  G1/G2 does NOT falsify - it is the predicted hs24-pattern outcome.
