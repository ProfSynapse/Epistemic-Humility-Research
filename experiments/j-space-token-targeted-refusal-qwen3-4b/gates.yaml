# J-space internal token-targeted refusal write gates. DRAFT until `bin/exp sign`.

seed: 20260708
alpha: 0.05

gates:
  - name: g0_instrument_validity
    interpretation: stop_before_outcome
    checks:
      - id: runner_checkpointed
        pass_if: "row/layer/arm records are checkpointed durably and full mode can resume without duplicating completed records"
      - id: token_bundles_frozen
        pass_if: "positive and negative token bundles are fixed before FIT dose calibration"
      - id: fit_only_dose_selection
        pass_if: "J-token dose is selected on FIT rows only; held-out rows are untouched before full mode"
      - id: private_row_text_only
        pass_if: "row text exists only under gitignored analysis/ and no question text, aliases, raw generations, or row-level outputs are committed"
      - id: smoke_write_readback
        pass_if: "all dosed smoke rows read back within 5% + 0.5 absolute of each selected dose"
      - id: smoke_no_collapse
        pass_if: "collapse rate on dosed smoke rows is 0 for every intervention arm"

  - name: g1_hybrid_improves_clean_tighten
    primitive: arm_contrast
    baseline_arm: c_hat_only_hs23
    treatment_arm: c_hat_plus_j_token_hs23
    population: confab
    metric: clean_tighten_rate
    pass_if: "treatment - baseline >= 0.04"

  - name: g2_no_known_correct_cost_regression
    primitive: arm_contrast
    baseline_arm: c_hat_only_hs23
    treatment_arm: c_hat_plus_j_token_hs23
    population: known_correct_answered
    metric: not_well_formed_correct_rate
    pass_if: "treatment - baseline <= 0.02"

  - name: g3_random_j_control_does_not_reproduce
    primitive: difference_in_differences
    baseline_arm: c_hat_only_hs23
    treatment_arm: c_hat_plus_j_token_hs23
    control_arm: c_hat_plus_random_j_hs23
    population: confab
    metric: clean_tighten_rate
    pass_if: "(treatment - baseline) - (control - baseline) >= 0.03"

  - name: g4_format_and_language_guard
    primitive: arm_contrast
    baseline_arm: c_hat_only_hs23
    treatment_arm: c_hat_plus_j_token_hs23
    metrics:
      - malformed_json_rate
      - forced_continuation_rate
      - non_target_language_drift_rate
    pass_if: "each treatment - baseline <= 0.02"

summary_rule: >-
  The internal J-space token-target write passes this exploratory option-2 test
  only if G0, G1, G2, G3, and G4 all pass. A pass means the token-targeted
  hidden write improves the already-working hs23 caution snap on this surface;
  it is not a cross-family or headline claim.
