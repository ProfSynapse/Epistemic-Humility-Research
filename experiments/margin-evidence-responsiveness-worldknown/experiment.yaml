question: On Qwen/Qwen3.5-4B, does the KUQ-fit c_hat known-unknown direction (TRANSFER)
  satisfy earnability criterion (d) on a WORLD-KNOWN error class? That is, on confident-wrong-on-answerable
  PopQA rows, does supplying the true answer in-context both collapse the c_hat projection
  (toward the correct/refused regime) and lengthen the commitment margin, specifically
  for the true answer over a category-matched false-answer placebo? A world-known
  c_hat refit natively is run as a secondary two-channel dissociation reading.
prediction: 'On the TRANSFER direction, supplying the true answer in-context both
  collapses the c_hat projection on confab rows (paired median shift toward the correct/refused
  regime at or above the re-derived floor, and larger than the false-answer placebo)
  and lengthens their margins (true-answer survival at each row''s own world-known
  tipping dose exceeds the placebo, CI excluding zero): qwen earns criterion (d) for
  the named KUQ direction. [Predictor calls registered in the scoreboard at sign.]'
falsifier: 'With all gates valid AND the transfer direction firing at baseline (baseline
  confab-vs-correct AUROC >= 0.70 on the test subset, BLOCKER B1), at least one channel
  on the TRANSFER direction fails its floor: the projection does not collapse toward
  the correct/refused regime specifically for the true answer (D1 fails), or the margin
  does not lengthen for the true answer over the placebo (D2 fails). Only then is
  criterion (d) not earned on the named KUQ direction; a single-channel pass is reported
  as a channel dissociation. If instead the transfer direction does not fire at baseline
  (AUROC < 0.70), the criterion (d) test is voided and lifted to PI, not scored as
  a (d)-not-earned failure. The native two-channel result is reported separately and
  never changes this verdict.'
