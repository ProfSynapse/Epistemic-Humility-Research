  modules:
  - grpo_cold_diagnostics.py
  pins:
    cell.yaml: 82b7d84b41813b7dbc5d91e05a6de8eb361d4b4e11f21c1bcc2e1ee3bc878872
    gates.yaml: 853e4eff13af55b43b95b22decbf47542d76306f5f87a6f31af6265a1052826a
