slug: grpo-cold-start-induction
title: 'Cold-start GRPO: can the appropriateness reward induce abstention from the
  base model?'
type: training-run
status: falsified
registered: true
created_at: '2026-08-13T15:20:18Z'
question: Can GRPO under the rebalanced (v2) appropriateness reward induce abstention
  when trained from the raw Qwen3-4B base with no SFT warm-up, completing paper 2's
  cold-start comparison across all four objectives?
prediction: 'Eval refusal recall below 10% (cold DPO/KTO read ~0%), with Null-B (no
  trainable signal: >=90% of training groups at zero advantage) as the modal mechanism.'
falsifier: 'Cold-start GRPO induces abstention: eval refusal recall >= 20% with over-refusal
  reported alongside — falsifying the generalized ''only SFT induces abstention from
  the base model'' reading.'
checkpoint:
  repo: ''
  revision: ''
instrument:
  configs:
  - cell.yaml
