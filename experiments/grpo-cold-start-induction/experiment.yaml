    configs/eval_grpo_cold_start_selfaware_full_local_4b.yaml: ae148cbfb5072c17cb5f02fdd9ebff7fbdcf158fcbd4618f4a34312ebf286bfc
    grpo_cold_diagnostics.py: 68c283e363f34b2a540eb3767ffc4a7a803c92eed9352741d7d37a3c365a7878
  engine_exception:
    kind: parity-locked
    reason: The cold-vs-warmed comparison is only valid if the cold arm uses the identical
      trainer + rollout stack as the SFT-warmed GRPO arms it is compared to (grpo-three-seed-confirmatory's
      clean_sft_grpo_v2 arm and its stacked siblings); switching the rollout engine
      to vLLM would confound the comparison with an instrument change. The rollout
      engine is train_grpo.py's own TRL GRPOTrainer generation path, not vLLM. The
      eval stage separately reuses the matrix's own eval instrument (run_eval.py)
      for the same parity reason -- AMENDMENT.md "Design", "Engine exception".
  persistence:
    grpo_cold_diagnostics.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 2.0
      note: CPU-only, single-pass read of a GRPO_REWARD_DEBUG_PATH JSONL plus one
        JSON write; not incremental (a kill mid-run just means rerun it once the JSONL
        and eval summary exist). Measured 0.207s over a realistically-sized synthetic
        fixture (465 events x 128 rows/event, 15.66MB, matching the ~465-step budget
        the cold arm inherits from the warmed v2 arm's dataset/batch/epoch config)
        via test_grpo_cold_diagnostics_smoke.py's fixture harness; declared value
        includes safety margin for a larger real production debug file.
