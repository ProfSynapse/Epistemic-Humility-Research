verdict: Cold-start GRPO trained on real gradient (not Null-B) and fired the registered
  >=20 percent falsifier at 85.66 percent eval recall, but the panel base counterfactual
  (90.89 under the same instruction, 0 without it) shows the reward preserved and
  sharpened prompt-elicited abstention rather than inducing any; the registered prediction
  is falsified and the induction framing retired.
