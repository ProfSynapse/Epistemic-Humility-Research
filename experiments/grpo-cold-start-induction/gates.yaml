# grpo-cold-start-induction gates, fixed before launch.
# Transcribed verbatim from AMENDMENT.md "Gates". CG-G0 is the integrity
# precondition (pre-outcome stop); CG-G1 is the mechanism call, fixed before
# the run, with the 90/10/20 thresholds AMENDMENT.md pins and never retunes
# after the result. Implemented by grpo_cold_diagnostics.cg_g0_checklist and
# grpo_cold_diagnostics.cg_g1_call.

gates:
  - id: CG-G0
    kind: integrity-precondition
    stop: pre-outcome
    criteria:
      - "training either completes the registered step budget or records an honest degenerate-reward stop (no silent restarts, no reward retuning) -- exactly one of the two, never both and never neither"
      - "the eval runs the full row set with every row scored (selfaware-full-3369: eval_rows_scored == eval_rows_total == 3369)"
      - "the three pre-registered diagnostics (per-group zero-advantage fraction, valid-contract-parse fraction, abstention rate) are present in the run record -- any missing diagnostic is a stop, not a footnote"
    implemented_by: grpo_cold_diagnostics.cg_g0_checklist
  - id: CG-G1
    kind: primary
    arm: cold_base_grpo_v2
    criterion: >-
      Null-B is declared if >=90% of training groups have zero advantage
      across the run; otherwise the outcome is read as trained (Null-A if
      eval refusal recall <10%, falsifier zone if eval refusal recall >=20%,
      ambiguous band 10-20% reported as such).
    zero_advantage_floor: 0.90
    null_a_ceiling_pct: 10.0
    falsifier_floor_pct: 20.0
    thresholds_fixed: true   # never retuned after the result, per AMENDMENT.md
    implemented_by: grpo_cold_diagnostics.cg_g1_call
falsifier: >-
  Cold-start GRPO induces abstention: eval refusal recall >= 20% with
  over-refusal reported alongside -- falsifying the generalized "only SFT
  induces abstention from the base model" reading; paper 2 would have to say
  so.
prediction: >-
  Eval refusal recall below 10% (cold DPO/KTO read ~0%), with Null-B (>=90%
  zero-advantage training groups) as the modal mechanism.
