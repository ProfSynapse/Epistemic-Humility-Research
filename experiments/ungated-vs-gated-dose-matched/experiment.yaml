created_at: '2026-07-11T00:41:00Z'
question: When every held-out row is dosed unconditionally at the caution-snap setpoint
  (gate off) versus dosed only where the doubt gate fires (gate on), does the doubt
  gate supply the instrument's selectivity - much less known-correct damage - without
  materially sacrificing confab conversion?
prediction: Ungated known-correct damage exceeds gated by at least 15pp absolute (McNemar
  p < 0.001), while ungated confab conversion is at or above gated confab conversion
  and the gated arm stays within 15pp of it, so the doubt gate supplies the instrument's
  selectivity without materially sacrificing conversion.
falsifier: Ungated known-correct damage does not exceed gated known-correct damage
  by 15pp absolute (dosing every known-correct row is about as harmless as gating
  it) - the write is inherently selective, the gate is not what supplies selectivity,
  and the paper's non-selectivity sentence must be removed.
