verdict: 'NULL (falsifier fired), resolved 2026-07-06. AN-G1 PASS (collateral 0 of
  allowed 2) but VACUOUS: zero effect on the write means zero collateral by construction,
  not a real honesty guarantee, since the corrects it was guarding were never actually
  at risk. AN-G2 MISS (0 of 116 baseline confabs killed against a floor of 5; descriptive
  dose ladder g=+1/+2/+3 kills 0/0/0 of the 47 flagged confabs). AN-G3 MISS (primary-minus-control
  kill diff 0, 1,000-resample row bootstrap 95% CI [0.0, 0.0] against a floor of 5
  with CI excluding zero). Primary arm: 244 flagged rows (47 confabs, 4 corrects,
  11 wrong, 18 answerable-refused, 164 unanswerable-refused); all 47 flagged confabs
  land in confab_to_different_confab, never a refusal. Descriptive bidirectional arm:
  the same actuator at g=-2 de-refuses 0 of 114 baseline answerable-refused rows.
  Smoke readback confirms the write lands precisely on-axis (mean observed setpoint
  43.98 vs commanded 44.26, max abs error 0.58 against sigma 22.13; unflagged rows
  show zero shift), ruling out an injection-fidelity failure. caution_perp, reached
  this precisely on propensity-flagged rows, did not convert any flagged confabulation
  to a refusal. This null is CONFOUNDED and must be read as such: the actuator direction
  was the caution_perp REFIT on the AI-TRUE checkpoint, which has cosine -0.064 with
  AC''s validated GRPO-v2 direction (essentially orthogonal), and it was never independently
  shown to be a behavioral lever on this checkpoint. AC''s win validates AC''s direction;
  it does not transfer to AN''s refit direction, and the section 6 positive-control
  screen that would have validated it was deferred, not run. AN therefore cannot distinguish
  "the caution axis cannot suppress confabulation" from "this refit direction is a
  dead actuator." Do NOT read AN as evidence for any input-side-vs-write-side rule:
  AC is itself a WRITE-side erase-write on caution_perp and it PASSED (+8.7pt), so
  write-side activation edits are not uniformly null. The honest open question AN
  leaves is whether a caution actuator validated as a lever on this checkpoint, coupled
  to the confab-propensity readout the way AC coupled the doubt readout, can regulate
  confabulation.'
