question: Do the narrow-detector control conclusions behind paper 5 Sections 4.5 and
  4.6 (random-direction placebo carries far less than the gated write; the permuted
  gate degrades cost and selectivity) survive re-scoring under the pinned wide two-instrument
  stack (detector_v2 plus blinded context-free LLM grading), after faithful regeneration
  of the arms from the committed pipelines?
prediction: Both control conclusions survive at both operating points - the wide-instrument
  effect ratio (gated lift over random-direction lift) is at least 3.0, and the permuted-gate
  cost/selectivity degradation holds with a bootstrap CI excluding zero.
falsifier: WG-G1 effect ratio below 3.0 at the Section 4.5 operating point, or WG-G2
  permuted-gate degradation CI including zero - either upgrades the Section 6.4 gap
  to a substantive limitation and blocks promotion of the affected result.
