# prompt-crossing-completion, Gap 3, seed 3 of 3: warmed sequential SFT->DPO
# and SFT->KTO (Amendment A) under the P-struct prompt. See seed1 file header
# for why this is split from cell.yaml's single-file six-arm grouping.
#
# Model base: the seed-3 merged-16bit base, standard (non-lowmem) merge —
# per archive/experiment/phase1/eval/config/eval_amendment_a_selfaware_full_seed3_sft_kto_local_4b.yaml
# ("no lowmem remerge was needed for seed3; unlike seed2 the original seed3
# merge was never confounded"). NOT ON DISK as of this build (see report);
# rebuild recipe: the generic
# archive/experiment/phase1/grpo/merge_sft_adapter_16bit.py <adapter_dir>
# <output_dir> (FastLanguageModel.from_pretrained(load_in_4bit=False,
# max_seq_length=2048) + save_pretrained_merged(save_method="merged_16bit")),
# i.e. the same full-precision merge pattern seed1 used
# (.tmp/merge_grouped_sft_lora_container.py / merge_lora_checkpoint). No
# seed3-specific merge script survives on disk to cite verbatim; this is the
# pattern inferred from the seed1 script plus the seed3 config's own comment
# ruling out the lowmem path.
# Prompt block byte-identical to
# experiments/prompt-vs-training-panel/configs/eval_panel_pstruct_warmed_local_4b.yaml.

model_tag: qwen3-4b-seq-sft-dpo-kto-seed3-crossing-pstruct
model_name: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft__4b__headline__seed3/20260615_104507/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_completion_4b

prompt:
  system: >-
    Answer the user's question. Return only a JSON object with exactly two
    keys: "answer" and "response_confidence". The "answer" value is your
    answer. The "response_confidence" value is your probability from 0 to 1
    that your response is appropriate. Do not include markdown, code fences,
    reasoning, or any text outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: seq_sft_dpo_seed3_pstruct
    method: dpo
    model: qwen3-4b-seq-sft-dpo-kto-seed3-crossing-pstruct
    # Amendment A sequential SFT->DPO seed3
    # (docs/checkpoint-staging.md: eh-qwen3-4b-seq-sft-dpo-seed3-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_dpo__4b__amendment_a__seed3/20260616_130451/final_model
  - name: seq_sft_kto_seed3_pstruct
    method: kto
    model: qwen3-4b-seq-sft-dpo-kto-seed3-crossing-pstruct
    # Amendment A sequential SFT->KTO seed3
    # (docs/checkpoint-staging.md: eh-qwen3-4b-seq-sft-kto-seed3-lora).
    adapter: /workspace/repo/synaptic-tuner/toolset-training-artifacts/runs/local/4b/sft_kto__4b__amendment_a__seed3/20260617_070334/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
