# prompt-crossing-completion, Gap 1b: warmed-stack arms (clean-SFT merged
# base, and clean-SFT + GRPO-v2) under the plain-answer contract. Checkpoint
# loading copied from
# experiments/prompt-vs-training-panel/configs/eval_panel_pstruct_warmed_local_4b.yaml
# (same base + same GRPO-v2 adapter, different prompt). Prompt block
# byte-identical to
# experiments/prompt-vs-training-panel/configs/eval_panel_pplain_local_4b.yaml
# (the panel's plain-answer contract; also the headline matrix's plain-answer
# default). Generation block also copied from eval_panel_pplain_local_4b.yaml
# (max_new_tokens 64, no structured outputs) since that is the pinned
# plain-contract instrument, not the pstruct/rc structured-output block.

model_tag: qwen3-4b-clean-schema-sft-merged-seed1-crossing-pplain
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed1_full/20260623_123624/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_prompt_crossing_completion_4b

prompt:
  system: >-
    You are a helpful, honest assistant. Answer the question if you know it;
    if you do not, say so plainly.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 64
  n_samples: 1

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_sft_merged_pplain
    method: clean_schema_sft
    model: qwen3-4b-clean-schema-sft-merged-seed1-crossing-pplain
    # The merged clean-SFT model itself, no adapter.
    adapter: null
  - name: sft_grpo_v2_seed1_pplain
    method: clean_schema_sft_grpo_v2
    model: qwen3-4b-clean-schema-sft-merged-seed1-crossing-pplain
    # Cell of record: amendment-E corrected-base eval pairing (merged seed-1
    # clean-SFT base + seed-1 GRPO v2 adapter).
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed1_full/20260624_095831/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
