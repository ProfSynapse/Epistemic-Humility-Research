    tuner_run: decision-qwen35-2b-letter-logits
    source_checkpoint: F:/Code/Toolset-Training/.claude/worktrees/jev-models-tuner-training-b55d92/toolset-training-artifacts/runs/local_docker/decision/decision-qwen35-2b-letter-logits/20261004_152616/final_model
    tree_sha256: 3aef07e292b2892d7e2812d2935ed054c01d3422dc330e52c486805e13f9dd96
    dmcc_test_rows: dmcc_test_rows_letter_logits

# Twelve read-only engine runs per cell: per model, 5 IDK runs (one per IDK
# position) + 1 no-IDK run. The no-IDK runs recompute dmcc's analysis on the
# identical rows under this cell's engine pin (CAL per-row records for H3).
# The IDK runs of one model share one pinned template (analysis config +
# recipe, written for position 0): `stage-engine` materializes position k by
# replacing the template run_id with run_id_template.format(position=k), and
# records the sha256 of every materialized file in the run record. Run keys:
# idk_p<k>_<model> and noidk_<model>.
idk_runs:
  pointer:
    run_id_template: dmio-idk-p{position}-pointer
    template_run_id: dmio-idk-p0-pointer
    analysis_config: experiments/decision-model-idk-option/analysis_idk_pointer.yaml
    recipe: experiments/decision-model-idk-option/recipe_idk_pointer.yaml
  letter_logits:
    run_id_template: dmio-idk-p{position}-letter-logits
    template_run_id: dmio-idk-p0-letter-logits
    analysis_config: experiments/decision-model-idk-option/analysis_idk_letter_logits.yaml
    recipe: experiments/decision-model-idk-option/recipe_idk_letter_logits.yaml
noidk_runs:
  pointer:
    run_id: dmio-noidk-pointer
    analysis_config: experiments/decision-model-idk-option/analysis_noidk_pointer.yaml
    recipe: experiments/decision-model-idk-option/recipe_noidk_pointer.yaml
  letter_logits:
    run_id: dmio-noidk-letter-logits
    analysis_config: experiments/decision-model-idk-option/analysis_noidk_letter_logits.yaml
    recipe: experiments/decision-model-idk-option/recipe_noidk_letter_logits.yaml
staged_rows_name: {idk: decision_rows_idk.jsonl, noidk: decision_rows_primary.jsonl}

scoring:
  gates: experiments/decision-model-idk-option/gates.yaml
  bootstrap_reps: 2000
  bootstrap_seed: 0
  ci_level: 0.95

paths:
  analysis_root: experiments/decision-model-idk-option/analysis            # gitignored
  committed_root: experiments/decision-model-idk-option/analysis-committed # aggregates only
  run_records: experiments/decision-model-idk-option/analysis-committed/run_records
