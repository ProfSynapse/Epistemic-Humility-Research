# Engine (synaptic-tuner) and decision models: unchanged from dmcc.
# ---------------------------------------------------------------------------
engine:
  submodule: synaptic-tuner
  # Must provide the generic `export.cal_rows` option (cal_rows.jsonl, same
  # per-row schema as test_rows.jsonl plus split "cal"/"test"); H3 fits its
  # cutoff on those CAL rows. `collect` refuses an engine output without it.
  # e51a802b adds export.cal_rows / export.fit_rows on top of 29f7af0c (dmcc's
  # pin); engine --dry-run of this cell's configs accepted it 2026-10-05.
  commit: e51a802b1229cc399a80163612638523ddeddbb6
  cli: Trainers/decision/analyze_confidence.py
  launcher: [py.exe, "-3.11", tuner.py, local-run, --job-config]
  staging_root: scratch/eh_staging
  image: unsloth/unsloth@sha256:0b8efd89caf77bc4150f6464416d7bc6a5e00e27a4446615ecf99ef20f553397
  test_rows_file: test_rows.jsonl
  cal_rows_file: cal_rows.jsonl     # written by export.cal_rows

models:
  pointer:
    role: primary
    tuner_run: decision-qwen35-2b-pointer
    source_checkpoint: F:/Code/Toolset-Training/.claude/worktrees/jev-models-tuner-training-b55d92/toolset-training-artifacts/runs/local_docker/decision/decision-qwen35-2b-pointer/20261004_122756/final_model
    tree_sha256: e0cc616de238cfad85a8627aaa47583dba7689ece63c9bedc4c63a6e9a4acbfc
    dmcc_test_rows: dmcc_test_rows_pointer
  letter_logits:
