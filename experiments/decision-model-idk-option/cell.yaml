# ---------------------------------------------------------------------------
# Recognition labeling (NEW labeling stage; base model only, no adapter).
# Every dmcc primary row is scored as a 4-way multiple choice over the SAME 4
# options as its decision row (no IDK option), in 4 cyclic rotations of the
# decision row's canonical option order. dmcc-known rows are the positive
# control (gates.yaml v1); dmcc-unknown rows are split into unknown-true /
# known-recognized / recognition-ambiguous. The base model's answer per
# ordering is the argmax of its next-token logits over the 4 letter tokens.
# ---------------------------------------------------------------------------
recognition:
  hf_id: Qwen/Qwen3.5-2B-Base
  revision: b1485b2fa6dfa1287294f269f5fb618e03d52d7c
  causal_lm_class: Qwen3_5ForCausalLM   # transformers 5.17.0 (runner image); text tower only
  torch_dtype: bfloat16
  batch_size: 1                         # one prompt per forward: no padding or batch-composition effects
  letters: [A, B, C, D]
  # Scored next-token ids: the tokenizer encoding of " A" .. " D" (leading
  # space, matching the exemplar answer lines "A: B"). Each must be exactly
  # one token; the worker refuses otherwise (pre-sign check).
  letter_token_prefix: " "
  orderings: cyclic_rotations           # ordering k shows canonical[k:] + canonical[:k], k = 0..3
  n_orderings: 4
  # Group rule (pre-registered). c = number of orderings whose argmax letter is
  # the gold option. Applied to dmcc-unknown rows.
  group_rule:
    known_recognized_min: 3              # c >= 3 of 4
    unknown_true_max: 0                  # c == 0 of 4
    ambiguous: otherwise                 # c in {1, 2}; reported separately, excluded from primary
  argmax_tie_rule: lowest_letter_index   # exact logit ties go to the lowest letter; ties are counted and reported
  # Amendment-Y base-mode 5-shot surface in multiple-choice form. The five
  # exemplar QUESTIONS and gold answers are Amendment Y's frozen exemplars,
  # byte-identical to experiments/common/readouts/amendment_x_cross_model_extract.py
  # _BASE_MODE_FEWSHOT (a test pins them). Distractors are hand-written and
  # passed the pre-sign collision probe (NOTEBOOK 2026-10-05): no normalized
  # option text below equals a normalized gold alias or option text of any
  # dmcc primary row. Gold letters, in order: B, D, A, C, B.
  prompt:
    exemplar_template: "Q: {question}\n{option_lines}\nA: {letter}\n\n"
    target_template: "Q: {question}\n{option_lines}\nA:"
    option_line_template: "{letter}. {text}"
    exemplars:
      - question: What is the largest planet in our solar system?
        options: [Saturn, Jupiter, Neptune, Uranus]
        gold: Jupiter
      - question: How many sides does a hexagon have?
        options: [Five, Seven, Eight, Six]
        gold: Six
      - question: What is the chemical symbol for gold?
        options: [Au, Ag, Fe, Pb]
        gold: Au
      - question: In what year did the Second World War end?
        options: ["1918", "1939", "1945", "1950"]
        gold: "1945"
      - question: What is the tallest mountain on Earth?
        options: [Kangchenjunga, Mount Everest, Mont Blanc, Lhotse]
        gold: Mount Everest
  # Pre-registered exclusion: a primary row is excluded from every
  # recognition-defined group iff any normalized exemplar option text equals a
  # normalized gold alias (possible_answers + obj) or a normalized option text
  # of that row. Pre-sign count on the dmcc primary rows: 0 (gates.yaml pins it).
  exclude_exemplar_option_collisions: true
  runtime:
    # The image dmcc pinned for Stage 0 (transformers 5.17.0, torch 2.9.1+cu128).
    image_tag: mechinterp-runner:dmcc-tf5.17.0
    docker_cli: [docker, --context, default]
    docker: [docker, --context, default, run, --rm, --gpus, all]
    hf_cache_mount: "$HOME/.cache/huggingface:/root/.cache/huggingface"
    workdir_in_container: /workspace
    pythonpath: experiments/decision-model-idk-option
    container_name: dmio-recognize
  # Non-PopQA items for the pre-sign recognition smoke (format adherence,
  # single-token letters, repeat identity, throughput). Never scored for a gate.
  smoke_items:
    - {question: "How many legs does a spider have?", options: [Ten, Eight, Twelve, Four], gold: Eight}
    - {question: "What gas do plants take in from the air for photosynthesis?", options: [Oxygen, Nitrogen, Carbon dioxide, Helium], gold: Carbon dioxide}
    - {question: "How many days are in a leap year?", options: ["365", "364", "360", "366"], gold: "366"}
    - {question: "Which ocean is the largest?", options: [Pacific, Atlantic, Indian, Arctic], gold: Pacific}
    - {question: "How many minutes are in an hour?", options: ["100", "60", "30", "45"], gold: "60"}
    - {question: "What is the square root of 81?", options: ["8", "7", "18", "9"], gold: "9"}
    - {question: "What is the freezing point of water in degrees Fahrenheit?", options: ["0", "32", "100", "212"], gold: "32"}
    - {question: "Which metal is liquid at room temperature?", options: [Iron, Copper, Mercury, Tin], gold: Mercury}

# ---------------------------------------------------------------------------
# The intervention: an explicit "I don't know" option, analysis time only.
# No training, no prompt change beyond the added option line.
# ---------------------------------------------------------------------------
idk_option:
  text: "I don't know"          # exact option name; ASCII apostrophe U+0027
  description: ""               # empty: the engine renders "<marker>. I don't know"
  # Position control (PI decision 2026-10-05: ALL FIVE POSITIONS). Every
  # question is run 5 times, once with the IDK option at each canonical
  # position 0..4 (canonical order = rendered order at eval). The 4 original
  # options keep their dmcc relative order; the gold label index shifts by
  # one when the IDK position is at or before it. One engine run per
  # position per model, each over all 12,067 rows, so every run keeps dmcc's
  # exact FIT/CAL/TEST split. Unit of analysis = the question: its IDK rate
  # is the mean of its 5 pick-IDK indicators (gates.yaml).
  positions: [0, 1, 2, 3, 4]

