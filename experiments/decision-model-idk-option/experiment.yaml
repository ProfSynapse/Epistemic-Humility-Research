slug: decision-model-idk-option
title: 'Decision-model IDK option: with no further training, do decision models pick
  an explicit I don''t know when the base torso truly does not know?'
type: eval
status: draft
registered: true
created_at: '2026-10-05T23:06:58Z'
tier: 2
posture: exploratory
question: Given an explicit "I don't know" option added at analysis time, and with
  no further training, do the existing PopQA decision models (Qwen3.5-2B-Base torso,
  pointer PRIMARY, letter-logit SECONDARY) pick it on questions the base torso truly
  does not know (dmcc unknown and unrecognized in 0 of 4 multiple-choice orderings)
  and not on questions it knows (dmcc known), and does the option beat a calibrated-confidence
  threshold at a matched over-abstention rate?
prediction: 'On dmcc TEST, with the recognition instrument valid (known-row positive
  control >= 0.80, letter-format adherence >= 0.95), and each question run with the
  IDK option at all 5 positions (question IDK rate = mean of its 5 pick-IDK indicators;
  CIs by question-level cluster bootstrap): H1 mean question IDK rate on unknown-true
  >= 0.50; H2 mean question IDK rate on known <= 0.10; H3 at the CAL-fit matched question-level
  over-abstention rate, IDK recall minus threshold recall on unknown-true questions
  has a paired question-level bootstrap CI above 0; H4 (descriptive) question-level
  IDK rate and answer accuracy on known-recognized reported without a gate.'
falsifier: 'The selective-IDK-use line is falsified if H1 FAILS (cluster-bootstrap
  CI upper bound of the mean question IDK rate on unknown-true < 0.50) or H2 FAILS
  (CI lower bound of the mean question IDK rate on known > 0.10); the IDK-beats-threshold
  line is falsified if H3, adjudicable with matched operating points, is THRESHOLD_BETTER
  (paired CI upper bound < 0). A CI that contains its threshold (for H3, contains 0)
  is INCONCLUSIVE.'
text_capture: not-applicable
