# Gates for no-abstention-prompt-gated-replication.
# DRAFT: every numeric floor below is frozen at sign, computed from the parent
# Outcomes' with-prompt effect sizes (derivation recorded next to each value).
# Do not launch against draft values.
gates:
  G1_primary_qwen3_lift:
    metric: gated_minus_noop_wide_abstention_lift_heldout_confabs
    floor: FROZEN_AT_SIGN   # = 0.5 * with-prompt lift, from the parent Outcome
    ci_rule: wilson_95_ci_excludes_zero
  G2_cost_qwen3_dosed_rows_only:
    metric: gated_false_refusal_on_dosed_heldout_known_correct
    ceiling: FROZEN_AT_SIGN  # = 2x with-prompt cost, from the parent Outcome
    adjudicability_floor_n: FROZEN_AT_SIGN  # smallest N with wilson_ci(0,N).upper < ceiling
    below_floor_disposition: NOT-ADJUDICABLE
  G3_cross_family:
    metric: per_family_gated_minus_noop_lift_with_ci
    rule: per-family floor set at sign only where the parent Outcome gives a usable effect size; otherwise descriptive
  G4_sanity_random_direction:
    metric: single_seed_random_direction_lift
    rule: less than half the gated lift (qwen3-4b and llama only; sanity-tier)
