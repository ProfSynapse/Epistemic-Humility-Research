# GRPO three-seed confirmatory: clean SFT -> KTO -> GRPO (seed 3) full local run.
# Cloned from the seed-2 precedent
# (grpo_clean_sft_kto_grpo_seed2_full.yaml)
# per cell.yaml arms: clean_sft_kto_grpo, source merged(clean_sft_kto). Only
# seed-scoped fields changed:
#   1. model.model_name points at the seed-3 merged clean_sft_kto source
#      (schema_clean_sft_kto_seed3_full/20260805_195738/Qwen3-4B-clean-sft-kto/
#      merged-16bit), not seed-2.
#   2. training.output_dir points at the seed-3 output root.
#   3. lora.random_state: 3 mirrors seed, per the standing lead ruling
#      (applies to configs carrying lora.random_state directly: SFT/GRPO).
#   4. seed: 3.
# rewards.custom.file, dataset.local_file, and every other training/lora field
# are carried unchanged from the seed-2 file.
model:
  model_name: "/workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_kto_seed3_full/20260805_195738/Qwen3-4B-clean-sft-kto/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 3
  use_rslora: false
  use_dora: false

training:
  output_dir: "/workspace/repo/scratch/schema_response_confidence/runs/clean_sft_kto_grpo_seed3_full"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.1
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 500
  save_total_limit: 3
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/workspace/repo/scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: true
    module: null
    file: "/workspace/repo/archive/experiment/phase1/grpo/humility_reward_v2.py"
    functions:
      - name: "epistemic_humility_reward"
        weight: 1.0
        params: {}

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 3
