# experiments/grpo-three-seed-confirmatory/configs/eval_grpo3seed_response_confidence_selfaware_clean_sft_dpo_grpo_seed3_merged_smoke_local_4b.yaml
#
# G0 bounded_smoke_coverage check for seed-3 clean_sft_dpo_grpo (stage 3,
# stack 1), cloned from the seed-2 pair
# (eval_grpo3seed_response_confidence_selfaware_clean_sft_dpo_grpo_seed2_merged_smoke_local_4b.yaml)
# with only model_tag/model_name/results_dir changed to point at the newly
# merged seed-3 clean_sft_dpo_grpo checkpoint (run directory
# clean_sft_dpo_grpo_seed3_full/20260806_131028, the only run dir under this
# arm with a final_model; 20260806_111245, 20260806_111355, and 20260806_130902
# are dry-run/crashed-run leftovers with no final_model and must not be used).
# offset/limit/prompt/generation/vllm settings carried unchanged (cell.yaml
# smoke_population: selfaware-mixed-192). Evaluates the merged stack-1
# checkpoint directly (no adapter), same pattern as every prior merged-smoke
# sanity check in this chain.

model_tag: qwen3-4b-clean-sft-dpo-grpo-merged-seed3
model_name: /workspace/repo/scratch/schema_response_confidence/runs/clean_sft_dpo_grpo_seed3_full/20260806_131028/Qwen3-4B-clean-sft-dpo-grpo/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_grpo3seed_response_confidence_selfaware_clean_sft_dpo_grpo_seed3_merged_smoke_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_sft_dpo_grpo_merged_seed3_smoke
    method: clean_sft_dpo_grpo_merged
    model: qwen3-4b-clean-sft-dpo-grpo-merged-seed3

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
    offset: 2240
    limit: 192
