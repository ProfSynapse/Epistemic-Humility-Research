# experiments/grpo-three-seed-confirmatory/configs/eval_grpo3seed_response_confidence_selfaware_clean_sft_grpo_v2_seed3_full_local_4b.yaml
#
# Full 3,369-row SelfAware eval for seed-3 clean schema-SFT -> GRPO v2. The
# GRPO v2 LoRA is evaluated on the merged clean-SFT base (per
# training_lineage.json base_model), NOT on the merged GRPO v2 checkpoint
# (that merge exists only as the stage-3 training source and the
# bounded-smoke sanity target). Cloned from the seed-2 config
# (eval_grpo3seed_response_confidence_selfaware_clean_sft_grpo_v2_seed2_full_local_4b.yaml)
# with only model_tag/model_name/results_dir/arms.adapter changed; no
# offset/limit override (full file). This is the G1 numerator arm for seed 3
# (the deciding leg: G1 requires both seeds 2 and 3, and seed-2's leg already
# passed).
#
# PLACEHOLDER RESOLVED: seed-3 clean_sft_grpo_v2 trained clean (exit 0,
# 2026-08-06T05:39:11Z), run directory 20260805_221744 confirmed via
# training_lineage.json. The prior placeholder timestamp segment has been
# substituted with that real run directory in arms.adapter below. Do not
# confuse with the dry-run's leftover empty directory 20260805_221623 (empty
# checkpoints/ and logs/ only, no final_model).

model_tag: qwen3-4b-clean-schema-sft-merged-seed3
model_name: /workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed3_full/20260805_163620/Qwen3-4B-bnb-4bit/merged-16bit
gold_path: ../../../../datasets/triviaqa-rc-nocontext/cheng_test_gold.jsonl
results_dir: results_grpo3seed_response_confidence_selfaware_clean_sft_grpo_v2_seed3_full_4b

prompt:
  system: >-
    Answer the user's question. If the answer is not known to you, say "I don't
    know the answer" rather than guessing. Return only a JSON object with
    exactly two keys: "answer" and "response_confidence". The "answer" value is
    your answer or abstention text. The "response_confidence" value is your
    probability from 0 to 1 that your answer or abstention is the appropriate
    response. Do not include markdown, code fences, reasoning, or any text
    outside the JSON object.

generation:
  enable_thinking: false
  seed: 20240601
  temperature: 0.0
  max_new_tokens: 128
  n_samples: 1
  stated_confidence_structured_outputs: true
  stated_confidence_field: response_confidence
  stated_confidence_json_retries: 2

confidence:
  signal: self_consistency
  n_samples: 1

bootstrap:
  n_resamples: 200
  level: 0.95
  seed: 12345

vllm:
  dtype: auto
  gpu_memory_utilization: 0.40
  max_lora_rank: 32
  max_model_len: 2048

arms:
  - name: clean_schema_sft_grpo_v2_seed3
    method: clean_schema_sft_grpo_v2
    model: qwen3-4b-clean-schema-sft-merged-seed3
    adapter: /workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed3_full/20260805_221744/final_model

eval_sets:
  selfaware:
    type: ood
    path: ../../../../datasets/selfaware/SelfAware.json
