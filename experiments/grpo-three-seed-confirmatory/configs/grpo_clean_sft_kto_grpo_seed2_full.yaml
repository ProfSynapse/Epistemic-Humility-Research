# GRPO three-seed confirmatory: clean SFT -> KTO -> GRPO (seed 2) full local run.
# Cloned from the seed-1 precedent
# (archive/experiment/phase1/grpo/configs/grpo_clean_sft_kto_grpo_seed1_full.yaml)
# per cell.yaml arms: clean_sft_kto_grpo, source merged(clean_sft_kto).
# Same two corrections as the seed-2 grpo_v2 config:
#   1. model.model_name points at the seed-2 merged clean_sft_kto source.
#   2. rewards.custom.file corrected from the stale pre-archive-move relative
#      path to the actual current location of the same unmodified reward file
#      (absolute container path, for unambiguity).
# lora.random_state: 2 mirrors seed, per the standing lead ruling.
model:
  model_name: "/workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_kto_seed2_full/20260801_213332/Qwen3-4B-clean-sft-kto/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 2
  use_rslora: false
  use_dora: false

training:
  output_dir: "/workspace/repo/scratch/schema_response_confidence/runs/clean_sft_kto_grpo_seed2_full"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.1
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 500
  save_total_limit: 3
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/workspace/repo/scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: true
    module: null
    file: "/workspace/repo/archive/experiment/phase1/grpo/humility_reward_v2.py"
    functions:
      - name: "epistemic_humility_reward"
        weight: 1.0
        params: {}

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 2
