# GRPO three-seed confirmatory: clean schema-SFT-merged (seed 2) -> GRPO v2 full local run.
# Cloned from the seed-1 precedent
# (archive/experiment/phase1/grpo/configs/grpo_schema_clean_sft_merged_seed1_v2_full.yaml)
# per cell.yaml arms: clean_sft_grpo_v2 (per_device_train_batch_size 32,
# num_generations 4, reward_variant v2). Two changes from the seed-1 file beyond
# seed threading:
#   1. model.model_name points at the seed-2 merged clean_sft source, not seed-1.
#   2. rewards.custom.file is corrected from the seed-1 file's stale
#      pre-archive-move relative path ("../../../experiment/phase1/grpo/
#      humility_reward_v2.py", which resolves to a nonexistent
#      <repo>/experiment/... path after the archive/ move and would raise
#      "No reward components loaded" at trainer startup) to the actual current
#      location of the same unmodified reward file, as an absolute container
#      path for unambiguity. No reward logic changed.
# lora.random_state: 2 mirrors seed, per the lead ruling in NOTEBOOK.md
# (2026-07-31 "lora.random_state mirrors the seed number").
model:
  model_name: "/workspace/repo/scratch/schema_response_confidence/runs/sft_schema_clean_seed2_full/20260731_232307/Qwen3-4B-bnb-4bit/merged-16bit"
  lora_path: null
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  chat_template: "native"

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"
  random_state: 2
  use_rslora: false
  use_dora: false

training:
  output_dir: "/workspace/repo/scratch/schema_response_confidence/runs/schema_clean_sft_grpo_v2_seed2_full"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 512
  max_completion_length: 128
  temperature: 1.35
  learning_rate: 5.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  num_train_epochs: 1
  max_steps: 0
  beta: 0.1
  fp16: false
  bf16: true
  optim: "adamw_8bit"
  logging_steps: 25
  save_steps: 500
  save_total_limit: 3
  report_to: "none"
  use_gspo: false
  chat_template_kwargs:
    enable_thinking: false
  extra_args:
    top_p: 1.0
    top_k: 0
    min_p: 0.0

dataset:
  dataset_name: null
  dataset_file: null
  local_file: "/workspace/repo/scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl"
  num_proc: 1
  prompt_column: "prompt"

schema:
  tool_schema_path: null

rewards:
  items: []
  custom:
    enabled: true
    module: null
    file: "/workspace/repo/archive/experiment/phase1/grpo/humility_reward_v2.py"
    functions:
      - name: "epistemic_humility_reward"
        weight: 1.0
        params: {}

wandb:
  enabled: false
  project: null
  run_name: null
  entity: null

seed: 2
