slug: flavor-atlas-gemma-pt-confirmatory
title: 'Second-substrate confirmatory: overt-unanswerability flavor separation on
  pretrain-only Gemma'
type: probe-fit
status: signed
registered: true
created_at: '2026-08-10T14:35:09Z'
tier: 3
posture: exploratory
question: Does the overt-unanswerability flavor separation and the overt-vs-covert
  boundary that flavor-atlas-rawbase found on unsloth/Qwen3-4B raw base replicate
  on a second, fresh substrate -- google/gemma-4-E4B pretrain-only base -- using the
  same panels and probe protocol?
prediction: 'P1 (Clause A, primary): all six KUQ flavors reach held-out out-of-fold
  AUROC >= 0.90 at hidden state 24 AND under the nested split-half selection leg,
  for all twelve primary cells. P2 (Clause B, primary): AmbigQA stays <= 0.75 at every
  one of the 43 hidden states. P3 (transfer, primary): every off-diagonal transfer-matrix
  cell among the six KUQ flavors and SelfAware reads >= 0.75, and every cell involving
  AmbigQA reads <= 0.75. P4 (style control, secondary, banded): after cross-fitted
  surface residualization, all six flavors retain AUROC >= 0.90 at both legs. P5 (reference):
  SelfAware reaches >= 0.90 at both legs.'
falsifier: 'F1 (Clause A does not replicate): with GG0-GG4 passing, any one of the
  twelve primary cells reads below 0.90. F2 (Clause B does not replicate): with GG0-GG4
  passing, AmbigQA reaches >= 0.90 at any hidden state. F3 (style artifact): with
  the residualization controls passing, all six flavors fall to <= 0.75 at both legs
  after residualization. F4 (transfer does not replicate): any off-diagonal cell among
  the six flavors and SelfAware reads below 0.75.'
