slug: j-space-cross-family-layer-contrast
type: steer-cell
status: draft
registered: true
question: Does the J-space mid-band write-site advantage found on raw-base Qwen3-4B
  (calibrated mid-band gated caution snap beats a late-layer site on held-out confab
  clean_tighten at matched selectivity cost) transfer across model families, or is
  it Qwen3-4B-specific?
prediction: For at least 3 of the 4 families that run past G0, that family's own
  best calibrated mid-band write site will beat that family's own calibrated late-reference
  site by at least 10 percentage points on held-out confab clean_tighten, without
  increasing known-correct false-refusal cost by more than 2 percentage points.
falsifier: If at most 1 of the 4 (or of however many run past G0) families passes
  G1 AND G2, the mid-band write-site advantage is Qwen-specific or an artifact -
  FALSIFIED. If exactly 2 of 4 pass, the result is MIXED and no claim is promoted.
checkpoint:
  repo: cross-family (4 checkpoints; see families/*.yaml and AMENDMENT.md "Family table")
  revision: raw-base bf16 instruct, no adapter, no 4-bit quantization, no task training,
