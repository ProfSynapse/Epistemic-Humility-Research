slug: j-space-cross-family-layer-contrast
type: steer-cell
status: draft
registered: true
question: Does useful, selective J-space mid-band actuation (calibrated mid-band
  gated caution snap achieving held-out confab clean_tighten above a floor at low
  known-correct cost) generalize across model families, or is it specific to Qwen3
  lineage?
prediction: For at least 3 of the families that run past G0, that family's own best
  calibrated mid-band write site clears BOTH primary gates on held-out -- confab
  clean_tighten at or above the G1 floor (PROPOSED >=0.50, Wilson lower >0.40) AND
  known-correct not_well_formed_correct cost at or below the G2 cap (PROPOSED <=0.05,
  Wilson upper <0.10). The frozen late-reference arm is a non-gating descriptive
  comparator, expected weak or dead per doubt-snap-cross-family-confirmatory.
falsifier: If at most 1 of the families that run past G0 clears both primary gates,
  mid-band actuation is Qwen-lineage-specific or an artifact - FALSIFIED. If exactly
  2 clear both, the result is MIXED and no claim is promoted.
checkpoint:
  repo: cross-family (4 checkpoints; see families/*.yaml and AMENDMENT.md "Family table")
  revision: raw-base bf16 instruct, no adapter, no 4-bit quantization, no task training,
    per family
