slug: j-space-cross-family-layer-contrast
type: steer-cell
status: draft
registered: true
question: Does useful, selective J-space mid-band actuation (calibrated mid-band
  gated caution snap achieving held-out confab clean_tighten above a floor at low
  known-correct cost) generalize across model families, or is it specific to Qwen3
  lineage?
prediction: For at least 3 of the families that run past G0, that family's own best
  calibrated mid-band write site clears BOTH primary gates on held-out -- confab
  clean_tighten at or above the G1 floor (>=0.50, Wilson lower >0.40) AND
  known-correct not_well_formed_correct cost at or below the G2 cap (<=0.05,
  Wilson upper <0.10; both adjudicated lead+user 2026-07-23). The frozen
  late-reference arm is a non-gating descriptive
  comparator, expected weak or dead per doubt-snap-cross-family-confirmatory.
falsifier: If at most 1 of the families that run past G0 clears both primary gates,
  mid-band actuation is Qwen-lineage-specific or an artifact - FALSIFIED. If exactly
  2 clear both, the result is MIXED and no claim is promoted.
checkpoint:
  repo: cross-family (4 checkpoints; see families/*.yaml and AMENDMENT.md "Family table")
  revision: raw-base bf16 instruct, no adapter, no 4-bit quantization, no task training,
    per family
instrument:
  configs:
  - cell.yaml
  - gates.yaml
  - families/llama-3.2-3b.yaml
  - families/mistral-7b-v03.yaml
  - families/qwen35-4b.yaml
  - families/gemma4-e4b.yaml
  modules:
  - family_config.py
  - model_lib.py
  - gen_lib.py
  - grader.py
  - scorers.py
  - materialize_reused_rows.py
  - mine_eval_pool.py
  - split_fit_heldout.py
  - jlens_profile.py
  - extract_anchor.py
  - build_directions.py
  - gate_fit.py
  - calibrate_dose.py
  - pipeline.py
  - run_contrast.py
  - cross_family_rollup.py
  persistence:
    # <family> is a per-family path segment (families run one at a time); the
    # checkpoint_path shows the convention, the real path substitutes the slug.
    # Kill-resume drill: extract_anchor.py and calibrate_dose.py flush+resume
    # were CPU-tested with a mocked model this session (partial->resume skips
    # done work, full-resume loads no model, --fresh restarts); run_contrast.py
    # rides the tuner RunLog; the rest are per-item/per-layer writers or timed
    # short single-shots. short-run seconds are freshly measured smokes.
    #
    # Import-only libraries (never run standalone; no run loop): timed by their
    # cold import / self-check smoke.
    family_config.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.023
    model_lib.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 1.196
    gen_lib.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.826
    grader.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.023
    scorers.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.022
    pipeline.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 1.236
    # CPU single-shot writers: buffer in memory, write once, but finish in well
    # under a second at representative sizes -- losing the whole run to a kill is
    # an acceptable risk (measured this session).
    materialize_reused_rows.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.07
    split_fit_heldout.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.005
    gate_fit.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.523
    cross_family_rollup.py:
      persistence: short-run
      measured_smoke_wall_clock_s: 0.001
    # GPU-long / per-item / per-layer writers: incremental, resumable from their
    # own on-disk checkpoint (never declared short-run to dodge the gate).
    mine_eval_pool.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis/<family>/pool_generations.jsonl
    extract_anchor.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis/<family>/anchor_extract.safetensors
    calibrate_dose.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis/<family>/runlog/calibrate_dose_records.jsonl
    run_contrast.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis/<family>/runlog/<mode>/<layer>.jsonl
    jlens_profile.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis-committed/<family>/layer_profile.json
    build_directions.py:
      persistence: incremental
      checkpoint_path: experiments/j-space-cross-family-layer-contrast/analysis-committed/<family>/layers/
  pins: {}
inputs:
