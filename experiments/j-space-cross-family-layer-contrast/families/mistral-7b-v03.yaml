# Family config: Mistral 7B Instruct v0.3. DRAFT until `bin/exp sign`.
#
# SUBSTITUTION NOTE (pre-outcome, inherited from doubt-snap-cross-family):
# Amendment Z's original Mistral-family pick was
# mistralai/Ministral-3-3B-Instruct-2512. Amendment Z only READ activations,
# so that checkpoint was eligible there. The doubt-snap-cross-family
# confirmatory (experiments/doubt-snap-cross-family-confirmatory/AMENDMENT.md,
# "Pre-outcome loader-eligibility note") discovered before any Mistral-family
# behavioral outcome that Ministral-3 exposes Mistral3ForConditionalGeneration,
# not a causal-LM substrate for the registered raw-text activation WRITE path,
# and replaced it with the pinned causal-LM mistralai/Mistral-7B-Instruct-v0.3.
# This experiment also writes activations, so it inherits that substitution
# for the same reason, made here before any Mistral-family run.

family: mistral-7b-v03
risk_order: 2

checkpoint:
  repo: mistralai/Mistral-7B-Instruct-v0.3
  fallback_repo: null
  revision: raw instruct checkpoint (Apache-2.0, ungated, no adapter, no 4-bit quantization)
  scale_params_b: 7
  hf_token_required: false

loader:
  model_classes: [AutoModelForCausalLM]
  hidden_size_field: hidden_size
  num_layers_field: num_hidden_layers
  nested_text_config: false
  dtype: bf16
  notes: >-
    Plain MistralForCausalLM, text-only, bf16-native weights; none of
    Ministral-3's FP8 dtype-load risk and none of the conditional-generation
    wrapper problem. This is the same pinned checkpoint the running
    doubt-snap-cross-family confirmatory uses for its Mistral small-tier
    cell, so its loader behavior will have been exercised there first.

render:
  fn: "backends:render_probe_prompt"
  enable_thinking_equivalent: >-
    Mistral has no native thinking-toggle kwarg; enable_thinking=False is a
    no-op tried first by render_probe_prompt's mode-discovery loop.
  system_prompt_source: >-
    Same baseline system prompt string as the Qwen3-4B AH-A0 arm, reused
    verbatim (see llama-3.2-3b.yaml's identical note).

eos:
  include_tokenizer_eos: true
  additional_end_of_turn_tokens: []
  notes: >-
    Mistral instruct chat templates typically rely on the tokenizer's own
    eos_token_id for turn end (no separate named end-of-turn token analogous
    to Llama's <|eot_id|> or Qwen's <|im_end|>); confirm against the actual
    tokenizer's special_tokens_map at extraction time rather than assuming
    this list is complete.

band_selection:
  status: not_yet_run
  method: >-
    Same j-lens layer_profile() method as llama-3.2-3b.yaml: midband
    candidates = effective-dim peak layer + adjacent profiled layers; late
    reference = the depth-fraction analog of Qwen3-4B's hs34
    (34/36 = 0.9444). This family's own n_hidden_layers determines its own
    absolute layer indices; hs23-29 does NOT transfer by assumption.
  n_hidden_layers: null
  late_reference_depth_fraction_target: 0.9444
  late_reference_hs_estimate: "not yet resolved (config unread); resolve at profile time, not by assumption"
  midband_candidates_hs: null
  late_reference_hs: null
  effective_dim_peak_hs: null

doses:
  status: not_yet_calibrated
  ladder: [25, 50, 75, 100, 125, 150, 175, 200]
  selected: {}

g3_late_reference_floor:
  clean_tighten_rate_floor: 0.40
  wilson_lower_ci_floor: 0.30
  note: >-
    Same lowered floor as llama-3.2-3b.yaml; flagged to the lead, not
    re-derived here.

vram:
  bf16_weights_estimate_gb: "~14-15GB at 7B params"
  feasibility_note: >-
    Fits a single RTX 3090 (24GB) for generation and anchor extraction, but
    with less headroom than the 3-4B families. The J-lens layer_profile's
    eager-attention double-backward is the pressure point at 7B: budget for
    reduced batch or reduced n_random_dirs, and treat a profile-stage OOM as
    a batching problem to solve, not a G0 loader blocker.
