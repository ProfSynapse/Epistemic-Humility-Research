vram:
  bf16_weights_estimate_gb: ~14-15GB at 7B params
  feasibility_note: 'Fits a single RTX 3090 (24GB) for generation and anchor extraction, but
    with less headroom than the 3-4B families. The J-lens layer_profile''s eager-attention
    double-backward is the pressure point at 7B: budget for reduced batch or reduced n_random_dirs,
    and treat a profile-stage OOM as a batching problem to solve, not a G0 loader blocker.'
