    artifacts:
      split_manifest: {path: split_manifest.json, sha256: 2f622f5abe110349216207424bdbd919775e93f6d92f334b99f6424505f21e5c}
      build_manifest: {path: build_manifest.json, sha256: 8954b8263019ae415692d84ea87c42d7dd851f9d22d222df1e3e8196e3508e63}
      c_hat: {path: c_hat.json, sha256: fe6baf61e58635d4f2c4db68d04be3ce2378954a892da4652cd9397f4d5b3795}
      u_d: {path: u_d.json, sha256: aa4b63e2dde99b6282207e8974ee6ea34881162e126aea61fdf4b4ea0e358580}
      random_direction: {path: random_direction.json, sha256: 02d72ba87c45065b8546ac6ce526c9d7bdcf6a84301dd82cf3edc00591c51604}
      gate_fit: {path: gate_fit.json, sha256: a34bd876028aded806a8a5f5f90c99871932dd545c2afa23ea2bdea2c67ad3d3}
