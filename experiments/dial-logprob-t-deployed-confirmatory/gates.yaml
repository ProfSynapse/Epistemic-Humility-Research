# dial-logprob-t-deployed-confirmatory (LP-T) gates, fixed before launch.
# Transcribed verbatim from AMENDMENT.md "Gates" and "Falsifier". LT-G0 is
# v3's LP3-G0 (integrity precondition) with the sanity bound applied to this
# cell's own (T) arm; LT-G1 (the primary), its floor, its ambiguous_band, and
# the dial-novelty falsifier transfer byte-identical in structure from
# v1/v2/v3 (experiments/dial-logprob-baseline-v3/gates.yaml).

gates:
  - id: LT-G0
    kind: integrity-precondition
    stop: pre-outcome
    criteria:
      - "(a) capture integrity: for every row, the answer text decoded from the captured vLLM (or teacher-forced fallback) token IDs is the SAME object scored and logprob'd, and (when the HF fallback path runs) the teacher-forced extraction pass consumed EXACTLY those IDs (prompt + generated, verbatim) -- asserted per row; any divergence is a harness bug and a stop, never a tolerance-adjusted pass"
      - "(b) coverage: every prompt attempted from the arm's source inventory (the amendment_s_correctness_probe_extract.build_pool population, imported unchanged) receives a recorded disposition (answered / refused / empty) in the runlog; none silently dropped"
      - "(c) power floor, pre-stated: at least 1,000 answered (label in {correct, wrong}) rows, else the arm records a data-stage stop -- floor unchanged from v3's LP3-G0(c); the CAP moved (4,000 -> 12,000 attempts), not the floor"
      - "(d) instrument sanity, pre-stated: the fresh T-arm dial OOF AUROC is at least 0.75, else the cell records instrument-void -- v2's unblinded T refit read 0.8164; 0.75 is a sanity bound on whether the dial reads at all on fresh data, not a reproduction target"
    power_floor_n: 1000
    instrument_sanity_auroc_min: 0.75
  - id: LT-G1
    kind: primary
    arm: t_deployed_confirmatory
    criterion: dial AUROC minus primary-logprob AUROC >= +0.05, paired bootstrap 95% CI excluding 0
    floor: 0.05
    floor_justification: verbatim from v1/v2/v3 (matches the S/T self-eval-gain convention)
    ambiguous_band: 0 < margin < +0.05 or CI straddling 0 -> reported as small/uncertain margin; gate never retuned after result
falsifier: primary-variant logprob AUROC >= dial AUROC on t_deployed_confirmatory with paired 95% CI excluding 0 in that direction
lt_g0_falsifier: the instrument fails its own LT-G0 integrity gate -- reported straight as a design-diagnosis signal, not retried
n_boot_paired: 2000
seed: 20260813
