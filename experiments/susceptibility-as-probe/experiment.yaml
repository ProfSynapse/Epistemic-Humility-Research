question: >-
  At the qwen mid-band operating point, does the susceptibility channel (the
  per-row commitment margin measured by M1) carry epistemic information that
  the frozen readout channel (the hs20 c_hat projection) misses, or are the
  two channels redundant views of one latent variable (framework Claim 3)?
prediction: >-
  The cross-fitted readout-plus-margin combination beats the readout alone by
  at least the registered incremental-AUROC floor, and both internal channels
  beat verbalized confidence.
falsifier: >-
  Incremental AUROC of readout-plus-margin over readout alone below the
  registered floor (redundancy); or verbalized confidence matching or beating
  both internal channels; or the readout sanity floor failing (instrument
  void, no claim evaluated).
