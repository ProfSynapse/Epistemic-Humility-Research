population:
  full_fit_splits: [fit, fit_only]
  roles: [confab, known_correct_answered, unknown_refused]
  infer_source_from_row_key: true

surface_covariates:
  scalar:
    - rendered_prompt_token_count
    - question_character_count
    - question_whitespace_word_count
    - question_line_count
    - digit_count
    - digit_fraction
    - punctuation_count
    - punctuation_fraction
    - newline_count
    - newline_fraction
    - uppercase_count
    - uppercase_fraction
  categorical: [render_template_id, source, category]
  lexical:
    input: question_text_only
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
    word_hash_features: 4096
    char_hash_features: 4096
    word_svd_components: 32
    char_svd_components: 32
    alternate_sign: false
    sublinear_tf: true
  prohibited_inputs:
    - role
    - completion_length
    - model_output_length
    - answer_correctness
    - reference_answer_length
    - alias_length
    - answer_text
    - aliases
    - baseline_behavior
    - generated_text

residualization:
  outer_folds: 5
  inner_folds: 3
  alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  alpha_metric: activation_mse
  variants: [low_dimensional, lexical, combined, surface_explained]
  primary_variant: combined

treatment_strength:
  layer_range: non_embedding_early_exterior
  min_observed_max_activation_oof_r2: 0.01
  permutation_null_quantile: 0.95
  min_above_permutation_quantile: 0.005

planted_signal:
  hs_index: 2
  alpha_grid: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  projection_seed: 20260722
  scale: target_layer_centered_activation_rms
  min_peak_to_runner_up_ratio: 1.05
  max_controlled_normalized_profile_deviation: 0.05

permutation_control:
  n_permutations: 20
  seed_start: 20260800
  strata: [source, role]
  min_early_exterior: 18
  max_median_abs_peak_shift_hs: 1

subsample_guard:
  fraction: 0.50
  seed: 20260723
  strata: [source, role]

peak_location:
  depth_formula: hs_index / (n_hidden_states - 1)
  early_exterior_max_depth: 0.20
  margin_is_decisive: false

data_exhaust:
  private_fit_manifest: analysis/exhaust/<model_id>/fit_rows_private.jsonl
  surface_matrices: analysis/exhaust/<model_id>/surface_matrices.npz
  oof_prediction_checkpoints: analysis/checkpoints/<model_id>/<surface_block>/hs<index>.npz
  aggregate_oof_prediction_content_digest: true
  reconstruction: source_activation_minus_oof_prediction
  commit_policy: aggregate_hashes_shapes_and_profiles_only

execution:
  runner: reanalyze_surface_residualization.py
  output_root: experiments/family-atlas-surface-residualization-control/analysis
  aggregate_filename: aggregate_results.json
  checkpoint_dir: checkpoints
  long_run_launcher: experiments/common/launch_detached.sh
  output_policy: aggregate_allowlist_only
  preprocessing_scope: prompt_only_transductive_basis_activation_mapping_out_of_fold
