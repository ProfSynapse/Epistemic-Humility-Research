# AO -- propensity-regulated caution. DRAFT, NOT a registered instrument until
# `bin/exp sign` (see AMENDMENT.md; status: draft). This file expresses the
# AMENDMENT's Design / STAGE 2 mechanism against the tuner's generic
# continuous-per-row-gain-arm feature (synaptic-tuner PR
# feat/proportional-gain-arm: ArmConfig.gain_field / gain_clip / force_active,
# MechInterp/cell.py, MechInterp/intervention/hooks.py; submodule pinned at
# 294a653). AC used the FROZEN legacy phase3 machinery for the analogous
# doubt-coupling cell; this is that same erase-write-couple idea re-homed on
# the generic tuner schema, not a rerun of AC.
#
# STAGE 0 PREP DONE (CPU-only, this session; see
# experiments/ao-propensity-regulated-caution/analysis/amendment_ao_prep/
# prep_manifest.json for exact provenance -- gitignored, not committed):
#   - staged copies of d_raw.npy (confab-propensity direction, L24) and
#     caution_perp_direction_L35_ai_true.json (Stage-1 candidate #1, AN's
#     doubt-orthogonalized refit) via stage_directions.py.
#   - fit a Stage-1 candidate #2 (fallback lever): the plain mass-mean
#     answer-vs-refuse direction at L35, NOT doubt-orthogonalized, via
#     fit_fallback_direction.py -> fallback_mass_mean_direction_L35_ai_true.json.
#   - built prop_z_gain_map_rows.jsonl (320 rows: 116 confab + 114
#     answerable_refused + 90 known_correct_answered, counts verified against
#     per_row_exhaust.jsonl) via build_rows_pool.py: prop_z = z-score(L24
#     pre-gen activation . unit(d_raw)) over exactly these 320 rows. Verified
#     containment-clean (no FalseQA; all 7 source tags are KUQ/SelfAware/
#     TriviaQA/PopQA -- see that script's docstring).
#   - ported a real grader into ao_grader.py (see that module's docstring).
#
# STAGE 1 REMAINING (GPU, NOT done by this file): knob-validation (AMENDMENT
# G0) -- apply AC's constant writes (ablate, fixed +/- gain) with EACH Stage-1
# candidate direction and measure whether refuse/answer behavior moves with
# specificity on THIS checkpoint. Whichever candidate (if any) G0 validates is
# the one `readouts:` below should point at; it need not be caution_perp_ai_true
# (the wiring below is a starting point, not a foregone conclusion -- see
# AMENDMENT.md STAGE 1). Only after G0 passes does this cell (Stage 2) run.
#
# Validate parsing (CPU, no GPU):
#   cd synaptic-tuner && python -c "from MechInterp.config import load_steer_config; \
#     load_steer_config('../experiments/ao-propensity-regulated-caution/cell.yaml'); print('cell ok')"

# 1. surface: where rows come from + the reproducibility contract.
surface:
  # Built by build_rows_pool.py (Stage-0, this session); 320 rows, three
  # cells (confab=116, answerable_refused=114, known_correct_answered=90),
  # each carrying the standardized prop_z field. Gitignored (analysis/), not
  # committed -- rebuild with the script named above before a real run.
  rows_path: experiments/ao-propensity-regulated-caution/analysis/amendment_ao_prep/prop_z_gain_map_rows.jsonl
  seed: 20260706
  generation:
    max_new_tokens: 96
    do_sample: false
  # expected_config_sha is filled AFTER the smoke run and pinned in the
  # amendment doc at `exp sign`.
  # expected_config_sha: <sha256-of-this-file-at-signing>

# 2. readouts: the Stage-1 candidate caution direction (mechinterp-direction/v1).
readouts:
  # Stage-1 candidate #1 (AN's doubt-orthogonalized caution refit on AI-TRUE),
  # staged locally by stage_directions.py. NOT yet validated as a behavioral
  # lever on this checkpoint -- that is the GPU Stage-1 knob-validation screen
  # (AMENDMENT G0), still to run. A second candidate (the un-orthogonalized
  # mass-mean answer-vs-refuse contrast) is staged alongside it at
  # analysis/amendment_ao_prep/fallback_mass_mean_direction_L35_ai_true.json;
  # if G0 prefers it instead, point this readout there and re-smoke.
  - name: caution_perp_ai_true
    path: experiments/ao-propensity-regulated-caution/analysis/amendment_ao_prep/caution_perp_direction_L35_ai_true.json

# 3. law: erase_write along the Stage-1 direction, written at every generated
#    position (the AC/AO couple mechanism), matching the example-cell's
#    AN-style gen_stream convention.
law:
  kind: erase_write
  readout: caution_perp_ai_true
  position: answer_window   # only the generated tokens (window_start set upstream)
  generation_mode: gen_stream

# 4. arms: baseline no-op / coupled continuous gain / permuted-gain placebo /
#    ablate (couple with g==0, applied not skipped). One pre-registered
#    configuration per the AMENDMENT -- no alpha sweep, no coupling-form
#    fishing.
arms:
  - name: baseline
    strength: 0.0

  - name: coupled
    strength: 1.0            # alpha, pre-registered (AMENDMENT STAGE 2)
    gain_field: prop_z        # g_i = alpha * prop_z_i, standardized confab-propensity
    gain_clip: 2.0            # clipped to [-2, +2]

  - name: permuted
    strength: 1.0
    permuted_control_of: coupled
    # PLACEHOLDER seed -- pin the real value at `exp sign`. Shuffles the
    # coupled arm's per-row prop_z-derived gains across the same row
    # population (identical distribution, scrambled pairing): the placebo the
    # AMENDMENT's Gates section calls "same gain distribution with the signal
    # scrambled".
    control_seed: 20260706

  - name: ablate
    strength: 0.0
    # force_active: apply erase_write with a ZERO setpoint (erase the
    # projection, write nothing back) rather than a true no-op. This is the
    # "couple with g==0" constant comparison nested inside the coupling
    # family per the AMENDMENT's Design section -- distinct from "baseline",
    # which never touches the residual stream.
    force_active: true

# 5. execution: per-row output JSONL (untracked) + the project grader.
execution:
  output_path: experiments/ao-propensity-regulated-caution/analysis/rows_out.jsonl
  resume: true
  # Ported from steering_common.py (see ao_grader.py's module docstring for
  # the exact port + the cross-arm baseline-join mechanism it implements).
  # Resolved via importlib against sys.path:
  #   PYTHONPATH=experiments/ao-propensity-regulated-caution
  grader: ao_grader:grade

# 6. smoke: readback tolerances that gate the full arms. n_rows=25 matches the
#    AMENDMENT's pre-full-run smoke gate (25 rows/cell x 4 arms = 300 units;
#    the cell-count multiplication happens across the 3 cells in the rows
#    pool, this n_rows is per the smoke helper's flat row slice).
smoke:
  n_rows: 25
  write_rel_tol: 0.05
  write_abs_floor: 0.5
  offtarget_tol: 0.001
