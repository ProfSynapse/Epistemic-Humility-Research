# AO -- Stage 1, knob-validation. DRAFT, NOT a registered instrument until
# `bin/exp sign` (see AMENDMENT.md). Implements AMENDMENT.md's Gates section,
# G0 (Stage 1, precondition, pass/fail):
#
#   "at least one caution direction moves the refusal rate on this checkpoint
#   by a margin whose bootstrap CI excludes 0, with specificity intact
#   (correct-answered refusal rise <= 5pt)."
#
# The build task's instructions additionally named a correctness-drop <= 3pt
# specificity leg (the B1/AC convention, broader than the AMENDMENT's own G0
# sentence, which names only refusal rise) -- both are encoded below; flagged
# for the lead since the AMENDMENT text itself does not state the
# correctness-drop leg for G0 (it does for Stage 2's G2).
#
# CELL-NAME MAPPING: "known_refused" in B1/AC terminology (should answer,
# currently refuses) is this pool's "answerable_refused" cell -- confirmed by
# both candidate directions' own fit metadata (pos_cell=known_refused, n=114,
# matching answerable_refused's row count exactly in
# prop_z_gain_map_rows.jsonl). See cell_stage1_caution_perp.yaml's header for
# the full argument.
#
# ONE GATES FILE, TWO INVOCATIONS: each cell_stage1_*.yaml steers along exactly
# one candidate direction (the tuner's SteerCellConfig has one law.readout per
# file), so "ablate"/"shift_down" mean different underlying directions
# depending on WHICH cell's output you score. Run this SAME file twice, once
# per candidate's output:
#
#   cd synaptic-tuner && python3 tuner.py mechinterp score-gates \
#     --gates-config ../experiments/ao-propensity-regulated-caution/gates_stage1.yaml \
#     --rows-path ../experiments/ao-propensity-regulated-caution/analysis/rows_out_stage1_caution_perp.jsonl
#   cd synaptic-tuner && python3 tuner.py mechinterp score-gates \
#     --gates-config ../experiments/ao-propensity-regulated-caution/gates_stage1.yaml \
#     --rows-path ../experiments/ao-propensity-regulated-caution/analysis/rows_out_stage1_fallback_mass_mean.jsonl
#
# G0 ADJUDICATION (read by hand -- see "NOT an OR" note below): G0 PASSES iff,
# in AT LEAST ONE of the two invocations above, EITHER
#   (g0_ablate_movement AND g0_ablate_specificity_refusal_rise AND
#    g0_ablate_specificity_correctness_drop)
# is all-true, OR the same trio with shift_down in place of ablate is
# all-true. shift_up is intentionally NOT gated (see below); it is descriptive
# only, mirroring the AMENDMENT's own convention for AC-G2-style estimate-only
# comparisons (Stage 2's gates.yaml: "NOT gated here... no pass/fail").
#
# NOT AN OR -- the evaluator's own `overall_pass` (AND across every gate
# declared in ONE invocation) is NOT the G0 verdict. It is a stricter
# diagnostic ceiling (would require BOTH ablate and shift_down to pass at once
# on the SAME direction) -- read the six individual gate results below by hand
# per the adjudication rule above.
#
# WHY ablate + shift_down ONLY (not shift_up): refined B1's own headline
# result was the DE-REFUSAL direction (ablate 0.994 -> 0.524 on known_refused,
# specificity held on known_correct_answered); shift_plus2 there INDUCED new
# refusals, which is the opposite movement and is not a "does over-refusal
# have a lever" test -- it is closer to a specificity STRESS test on
# known_correct_answered itself (a blanket constant write with no per-row
# targeting will tend to move that population's refusal rate too, by the
# same undifferentiated mechanism, unlike Stage 2's row-conditioned coupling).
# Reported descriptively (rows_out_stage1_*.jsonl carries shift_up rows same
# as any other arm; score with a follow-up read, not gated here).
#
# ============================================================================
# PRE-STATED G0 EFFECT-SIZE FLOOR FORMULA (fill in from the Stage-1 pilot,
# BEFORE adjudicating the full Stage-1 run or unlocking Stage 2 -- this is the
# "exact effect-size floor locks from a Stage-1 pilot via a pre-stated formula
# before the Stage-2 readout" the AMENDMENT's Gates section names). NOT a
# post-hoc pick: the formula is written here now, before any pilot data
# exists.
#
#   1. Run the technical smoke slice each cell_stage1_*.yaml already declares
#      (n_rows: 25/cell x 4 arms) for BOTH candidate directions. This slice
#      doubles as the "Stage-1 pilot": its write-correctness readback gates
#      whether the full arms run at all (existing SmokeConfig machinery), and
#      its GRADED OUTPUT (rows graded by ao_grader.py the same as any other
#      row) is the pilot data this formula reads.
#   2. For EACH candidate direction and EACH of {ablate, shift_down}, compute
#      the pilot-scale movement statistic with the SAME primitive and
#      populations g0_*_movement uses below (bidirectional_gap_diff,
#      baseline_arm=baseline, arm_a=<ablate|shift_down>, arm_b=baseline,
#      cell_field=cell, pos_cell=known_correct_answered,
#      neg_cell=answerable_refused, indicator=refused, seed=20260706,
#      n_boot=10000), but restricted to the 25-rows/cell pilot slice instead
#      of the full 320-row pool.
#   3. Take the (direction, arm) pairing with the LARGEST pilot point estimate
#      (the presumptive winner carried into full-scale adjudication). Read its
#      pilot ci_lo / ci_hi.
#   4. floor := pilot_ci_hi - pilot_ci_lo  (the FULL WIDTH of that pairing's
#      own pilot-scale 95% bootstrap CI on the identical statistic). Rationale:
#      size the required full-run margin against how noisy this exact
#      estimator is on THIS population at pilot scale, rather than reusing a
#      fixed constant borrowed from a different cell (AC's 5pt) or picking a
#      number after seeing the full-run result.
#   5. Add `pass_if_diff: ">= <floor>"` literally to g0_ablate_movement and
#      g0_shift_down_movement below (both directions' invocations reuse the
#      same floor, since it is one shared file), replacing the omission
#      below, and re-run `bin/exp validate` before scoring the full 320-row
#      output.
#
# The movement gates below deliberately OMIT pass_if_diff until step 5 is
# done -- only pass_if_ci_excludes_zero is declared for now, so this file
# parses and validates today (CPU-testable) without a magic number baked in
# before the pilot exists.
# ============================================================================

seed: 20260706
n_boot: 10000   # AMENDMENT: "bootstrap 95% CI (10k resamples)"

gates:
  # --- ablate ---------------------------------------------------------------
  - name: g0_ablate_movement
    primitive: bidirectional_gap_diff
    baseline_arm: baseline
    arm_a: ablate
    arm_b: baseline          # gap(baseline) == 0 identically -> diff reports
                              # gap(ablate) alone, with a real bootstrap CI.
    cell_field: cell
    pos_cell: known_correct_answered   # should stay flat (specificity)
    neg_cell: answerable_refused       # should fall a lot (de-refusal)
    indicator: refused
    row_key_field: row_key
    # pass_if_diff: ">= <floor>"   # PLACEHOLDER -- see formula above, step 5.
    pass_if_ci_excludes_zero: true

  - name: g0_ablate_specificity_refusal_rise
    primitive: count_flips
    arm: ablate
    cell_field: cell
    cell: known_correct_answered
    before: baseline_refused
    after: refused
    from_state: false
    to_state: true
    pass_if_rate: "<= 0.05"

  - name: g0_ablate_specificity_correctness_drop
    primitive: count_flips
    arm: ablate
    cell_field: cell
    cell: known_correct_answered
    before: baseline_correct
    after: correct
    from_state: true
    to_state: false
    pass_if_rate: "<= 0.03"

  # --- shift_down ------------------------------------------------------------
  - name: g0_shift_down_movement
    primitive: bidirectional_gap_diff
    baseline_arm: baseline
    arm_a: shift_down
    arm_b: baseline
    cell_field: cell
    pos_cell: known_correct_answered
    neg_cell: answerable_refused
    indicator: refused
    row_key_field: row_key
    # pass_if_diff: ">= <floor>"   # PLACEHOLDER -- see formula above, step 5.
    pass_if_ci_excludes_zero: true

  - name: g0_shift_down_specificity_refusal_rise
    primitive: count_flips
    arm: shift_down
    cell_field: cell
    cell: known_correct_answered
    before: baseline_refused
    after: refused
    from_state: false
    to_state: true
    pass_if_rate: "<= 0.05"

  - name: g0_shift_down_specificity_correctness_drop
    primitive: count_flips
    arm: shift_down
    cell_field: cell
    cell: known_correct_answered
    before: baseline_correct
    after: correct
    from_state: true
    to_state: false
    pass_if_rate: "<= 0.03"
