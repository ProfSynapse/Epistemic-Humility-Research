# Gemma-4-E4B KV-sharing seam quarantine test. DRAFT until `bin/exp sign`.
#
# Descriptive run-shape config, same convention as the parent
# j-space-cross-family-layer-contrast/cell.yaml (documents the run shape rather
# than literally parsing against the tuner's SteerCellConfig six-block schema).
# Per-model checkpoint/loader/render facts live in families/gemma4-e4b.yaml,
# copied verbatim from the parent. This file holds what is identical across
# every arm.

seed: 20260709

surface:
  substrate: bf16
  adapter: none
  quantization: none
  family: gemma4-e4b
  family_config: families/gemma4-e4b.yaml
  generation:
    max_new_tokens: 200
    min_new_tokens: 1
    do_sample: false
    num_beams: 1
    enable_thinking: false
    eos_resolution: model_lib.resolve_eos_ids (see families/gemma4-e4b.yaml eos block)
  containment:
    committed_row_text: forbidden
    committed_aliases: forbidden
    committed_generations: forbidden
    committed_outputs: aggregate_and_id_manifest_only

# ---- The seam geometry every site index in this experiment depends on ----
# Verified against transformers==5.5.0 models/gemma4/modeling_gemma4.py and the
# pinned checkpoint config. kv_seam_patch.verify_architecture asserts all of it
# at runtime and the experiment stops if any value differs.
kv_seam:
  num_hidden_layers: 42
  num_kv_shared_layers: 18
  first_kv_shared_layer_idx: 24        # blocks 24..41 are KV-shared
  donor_blocks:
    full_attention: 23
    sliding_attention: 22
  store_full_length_kv_blocks: [22, 23]
  site_convention: "hs_N = residual stream at the OUTPUT of decoder block N-1 = input to block N"
  donor_reachability:
    hs15: both_donors        # write at output of block 14; blocks 22 and 23 both still to run
    hs18: both_donors        # write at output of block 17
    hs20: both_donors        # write at output of block 19
    hs22: both_donors        # write at output of block 21; blocks 22 and 23 both see it
    hs23: full_donor_only    # write at output of block 22; only block 23 still to run
    hs24: quarantined        # write at output of block 23; NEITHER donor sees it
    hs38: quarantined        # the parent's site
  note: >-
    "Below the seam" is donor reachability, NOT block index < 24. hs24 is the
    output of block 23 and is fully quarantined. Any site list derived from the
    block index would misclassify it. See AMENDMENT.md "The seam is not where
    'block index < 24' puts it".

# ---- Arms ----
# primary_contrast is pre-stated and does not move after any result.
primary_contrast: A2_vs_A1
# The primary contrast is NOT discriminating on its own. Both live hypotheses
# (KV quarantine; crystallization gap / A_lin) predict the parent's mid-band
# observations identically. They diverge only on the JOINT outcome
# (behavioral delta, A_lin delta) at hs38 across A1/A2 -- because holding the
# site INDEX fixed does not hold the site's REPRESENTATION fixed (hs38 is the
# output of block 37, a KV-SHARED block, so OFF changes blocks 24-37 upstream of
# it; that is the same fact that forces the OFF refits below). The four-outcome
# interpretation rule is pre-stated in gates.yaml
# g0_alin_discrimination_measurement and AMENDMENT.md "The divergence".
primary_contrast_requires: gates.yaml g0_alin_discrimination_measurement
arms:
  - id: A1
    site_hs: 38
    kv_sharing: on
    role: above-seam null replication (parent's site, parent's condition)
  - id: A2
    site_hs: 38
    kv_sharing: off
    role: PRIMARY -- same site, mechanism toggled
  - id: A3
    site_hs: PENDING_G0_ALIN      # hs22 or hs23, by below_seam_site_selection
    kv_sharing: on
    role: below-seam, donor-reachable, unmodified model
  - id: A4
    site_hs: SAME_AS_A3
    kv_sharing: off
    role: 2x2 completion
  - id: A5
    site_hs: 24
    kv_sharing: on
    role: seam-adjacent quarantine control (one or two blocks from A3, unmodified model)
  - id: A6
    site_hs: THE_OTHER_OF_HS22_HS23   # whichever A3 did not take
    kv_sharing: on
    role: the other donor-reachability regime (both donors vs full donor only)
    conditional_on: "A3 has a usable FIT dose"
  # ---- Descriptive shallow ladder. Registered 2026-07-24 (lead), pre-signature,
  # before any GPU work. NON-GATING: D1-D4 do not enter success_rule and enter
  # falsifier_rule only asymmetrically (gates.yaml descriptive_shallow_ladder).
  # Sites are FIXED by registration, not selected by A_lin. No re-extraction:
  # the clean use_cache=True extract already stores all 43 hidden states.
  - id: D1
    site_hs: 15
    kv_sharing: on
    role: shallow ladder, rd 0.357, both donors reachable
  - id: D2
    site_hs: 18
    kv_sharing: on
    role: shallow ladder, rd 0.429, both donors reachable
  - id: D3
    site_hs: 20
    kv_sharing: on
    role: shallow ladder, rd 0.476, both donors reachable
  - id: D4
    site_hs: 23
    kv_sharing: on
    role: shallow ladder, rd 0.548, full donor only
    note: >-
      hs23 is also A6's site if A3 takes hs22. If the two coincide, ONE arm is
      run and reported under BOTH labels with that fact stated -- never run twice
      and never reported as two independent observations.
  - id: C0
    site_hs: null
    kv_sharing: on
    role: no-injection baseline
  - id: C1
    site_hs: null
    kv_sharing: off
    role: PRECONDITION CONTROL (see gates.yaml g0_c1)

# Below-seam site selection is by LINEAR ACCESSIBILITY, pre-stated here before
# any run. Donor reachability admits exactly two below-seam sites (hs22, hs23),
# so there is no free depth parameter -- A_lin only decides which of the two
# becomes A3. The parent's eff_dim-peak rule is NOT used: gemma's profile is flat
# (0.0046-0.0058 over 9 of 10 sweep points, peak std 0.00141 overlapping every
# interior point) and cannot select a site.
below_seam_site_selection:
  rule: "A3 = whichever of hs22/hs23 has the HIGHER A_lin; the other becomes A6"
  tie_break: "|delta A_lin| < 0.01 -> hs22 (the site with broader donor reach)"
  measured_by: gates.yaml g0_alin_site_selection (CPU-only, recommended pre-sign)
  hs38_retained_for_A1_A2_because: "it is the site the parent actually ran, so A1 replicates the parent's site and method rather than choosing a new one. A1 refits its own hs38 direction under ON -- it does NOT reuse the parent's corrupt-derived hs38 artifacts; see inputs_reused.frozen_hs38_direction"

descriptive_contrast:           # NON-GATING; cannot discriminate; not in success_rule
  id: A3_vs_A5
  status: descriptive
  rationale: >-
    Both on the unmodified on-distribution model, one or two blocks apart,
    differing in donor reachability. Immune to every patch artifact, which is its
    only value: if the patch's validity is questioned it still says whether the
    boundary push actuates below the seam.
  why_it_cannot_discriminate: >-
    It is NOT immune to the site-property explanations. Two blocks of computation
    can move A_lin, so the crystallization-gap account predicts an A3-yes/A5-no
    pattern as readily as quarantine does. Controlling DEPTH tightly (2 blocks of
    42) does not control LINEAR ACCESSIBILITY. No configuration of A3/A4/A5/A6
    discriminates the two hypotheses. Excluded from success_rule; retained in the
    falsifier only as a conservatism (see gates.yaml falsifier_rule).
  confound_declaration: >-
    Reported with measured A_lin at BOTH sites. If |A_lin(A3) - A_lin(A5)| > 0.10
    the contrast is ADDITIONALLY declared confounded with the crystallization gap
    (Regime 2) rather than merely non-discriminating. Threshold fixed here,
    before the sweep runs.

other_descriptive_contrasts:    # gate nothing, reported regardless
  - A3_vs_A1                    # does the boundary push actuate anywhere in this model -- CONFOUNDED WITH DEPTH OUTRIGHT (16 blocks)
  - A4_vs_A3                    # does sharing-OFF add anything below the seam
  - A6                          # sliding vs full donor channel
  - D1_D2_D3_A3                 # depth sweep rd 0.357 -> 0.524 at CONSTANT donor reachability (both donors); the one contrast in this design that varies depth alone
  - D4_vs_A5                    # full-donor-only (hs23) vs quarantined (hs24): one block apart, reachability flips

readouts:
  method: >-
    Per arm and per condition: u_d (known-unknown / KU direction), pos_ctrl and
    neg_ctrl, c_hat (orthogonalized boundary-push write direction), fit on this
    experiment's FIT split at that arm's site UNDER THAT ARM'S OWN KV-sharing
    condition. Same fit method and same pinned random_state=20260707 as the
    parent's build_directions.py, which is copied here verbatim.
  refit_policy: >-
    Sharing-OFF arms refit their own directions, tau, and per-site median anchor
    L2 norm on the SAME FIT rows -- the OFF residual stream is a different
    distribution and ON-fitted parameters are not automatically valid under it.
    Doses are matched BY RATIO RUNG, not by absolute magnitude. A non-gating
    ON-fit vs OFF-fit cosine similarity of c_hat and u_d at hs38 is recorded.
  fire_rule: "score_neg_z_d >= tau_frozen"
  write_direction: c_hat
  law: erase_write
  position: anchor_onward

dose_ladder:
  kind: norm_scaled_ratio        # parent R2 revision, inherited verbatim
  ratios: [0.100, 0.153, 0.235, 0.361, 0.554, 0.850, 1.304, 2.000]
  dose_rule: "dose = ratio x that site's own median anchor L2 norm, computed under that arm's own condition"
  usable_rule: "frac_readback_within_tol == 1.0 AND collapse_rate_on_dosed == 0.0 AND FIT confab clean_tighten >= 0.5"
  selection_rule: "highest FIT confab tighten, then lower known-correct cost, then lower ratio"
  source: calibrate_dose.py (copied verbatim from the parent)

inputs_reused:
  pool: parent gemma4-e4b fresh-mined evaluation pool (hash-pinned at sign)
  split: parent FIT/HELD-OUT split, FIT_FRAC=0.40 (hash-pinned at sign)
  frozen_hs38_direction: >-
    NOT REUSED. Resolved by the lead on 2026-07-25, before any GPU work on this
    experiment. This key previously read "parent's frozen hs38 direction/gate
    artifacts (A1 only)", which contradicted readouts.method -- and the parent's
    hs34/hs38/hs42 artifacts are corrupt-derived anyway: they were fit on
    use_cache=False activations, which PROVENANCE.md and the parent's
    AMENDMENT.md:637 record as "uninterpretable, not negative". Reusing them
    would seat a corrupt direction in the very arm that A2 is contrasted
    against (primary_contrast: A2_vs_A1). A1 therefore refits hs38 fresh on
    this experiment's FIT split under sharing ON, exactly like every other arm,
    via `build_directions.py --site-set midband --kv-sharing on`. A1 is a
    replication of the parent's SITE AND METHOD, not of its artifacts.
  note: >-
    Promotion decision OPEN for the lead -- this is the second consumer of the
    parent's POOL and SPLIT (the two keys above; the direction artifacts are no
    longer consumed). See AMENDMENT.md "Open questions at sign" #1.

# CALLER CONTRACT -- applies to EVERY arm, ON and OFF alike. Flipping the sharing
# flag alone CRASHES: transformers builds a 24-entry cache for this config
# (cache_utils.py:1218-1220 truncates by num_kv_shared_layers), so a patched
# shared block calling past_key_values.update(..., 24) raises IndexError on its
# first forward. Reproduced live and fixed by kv_seam_preflight.py (4/4 PASS).
# The fix object is built as Cache(layers=[...]) -- one CacheLayer per block, NO
# slicing. NOT DynamicCache(layers=...): DynamicCache.__init__ takes only
# config= and would re-apply the slice.
# WHY BOTH ARMS, not just OFF: if the two conditions construct the cache
# differently, the A1-vs-A2 difference is sharing-flag PLUS cache-substitution
# versus neither, and the primary contrast is uninterpretable. Preflight check 4
# licenses this -- under sharing ON the 42-entry cache is token-identical AND
# torch.equal logit-bit-identical to stock, so using it everywhere costs nothing.
# Fresh PER CALL -- a Cache is stateful and reuse would leak the previous row's
# K/V. use_cache=False is REJECTED as the toggle (global not local, numerical
# drift, O(T x S_avg) cost). See AMENDMENT.md "The core manipulation".
cache_contract:
  applies_to: ALL arms and ALL conditions (A1-A6, C0, C1; dosed and undosed)
  builder: kv_seam_patch.build_full_length_cache
  api: "Cache(layers=[DynamicLayer | DynamicSlidingWindowLayer per config.layer_types])"
  passed_as: "generate(past_key_values=...)"
  freshness: per generate() call, never reused across rows
  verified_by: >-
    gates.yaml g0_kv_seam_instrument_validity --
    cache_construction_identical_in_both_arms, cache_shape,
    cache_growth_under_off, cache_substitution_noop_under_on

pipeline_stages:
  - alin_sweep.py                                         # G0-ALIN PART 1 (site selection); CPU-only over the parent's cached ON activations. NOT YET WRITTEN. Recommended PRE-SIGN.
  - preflight_kv_seam.py                                  # G0-KV; see gates.yaml. NOT YET WRITTEN.
  - run_contrast.py --arm C0 --kv-sharing on --split fit  # C0/C1 precondition, FIT only
  - run_contrast.py --arm C1 --kv-sharing off --split fit
  - extract_anchor.py --kv-sharing off                    # GPU. No OFF activation cache exists anywhere -- the OFF model has never been run. Feeds BOTH the OFF direction fits and G0-ALIN Part 2.
  - alin_sweep.py --site hs38 --both-conditions           # G0-ALIN PART 2 (discrimination measurement). Identical logit-lens path / FIT row ids / answer-token set; only the activation file differs. LOAD-BEARING: without it the primary contrast discriminates nothing.
  - build_directions.py --site <hs> --kv-sharing <cond>
  - gate_fit.py --site <hs> --kv-sharing <cond>
  - calibrate_dose.py --site <hs> --kv-sharing <cond>
  - run_contrast.py --arm <A*> --mode smoke --n-rows 8
  - run_contrast.py --arm <A*> --mode full
  - rollup.py                                             # per-arm tables + contrasts. NOT YET WRITTEN.

integration_status:
  state: NOT_READY_TO_SIGN
  done:
    - "--kv-sharing {on,off} flag threaded through extract_anchor.py, build_directions.py, gate_fit.py, calibrate_dose.py, run_contrast.py and pipeline.py. build_directions.py and gate_fit.py were NOT on the original list; readouts.refit_policy requires the OFF arms to refit their own directions/tau/median anchor norms, so the condition axis has to reach every fitted artifact, not just the activations."
    - "fresh build_full_length_cache(model) passed as past_key_values= on EVERY generate() call in EVERY arm, ON and OFF alike (OFF raises IndexError without it; ON needs it so the two conditions do not differ in cache construction). Extended to extract_anchor.py's plain forward as well: the CALLER CONTRACT's letter covers generate() only, but its intent -- identical cache construction across conditions -- covers any forward that builds a cache."
    - "harness call-site instrumentation counting build_full_length_cache() vs generate()/forward() invocations per arm, for gates.yaml cache_construction_identical_in_both_arms"
    - "condition field (kv_sharing) written into every output record and manifest, and every artifact filename condition-scoped via kv_seam_patch.condition_artifact. kv_sharing=on is the identity, so historical filenames are byte-for-byte unchanged. Every cross-condition read is fail-closed: a missing OFF artifact RAISES, naming the stage that produces it, rather than silently falling back to ON parameters the arm never fit -- which would make A1-vs-A2 a comparison of an arm against itself."
    - "kv_seam_preflight.py driver for the G0-KV checks, including cache-growth and cache-substitution-no-op (checks 5 and 6, implementing those two gate criteria verbatim). 6/6 PASS, CPU-only, no checkpoint download."
    - "vendored shims for model_lib.render()'s bare-module imports of `backends` and `amendment_ah_stage0_extract`, both now living in this experiment directory. The cross-experiment PYTHONPATH dependency is GONE: the render path resolves with only synaptic-tuner on the path, verified 2026-07-25. backends.py is a RE-EXPORT of the live experiments/common/knowledge_probe/backends.py (resolved repo-root-relative), deliberately not a copy -- copying would fork the render at the moment of copying and let this experiment drift from the convention its inputs were produced under. Both shims are fail-closed: backends.py freezes a sha256 over the render path only (NOT the whole file, which also carries an untouched vLLM backend) plus render_probe_prompt's exact signature; amendment_ah_stage0_extract.py keeps the parent's byte-identical prompt sha256 freeze. Both guards were verified to actually fire. One deliberate change from the parent's copy: absolute paths became repo-root-relative walks, because an absolute path silently binds a worktree run to the canonical checkout's copy of the prompt rather than the one under review."
  missing:
    - "alin_sweep.py for G0-ALIN Part 1 (CPU-only; A3's site is undetermined until it runs)"
    - "alin_sweep.py --both-conditions for G0-ALIN Part 2 (GPU; the primary contrast discriminates nothing without it)"
    - "fired-only G2 companion metric (n_fired_known + Wilson) and the undosed floor, per gates.yaml g2 companion_metrics_reported_always"
    - "rollup.py for the per-arm tables and the pre-stated contrasts"
    - "measured smoke wall-clock timings for instrument.persistence (bin/exp sign refuses without them)"

prerequisites:
  synaptic_tuner: ">= 7a44eb3 (fix/gemma4-decoder-layer-path) -- adds model.language_model.layers to _LAYER_PATHS"

execution:
  lane: local_3090
  gpu_work_by_this_agent: forbidden (draft scaffold only; unsigned)
  gpu_carve_outs:
    - id: donor_projection_diagnostic
      authorized_by: lead, explicitly, 2026-07-25
      scope: >-
        Load google/gemma-4-E4B-it and run donor_diagnostic.py ONLY -- forward
        passes for kv_seam_patch.donor_projection_diagnostic(). No dosing, no
        generation, no arm executes, nothing written to analysis-committed/.
      rationale: >-
        This diagnostic exists to de-risk the design BEFORE signing, so running
        it after signing would invert its purpose. The main run stays blocked by
        gpu_work_by_this_agent above; this carve-out does not lift that.
      status: >-
        RUN 2026-07-25, 4 rows, bf16 on the local 3090. Result: median per-block
        cosine k_proj -0.0024, v_proj -0.0051; largest cosine at any block on any
        row 0.032. Bit-identical across two invocations. The sharing-OFF
        manipulation is STRONG -- the weak-manipulation risk this diagnostic was
        built to detect did NOT materialize, so an A2 null will be informative
        rather than vacuous. Record:
        analysis/gemma4-e4b/donor_projection_diagnostic.json (private).
        AMENDMENT.md "Open questions at sign" #4 is CLOSED.
