question: 'Does a fresh-sampling-seed replication of the caution write at the
  pinned Qwen3.5-4B hs20 operating point (reduced ladder over the registered
  P_CONFAB rows, deterministic F4/F5 screens plus the validated blinded judge
  lane) reproduce the explicit-IDK mode switch and thereby earn the name "IDK
  switch" under three pre-registered claims: endpoint F4 jump (N1), no graded
  hedged intermediate (N2), placebo flatness (N3)?'
prediction: 'All three name-earning gates pass on the fresh generations: F4
  endpoint jump over baseline, hedged share never rising 0.10 over baseline at
  any dose, placebo F4 within its registered band; the name IDK switch is
  earned.'
falsifier: 'Any name-earning gate fails on the fresh generations. Named
  alternatives: instrument-failed (judge decoy floors missed; N2 unadjudicable,
  N1/N3 still reported from deterministic screens) and generation-failed
  (fresh generations fail acceptance; nothing adjudicated).'
