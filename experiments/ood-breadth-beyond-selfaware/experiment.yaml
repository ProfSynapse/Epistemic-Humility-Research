question: Do paper 3's SelfAware behavior and stated-calibration readings, and its
  internal known-unknown readout, transfer to additional known/unknown surfaces (KUQ,
  AmbigQA, BIG-bench known-unknowns) on the same eight checkpoints and the same pinned
  instrument?
prediction: Unknown-side abstention behavior transfers in rank order across arms (Spearman
  rho >= 0.7 vs SelfAware on KUQ and AmbigQA), the stated-confidence collapse transfers
  unchanged (every arm at emitted AUROC to appropriateness <= 0.65 and emitted std
  <= 0.10 on AmbigQA), the internal known-unknown readout still separates the AmbigQA
  answerability boundary (held-out AUROC >= 0.90 on both internal-panel arms), and
  known-side over-refusal levels shift by more than 10 points on at least one surface
  because the new known sides are drawn from different source corpora.
falsifier: On AmbigQA, two or more of the eight arms show emitted AUROC to appropriateness
  >= 0.70 together with emitted std > 0.15, which would make the stated channel surface-dependent
  rather than structurally bottlenecked and would require paper 3's "the verbalized
  number is a collapsed near-constant" sentence to be narrowed to SelfAware in writing.
