# ---------------------------------------------------------------------------
# Run plan
# ---------------------------------------------------------------------------
run_plan:
  concurrency: one_gpu_job_at_a_time
  order_rationale: arms grouped by serving base so adapter-only arms reuse a warm base
  launch_authority: >-
    GPU launch requires explicit PI approval naming the exact stages and lane.
    Registration authorizes nothing on its own.
  stages:
    - {n: 0, name: screen_and_commit_manifests,        gpu: false, est_wall: 1h,     gate: G0}
    - {n: 1, name: add_two_loaders_plus_fixture_tests, gpu: false, est_wall: 1h,     gate: null}
    - {n: 2, name: remerge_contrastive_lora_to_16bit,  gpu: true,  est_wall: 15m,    gate: null}
    - {n: 3, name: selfaware_reparity_for_A2,          gpu: true,  est_wall: 30m,    gate: G1}
    - {n: 4, name: smoke_A1_on_S_AMBIGQA_64_rows,      gpu: true,  est_wall: 10m,    gate: "G2, G3"}
    - {n: 5, name: behavior_panel_8_arms_3_surfaces,   gpu: true,  est_wall: 6.0-10.0h, gate: null}
    - {n: 6, name: internal_panel_extraction_A1_A4,    gpu: true,  est_wall: 20-40m, gate: null}
    - {n: 7, name: probe_fit_and_calibration_reports,  gpu: false, est_wall: 45m,    gate: null}
    - {n: 8, name: aggregate_bootstrap_adjudicate,     gpu: false, est_wall: 2h,     gate: "G4, G5, G6, G7"}
  gpu_budget_hours: 8-12
  gpu_budget_basis: >-
    Stage 5 from the observed cadence of full-SelfAware (n=3369) evals in
    docs/sessions/20260624T183052Z-grpo-centered-stacking-plan.md, whose
    launch-to-completion checkpoints sit at 06:46:57 to 07:08:00, 08:46 to 09:19,
    and 11:15 to 11:46, i.e. roughly 20 to 35 minutes per 3369 rows including
    vLLM model load. At 7418 rows per arm that is 45 to 75 minutes per arm and
    6.0 to 10.0 hours for eight arms. Stages 2, 3, 4 and 6 add roughly 1.2 to 1.6
    hours, of which the internal-panel extraction is 20 to 40 minutes because it
    is forward-only over 2748 rows on two arms with no generation. Total 8 to 12
    GPU-hours, revised up from the 7 to 11 drafted before the internal panel was
    added.
  estimate_status: >-
    Estimated, not measured for this cell. Stage 4's smoke is timed and the
    estimate revised in NOTEBOOK.md before stage 5 launches.
  disk:
    remerged_base_gb: 8
    scored_rows_total_mb: 145        # ~6 MB per arm-surface set x 24
    check_free_space_before: stage_2

