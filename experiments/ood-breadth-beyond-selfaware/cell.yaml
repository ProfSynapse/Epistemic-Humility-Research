excluded_arms:
  - id: grpo-par-true
    reason: >-
      Not among paper 3's eight cited runs, and disqualified independently: of
      the retained rows on these surfaces, 1002/1002 AmbigQA unknown, 23/23
      BIG-bench unknown, 627 KUQ unknown and 44 KUQ known are present in the PAR
      mining pool that produced its training data. For that checkpoint these
      surfaces are training data, not OOD.

# ---------------------------------------------------------------------------
# Surfaces
# ---------------------------------------------------------------------------
surfaces:
  - id: S_KUQ
    role: primary
    source_file: datasets/kuq/knowns_unknowns.jsonl
    sha256: 798d1677f962d11d069f77d1e3db91ad2ddb483a94b697e46bc8ca62ad0aedf6
    license: MIT
    tracked_in_git: true
    loader: ood.load_kuq            # exists, ood.py lines 43-65, registry line 265
    label_rule: unknown_bool_true_means_unknown
    counts:
      unknown: {raw: 3437, drop_duplicate: 955, drop_training_hit: 0, drop_selfaware_overlap: 13, retained: 2469}
      known:   {raw: 3447, drop_duplicate: 10,  drop_training_hit: 169, drop_selfaware_overlap: 197, retained: 3071}
      retained_total: 5540
    retained_unknown_by_category:
      controversial: 490
      future_unknown: 490
      ambiguous: 411
      counterfactual: 403
      false_assumption: 368
      unsolved_problem: 307
    retained_known_by_source: {squad: 1770, hotpotqa: 656, triviaqa: 645}
    correctness_metrics: caveated_not_gated
    correctness_caveat: >-
      ood.py lines 45-47 states KUQ answers are long-form, not strict gold
      aliases, so alias matching under-counts correct answers. Everything
      downstream of appropriateness inherits that noise on this surface's known
      side. Unknown-side metrics and the collapse detectors are primary here.

  - id: S_AMBIGQA
    role: primary
    source_file: datasets/ambigqa/validation.jsonl
    sha256: e0dcbfcd1a27a239cc286b992d799c2119b991f5116e23d044370caa01b146ed
    license: cc-by-sa-3.0
    tracked_in_git: false           # .gitignore:75, whole directory
    loader: ood.load_ambigqa        # NEW, must be added to ood.py before launch
    label_rule: >-
      annotations.type containing only multipleQAs is gold-unanswerable; only
      singleAnswer with non-empty annotations.answer is answerable. Rows whose
      type list contains both (annotator disagreement) are excluded on both
      sides as having no consensus label.
    split_rule: validation_split_whole_no_subsampling
    counts:
      unknown: {raw: 1002, drop_duplicate: 0, drop_training_hit: 0, drop_selfaware_overlap: 0, retained: 1002}
      known:   {raw: 830,  drop_duplicate: 0, drop_training_hit: 0, drop_selfaware_overlap: 0, retained: 830}
      excluded_mixed_annotation_rows: 170
      retained_total: 1832
    known_gold_alias_median: 3
    correctness_metrics: primary
    correctness_note: >-
      The only new surface with clean short-form gold on the known side, so it
      carries the appropriateness-based stated-calibration gates.

  - id: S_BIGBENCH
    role: spot_check_only
    source_files:
      - path: datasets/bigbench-known-unknowns/train.jsonl
        sha256: 4076b8a8ef71381fca4b1310bf6dbaa84c4f0684dab7fd2283f7d74f8025d61c
      - path: datasets/bigbench-known-unknowns/validation.jsonl
        sha256: 25e9170ae27f3a50d6e42c000ce1c052951f0de723d412858c3926daa97f9836
    license: apache-2.0
    tracked_in_git: false           # .gitignore:76, whole directory
    loader: ood.load_bigbench_known_unknowns   # NEW, must be added before launch
    label_rule: targets_equal_Unknown_means_unknown
    question_extraction: first_line_of_inputs_strip_Q_prefix_drop_choice_lines
    counts:
      unknown: {raw: 23, drop_duplicate: 0, drop_training_hit: 0, drop_selfaware_overlap: 0, retained: 23}
      known:   {raw: 23, drop_duplicate: 0, drop_training_hit: 0, drop_selfaware_overlap: 0, retained: 23}
      retained_total: 46
    correctness_metrics: not_computable
    correctness_reason: multiple_choice_only_no_free_form_gold
