# ood-breadth-beyond-selfaware: pinned instrument specification.
#
# Tier-2 exploratory eval cell. Re-runs paper 3's behavior panel and
# stated-calibration panel on three additional known/unknown surfaces, plus an
# internal known-unknown readout panel on AmbigQA only, over the eight
# checkpoints paper 3's Section 7 cites. No training. Generation through vLLM,
# local dgpu lane, one GPU job at a time.
#
# Every count in this file was measured read-only at registration time as the
# pre-sign feasibility probe required by
# .skills/experiment-runner/reference/amendment-vs-lab-notebook.md
# ("Pre-sign feasibility probe: every arm must be constructible from real data").
# The probe touched row membership only, never any outcome.
#
# PUBLIC REPO: this file and every other committed file in this experiment carry
# counts, metrics, shas, and paths only. No question text, no row-level data, no
# generation text. Screened id manifests are written under the experiment's
# gitignored analysis/ directory and are never committed.

posture:
  tier: 2
  surface: exploratory
  pooling: never_pooled_with_locked_headline_matrix
  headline_authority: none
  # PROTOCOL v0.3's locked matrix is the only confirmatory surface and it belongs
  # to paper 2. Paper 3's Section 7 cells are already exploratory
  # (papers/paper-3-knows-but-doesnt-say/manuscript.md, Appendix A "Governance
  # notes"). This cell joins them at the same tier and cannot promote anything.

lane:
  host: local_dgpu_rtx3090
  concurrency: one_gpu_job_at_a_time
  serving: vllm
  docker_image: unsloth/unsloth:latest
  docker_digest: sha256:f21629b9ae4ed11231768edfaed0f40d41d85d6ea9a71e8096a3d96ea0311772
  docker_verb: >-
    docker run -d --name eh-ood-breadth-<stage>-<timestamp> --gpus all --ipc=host
    --entrypoint python3 -e HF_HOME=/workspace/repo/.cache/hf
    -e HUGGINGFACE_HUB_CACHE=/workspace/repo/.cache/hf/hub
    -v "/home/profsynapse/code/Epistemic-Humility-Research:/workspace/repo"
    -w /workspace/repo
    unsloth/unsloth@sha256:f21629b9ae4ed11231768edfaed0f40d41d85d6ea9a71e8096a3d96ea0311772
    archive/experiment/phase1/eval/run_eval.py --config <cfg> --live-vllm
  digest_verification: >-
    The running container's image digest must equal
    sha256:f21629b9ae4ed11231768edfaed0f40d41d85d6ea9a71e8096a3d96ea0311772
    char for char, checked with docker inspect before the stage is treated as
    valid. A digest mismatch voids the stage.

# ---------------------------------------------------------------------------
# Execution location
# ---------------------------------------------------------------------------
execution_location:
  run_from: /home/profsynapse/code/Epistemic-Humility-Research
  reason: >-
    datasets/ambigqa/ and datasets/bigbench-known-unknowns/ are gitignored in
    full (.gitignore lines 75 and 76), dataset cards included, so they do not
    exist in any worktree checkout. The screen and the eval both read them, so
    both run from the canonical checkout. Governed files for this experiment are
    authored in the worktree; nothing in this experiment commits dataset bytes.

