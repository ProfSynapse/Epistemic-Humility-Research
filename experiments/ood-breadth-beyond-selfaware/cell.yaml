behavior_panel_rows_per_arm: 7418        # 5540 + 1832 + 46
behavior_panel_generations_total: 59344  # 7418 x 8 arms

# ---------------------------------------------------------------------------
# Internal known-unknown readout panel (AmbigQA only)
# ---------------------------------------------------------------------------
internal_panel:
  surface: S_AMBIGQA
  size_rows: 2748
  size_basis: >-
    1.5x the 1832-row AmbigQA behavior surface, per the registration decision to
    expand the internal panel by 50 percent over the drafted size.
  composition:
    validation_split_screened: {unknown: 1002, known: 830, total: 1832}
    train_split_topup:         {unknown: 501,  known: 415, total: 916}
    total:                     {unknown: 1503, known: 1245, total: 2748}
  topup_source_file: datasets/ambigqa/train.jsonl
  topup_source_sha256: 6f9f5bd4933c0935ab3cb4d54fa10cd2c13b6d78c44cd24f94edb837dea37f4d
  topup_selection_rule: >-
    Deterministic and stated before the run: screen the AmbigQA train split by
    the same three screens plus a fourth that removes any question already in the
    validation split, then sort the survivors by AmbigQA id as a string and take
    the first N per class. No randomness, no seed, no reshuffle.
  topup_class_ratio_rule: preserve_validation_split_unknown_fraction_0.5469
  topup_availability_at_registration: {unknown_available: 4739, known_available: 5286}
  topup_id_list_sha256: 76a8a7384727958cd78098b27fce1ddc0dbd6a5b515ca46a42fcb2b4d4998580
  superset_property: >-
    The internal panel contains the whole 1832-row behavior surface, so the
    like-for-like internal-vs-emitted contrast is computed on shared rows and the
    916 top-up rows add probe power only.
  arms: [A1, A4]
  arms_rationale: >-
    The two arms in this list for which paper 3 publishes a SelfAware internal
    number, so a like-for-like comparison exists: clean SFT at 0.9968 and
    SFT-to-GRPO-v2 at 0.9971 (manuscript.md lines 387-390), and the GRPO-v2
    like-for-like contrast of internal 0.972 vs emitted 0.637 on n=1233 joined
    rows (manuscript.md lines 359-364).
  layer: 35
  layer_rationale: paper 3 best layer, manuscript.md lines 270-272
  read_position: generation_position    # manuscript.md lines 277-279
  probe_fit: >-
    Logistic probe on residual-stream activations, 5-fold cross-validation, fit
    without correct/wrong leakage, label taken from dataset answerability
    (manuscript.md lines 275-280 and 311-315). Held-out AUROC and the 1-D
    readout's ECE are the reported quantities. Fit is CPU; only the extraction
    pass is GPU.
  gpu_work: forward_only_extraction_no_generation

# ---------------------------------------------------------------------------
# Screens (fail-closed, adjudicated as G0)
# ---------------------------------------------------------------------------
screens:
  method: >-
    normq(text) = re.sub(r"\s+", " ", text.strip().lower()), matched against the
    verbatim user-turn content of every training file. Identical to the pinned
    SelfAware derivation in
    papers/paper-3-knows-but-doesnt-say/analysis/clean_subset_sensitivity_p3.py
    line 186 and to
    experiments/grpo-three-seed-confirmatory/analysis/clean_subset_sensitivity.py,
    so the two derivations are comparable.
  order: [duplicate, training_pool, selfaware_overlap, already_in_validation_split]

  training_pool_union:
    files:
      - {key: sft_clean_train,          path: scratch/schema_response_confidence/qwen3-4b-instruct/sft_response_confidence_train_clean.jsonl,             field: messages,      distinct_user_prompts: 13964}
      - {key: dpo_train,                path: scratch/schema_response_confidence/qwen3-4b-instruct/dpo_response_confidence_train.jsonl,                   field: prompt,        distinct_user_prompts: 13964}
      - {key: kto_train,                path: scratch/schema_response_confidence/qwen3-4b-instruct/kto_response_confidence_train.jsonl,                   field: conversations, distinct_user_prompts: 13964}
      - {key: grpo_train,               path: scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_train.jsonl,                                 field: prompt,        distinct_user_prompts: 13911}
      - {key: grpo_dev,                 path: scratch/schema_response_confidence/qwen3-4b-instruct-grpo/grpo_dev.jsonl,                                   field: prompt,        distinct_user_prompts: 1554}
      - {key: contrastive_train,        path: scratch/schema_response_confidence/qwen3-4b-instruct/sft_response_confidence_train_contrastive.jsonl,       field: messages,      distinct_user_prompts: 13964}
      - {key: contrastive_masked_train, path: scratch/schema_response_confidence/qwen3-4b-instruct/sft_response_confidence_train_contrastive_masked.jsonl, field: messages,     distinct_user_prompts: 13964}
      - {key: probe_factual_train,      path: scratch/schema_response_confidence/qwen3-4b-instruct/sft_response_confidence_train_probe_factual.jsonl,     field: messages,      distinct_user_prompts: 13448}
    union_distinct_user_prompts: 15465
    grpo_dev_included: true
    grpo_dev_rationale: >-
      Checkpoint-selection exposure is exposure. The 2026-08-07 post-resolution
      addendum in experiments/grpo-three-seed-confirmatory/NOTEBOOK.md lines
      1835-1839 corrected the SelfAware accounting to a 128-question union of 117
      gradient-training hits plus 11 that leak only into grpo_dev, and records
      that the red team missed the dev-split leg by checking train files only.

  selfaware_reference:
    path: datasets/selfaware/SelfAware.json
    sha256: b34a468549dc4c38d080af3a6871ba58ded7fbfc319b1ee606702f0354cee513
    rationale: >-
      A surface that shares rows with SelfAware cannot be evidence that a
      SelfAware result generalizes.

  measured_at_registration:
    kuq_known_training_hits: 169
    kuq_unknown_training_hits: 0
    kuq_selfaware_overlap_total: 220        # 207 known + 13 unknown
    kuq_selfaware_overlap_attributed_at_that_step: 210   # 197 known + 13 unknown
    kuq_selfaware_attribution_note: >-
      10 of the 207 overlapping known questions are removed by the earlier
      duplicate and training-pool steps, so the ordered screen attributes 197 to
      the SelfAware step. Both figures are stated so neither is mistaken for the
      other.
    kuq_contamination_mechanism: >-
      KUQ's known side is drawn from SQuAD (1928), TriviaQA (854) and HotpotQA
      (665); paper 3's training data is TriviaQA-RC via the Cheng recipe
      (manuscript.md lines 263-266). Unscreened KUQ is not an OOD surface for
      known-side metrics.
    ambigqa_training_hits_validation_split: 0
    ambigqa_training_hits_train_split: 1
    bigbench_training_hits: 0

  par_pool_overlap:
    binding_for_registered_arms: false
    pools:
      - archive/experiment/phase1-data/probe/analysis/par_design/mining_candidates_v2.jsonl
      - experiments/residual-catch-veto-coverage/analysis/phase1-migrated/probe/analysis/am_residual_catch/am_pool.jsonl
    pool_distinct_questions: 10759
    measured_overlap_with_retained_rows:
      ambigqa_unknown: 1002
      bigbench_unknown: 23
      kuq_unknown: 627
      kuq_known: 44
    interpretation: >-
      Expected, because those pools were mined from these datasets. Not
      contamination for arms A1-A8, none of which trains on the PAR pool. It is
      a standing disqualification for any PAR-trained checkpoint (see
      excluded_arms).

  outputs:
    script: experiments/ood-breadth-beyond-selfaware/screen_ood_surfaces.py
    manifests_dir: experiments/ood-breadth-beyond-selfaware/analysis/screen/
    committed_surface: >-
      Counts by drop reason, input shas, and the sha256 of each retained id list.
      The id lists themselves stay under the gitignored analysis/ directory,
      matching the repo's existing containment posture for AmbigQA and BIG-bench
      (.gitignore lines 75-76). No question text is committed anywhere.
    consumed_by_eval_as: pre_filtered_surface_jsonl_under_analysis
    consumption_rationale: >-
      run_eval.py's offset/limit (lines 736-767) slices by position and cannot
      express "drop these 169 specific rows", so the screen manifest is the only
      way to make the screen binding at row level.

# ---------------------------------------------------------------------------
# Rendering and scoring: byte-identical to the SelfAware panels
# ---------------------------------------------------------------------------
rendering_and_scoring:
  parity_rule: same_pipeline_same_config_surface_swapped_only
  parity_precedent: >-
    docs/preparation/amendment-ai-cloud-verdict-cells.md lines 179-181 records
    that panel parity requires the same pipeline and config on the same surface
    with only the checkpoint swapped, and that a wrong-pipeline comparison is
    worse than a late one.
  reference_config: archive/experiment/phase1/eval/config/eval_amendment_e_response_confidence_selfaware_clean_sft_grpo_v2_seed1_corrected_base_full_local_4b.yaml

  carried_over_unchanged:
    system_prompt: verbatim_json_answer_plus_response_confidence_contract
    generation:
      enable_thinking: false
      seed: 20240601
      temperature: 0.0
      max_new_tokens: 128
      n_samples: 1
      stated_confidence_structured_outputs: true
      stated_confidence_field: response_confidence
      stated_confidence_json_retries: 2
    vllm:
      dtype: auto
      max_lora_rank: 32
      max_model_len: 2048
    bootstrap:
      n_resamples: 200
      level: 0.95
      seed: 12345
    behavior_scoring: scorers.score_quadrants + scorers.metrics_from_quadrants   # scorers.py lines 224-291
    stated_calibration: calibration_gap_report.py Analysis A only                # --scored, no --overlay, no --extraction

  declared_deviations:
    - id: D1
      what: gold_path is populated but unused on these surfaces
      why: >-
        The SelfAware configs point gold_path at the TriviaQA cheng_test_gold
        lookup. Surfaces S_KUQ, S_AMBIGQA and S_BIGBENCH carry gold inline per
        record, which scorers._aliases_for_record (scorers.py lines 185-196)
        already prefers. gold_path stays populated so the config validates; the
        run manifest records that no lookup hit fired. No behavioral change.
    - id: D2
      what: two new loaders added to ood.py plus their registry entries
      why: >-
        load_ambigqa and load_bigbench_known_unknowns do not exist. Additive
        only; no existing loader, scorer, or metric formula is touched. ood.py's
        pre-change sha256 is recorded under frozen_inputs so the diff is
        auditable as additive.
    - id: D3
      what: surfaces are consumed from the screened manifest, not from raw files with offset/limit
      why: see screens.outputs.consumption_rationale

  reporting_constraint_correct_on_known:
    formula: correct_known / answered_known        # scorers.py line 287
    denominator: filtered_excludes_refused_known_rows
    rule: never_quote_without_denominator_and_raw_count
    source: >-
      docs/sessions/20260806T115256Z-grpo-three-seed-confirmatory-seed-3-chain-and-g1-adjudication.md
      line 190 records that this metric rose from 47.49 to 55.05 while the raw
      correct count fell from 455 to 403, and rules it blocked from any write-up
      unless quoted with its denominator and raw count.
    safe_to_quote_bare: [refusal_recall_pct, answer_on_unknown_pct, over_refusal_pct]
    safe_because: unconditional_full_class_denominators

# ---------------------------------------------------------------------------
# Config granularity
# ---------------------------------------------------------------------------
configs:
  granularity: 8_multi_surface_configs
  rationale: >-
    run_eval.py accepts multiple entries under eval_sets; the precedent is
    archive/experiment/phase1/eval/config/eval_broader_ood_evidence_local_4b.yaml,
    which runs four sets in one config. One config per arm loads each model once,
    which matters on a serial local lane. Per-surface result directories are
    preserved.
  to_be_created: 8    # one per arm, templated from reference_config
  pin_requirement: >-
    The 8 arm configs, screen_ood_surfaces.py, and the ood.py loader diff must be
    listed under experiment.yaml instrument.modules and pinned before stage 0
    runs. They do not exist at registration, so they are not listed yet; adding
    them is a pre-launch step, not a post-hoc repin.

