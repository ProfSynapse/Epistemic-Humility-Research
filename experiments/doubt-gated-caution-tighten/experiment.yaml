question: On the raw-base untrained instruct (Qwen3-4B, no adapter), does a doubt-threshold
  GATE that snaps only fired rows to a fixed caution-direction setpoint, measured
  end-to-end on a held-out split the direction fit and tau choice never touched, selectively
  tighten confabulations into coherent refusals while leaving known-correct answers
  largely unrefused?
