  and net known-correct false-refusal <= 5% (diagnostic estimate ~1.6%), with placebo
  controls (random-direction, permuted-gate) showing no selective tightening.
falsifier: G1 fails (net confab clean_tighten < 60% or its Wilson lower CI does not
  exceed 50%) OR G2 fails (net known-correct false-refusal > 5% or its Wilson upper
  CI is not below 10%) - doubt-gated snap is not a selective tighten instrument on
  this substrate (null). No goalpost-moving after the result.
