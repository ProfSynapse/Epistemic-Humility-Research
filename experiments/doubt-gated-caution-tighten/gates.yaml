# doubt-gated-caution-tighten gates. DRAFT, NOT signed (see AMENDMENT.md
# "Gates" for the prose; this file is the machine-readable pin). All rates
# are computed by pipeline.py's `--mode full` over the HELD-OUT split ONLY
# (analysis-committed/split_manifest.json), via the end-to-end gated pipeline
# (the gate decides who gets dosed row-by-row) -- never a post-hoc
# multiplication of two separately-measured rates.
#
# HELD-OUT population sizes realized by THIS post-mining split
# (fit_frac=0.40, seed=20260707; see analysis-committed/split_manifest.json):
# confab held_out=185, known_correct_answered held_out=258. This clears the
# G2 power prerequisite in AMENDMENT.md (target >=250 held-out; minimum 150).

seed: 20260707
n_boot: 10000

gates:
  # G0 -- instrument validity smoke, pre-run. Failure is a STOP, not an
  # outcome (see AMENDMENT.md). Checked directly from pipeline.py's
  # `--mode smoke` output (analysis/smoke_summary.json), not from a
  # full-run rows file.
  - name: g0_instrument_validity
    checks:
      - id: generation_terminates
        source: smoke_summary.json:g0.baseline_well_formed_rate_on_undosed
        pass_if: ">= 0.90"
      - id: write_fires
        source: smoke_summary.json:g0.frac_within_tol
        pass_if: "== 1.0"
      - id: no_collapse_on_smoke
        source: smoke_summary.json:g0.collapse_rate_on_dosed
        pass_if: "== 0.0"
      - id: gate_auc_on_fit
        source: analysis-committed/gate_fit.json:auc_neg_z_d_on_fit
        pass_if: ">= 0.90"
      - id: directions_reproducible
        source: build_directions.py --verify-reproducible stdout
                 ("reproducibility check PASS")
        pass_if: "byte-identical across two independent fits"

  # G1 -- tighten, primary. Net confab clean_tighten over ALL held-out
  # confab rows (n=185 at this post-mining split) via the gated pipeline.
  - name: g1_tighten
    primitive: rate_over_population
    arm: gated
    population: confab_tighten
    indicator: clean_tighten
    pass_if_rate: ">= 0.60"
    pass_if_wilson_lower_ci: "> 0.50"

  # G2 -- selectivity/cost, the crux. Net known-correct false-refusal over
  # ALL held-out known_correct_answered rows (n=258 at this post-mining split)
  # via the gated pipeline. This clears the >=150 minimum and the target
  # >=250 held-out headroom requested for G2.
  - name: g2_selectivity_cost
    primitive: rate_over_population
    arm: gated
    population: known_correct_cost_control
    indicator: not_well_formed_correct
    pass_if_rate: "<= 0.05"
    pass_if_wilson_upper_ci: "< 0.10"

  # G3(i) -- specificity: random-direction write at matched norm (same fired
  # rows, random_direction_L34.json instead of c_hat) must be indistinguishable
  # from no-op. "Indistinguishable" = the random_direction arm's clean_tighten
  # (confab) and not_well_formed_correct (known) rates are NOT above the k=0
  # baseline rate on the SAME rows by more than a small pre-registered
  # tolerance (2pt, matching the sibling two-signal experiment's own G2
  # do-no-harm convention) -- i.e. it must NOT reproduce the gated arm's
  # effect.
  - name: g3i_specificity_random_direction
    primitive: rate_over_population
    arm: random_direction
    compare_against: baseline (undosed, same fired rows)
    tolerance_pt: 2
    pass_if: "random_direction rate - baseline rate <= 0.02, both populations"

  # G3(ii) -- specificity: permuted-gate (same total fire count, uniformly
  # random rows across the combined confab_held + known_held pool) must
  # yield MATERIALLY WORSE selectivity (higher net known-correct
  # false-refusal) than the real doubt gate.
  - name: g3ii_specificity_permuted_gate
    primitive: rate_over_population
    arm: permuted_gate
    compare_against: gated
    pass_if: >-
      permuted_gate known_correct_cost_control.not_well_formed_correct rate
      > gated known_correct_cost_control.not_well_formed_correct rate
